              state.activeQuests.push({ questId:"p1", zoneId:"greenhollow", heroIds:[h], completesAt: nowMs()+9e6 },
                                      { questId:"p2", zoneId:"marrowfen",  heroIds:[h], completesAt: nowMs()+9e6 }); },
      () => { state.activeQuests = state.activeQuests.filter(q => q.questId !== "p1" && q.questId !== "p2"); }],
    // The id must be BUILT at runtime, never written as a literal: the scan reads
    // the page's own source, so a literal here would count as a reference to
    // itself and the probe would silently pass.
    ["an orphaned sprite symbol", "no unused sprite symbols",
      () => { keep.sym = "sym-" + "probe" + Math.random().toString(36).slice(2, 8);
              const s = document.createElementNS("http://www.w3.org/2000/svg", "symbol");
              s.id = keep.sym; document.querySelector("defs").appendChild(s); },
      () => { const s = document.getElementById(keep.sym); if (s) s.remove(); }],
    ["a <use> pointing at nothing", "every <use href> resolves",
      () => { keep.use = "sym-" + "missing" + Math.random().toString(36).slice(2, 8);
              const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
              u.setAttribute("href", "#" + keep.use); u.id = "probe-use-node";
              document.querySelector("defs").appendChild(u); },
      () => { const u = document.getElementById("probe-use-node"); if (u) u.remove(); }],
    ["role coverage ignoring distinctness", "role coverage counts distinct roles only",
      () => { keep.rc = CONFIG.ROLE_COVERAGE_PER_ROLE; CONFIG.ROLE_COVERAGE_PER_ROLE = 0; },
      () => { CONFIG.ROLE_COVERAGE_PER_ROLE = keep.rc; }],
    ["decay ignoring the influence floor", "decay respects the influence floor",
      () => { keep.h = CONFIG.TIERS[3].decayPerHour; CONFIG.TIERS[3].decayPerHour = -5; },
      () => { CONFIG.TIERS[3].decayPerHour = keep.h; }],
    // NOT by renaming the hero: the check looks the name up from the same table,
    // so the probe would move with it and pass. Remove the identity itself.
    ["an unversioned save losing hero identity", "migration lifts an unversioned save",
      () => { keep.hk = STARTING_HEROES[0].hook; delete STARTING_HEROES[0].hook; },
      () => { STARTING_HEROES[0].hook = keep.hk; }],
    ["a same-version save keeping a dead trait id",
      "loading sanitises a save already at the current version",
      () => { keep.c2 = TRAITS.cautious; delete TRAITS.cautious; },
      () => { TRAITS.cautious = keep.c2; }],
    ["a hero with a bad home zone", "heroes are fully authored",
      () => { keep.hz = STARTING_HEROES[1].homeZone; STARTING_HEROES[1].homeZone = "nowhere"; },
      () => { STARTING_HEROES[1].homeZone = keep.hz; }],
    ["a live hero stripped of traits", "loaded heroes keep their identity",
      () => { keep.t = state.heroes[0].traits.slice(); state.heroes[0].traits = []; },
      () => { state.heroes[0].traits = keep.t.slice(); }],
    // Stop the v1 case from running at all, which is the failure that matters:
    // deleting a trait no longer touches migrate() now that sanitising moved out.
    ["the v1 migration step never running", "migration restores a v1 roster",
      () => { keep.sv = CONFIG.SAVE_VERSION; CONFIG.SAVE_VERSION = 1; },
      () => { CONFIG.SAVE_VERSION = keep.sv; }],
    ["a trait whose zone id is a typo", "no inert trait",
      () => { keep.fa = TRAITS.fenWise.apply;
              TRAITS.fenWise.apply = (acc, h, ctx) => { if (ctx.zoneId === "marrowfenn") acc.powerMult *= 2; }; },
      () => { TRAITS.fenWise.apply = keep.fa; }],
    ["an unread TRAIT_VALUES key", "no dead TRAIT_VALUES",
      () => { V.__probeUnread = 1; }, () => { delete V.__probeUnread; }],
    ["a trait with no description", "every trait is well formed",
      () => { keep.gd = TRAITS.grim.desc; TRAITS.grim.desc = () => "x"; },
      () => { TRAITS.grim.desc = keep.gd; }],
    ["Cautious neutralised", "traits reach the real formulas",
      () => { keep.ci = V.cautiousInjury; V.cautiousInjury = 1; },
      () => { V.cautiousInjury = keep.ci; }],
    ["Fen-Wise neutralised", "the drawer's rows and its odds agree",
      () => { keep.fw = V.fenWisePower; V.fenWisePower = 1; },
      () => { V.fenWisePower = keep.fw; }],
    ["Ironbound waiving fatigue GAIN instead of the penalty",
      "Ironbound tires, it just does not suffer for it",
      () => { keep.ib = TRAITS.ironbound.apply;
              TRAITS.ironbound.apply = acc => { acc.fatigueGainMult *= 0; }; },
      () => { TRAITS.ironbound.apply = keep.ib; }],
    ["a function smuggled into the save", "nothing unserialisable reaches the save",
      () => { state.heroes[0].__probeFn = function(){}; },
      () => { delete state.heroes[0].__probeFn; }]
  ];

  const before = assertAll();
  // The whole suite runs twice per probe, so a full sweep is now well over a
  // hundred suite runs and long enough that the tool driving it can be killed
  // mid-flight -- which reads exactly like probes failing to restore. `slice`
  // runs a contiguous range of probes so a sweep can be done in chunks that
  // each finish. Coverage bookkeeping below always considers ALL probes, so a
  // chunk never falsely reports an assertion as uncovered.
  const lo = (opts && opts.from) || 0;
  const hi = (opts && opts.to !== undefined) ? opts.to : P.length;
  const results = P.slice(lo, hi).map(([label, expect, brk, restore]) => {
    let caught = false, saw = null;
    try {
      brk();
      const r = assertAll();
      const hit = r.fails.filter(f => f.indexOf(expect) === 0);
      caught = hit.length > 0;
      saw = hit[0] || null;
    } catch (e) {
      saw = "probe threw: " + e.message;
    } finally { try { restore(); } catch (e) {} }
    const after = assertAll();
    // Carry the actual failures: "a probe did not restore" with no message is
    // undiagnosable, and that is exactly when you most want to know why.
    return { probe: label, check: expect, caught, saw,
             restoredClean: after.pass, afterFails: after.fails };
  });

  // Two checks have no runtime lever to break them, and pretending otherwise
  // would be worse than saying so. Both are listed with the reason, and both
  // still count as gaps -- just declared ones.
  const UNPROBEABLE = {
    "a styled quest card actually wears its class":
      "guards that a CSS rule and the code that applies its class stay wired together. " +
      "No constant adds or removes a class name from a string concatenation, and every " +
      "lever that looks usable -- pushing the Reclaim threshold out of reach, say -- " +
      "makes the check fail because there is no card to inspect rather than because " +
      "the class went missing, which is the wrong reason and would prove nothing",
    "only one dialog is ever on screen":
      "guards WHICH FLAGS showReport() and showHelp() consult before opening, and that " +
      "closing the tutorial chains into a deferred report. No constant adds or removes " +
      "a condition from an if, and every lever that could be perturbed either stops a " +
      "dialog opening at all (so nothing can stack, and the bug cannot manifest) or " +
      "leaves both guards untouched -- the probe-that-prevents-the-bug trap",
    "the tutorial names every system":
      "the tutorial is GENERATED from the same tables this check reads, so every runtime " +
      "lever moves both sides together and any probe against it is a tautology. Renaming " +
      "a quest type renames it in the table too. What it actually guards is a section " +
      "being deleted or gutted by a source edit, which has no runtime lever at all -- " +
      "the probeable half of the tutorial is 'states the design's own numbers', whose " +
      "expectations are DESIGN.md literals that CONFIG cannot move",
    "injury is rolled before this quest's own fatigue is added":
      "reads statement order in the source; nothing at runtime can reorder it",
    "running the suite leaves the game untouched":
      "compares the start and end of a single run, so no outside probe can perturb it",
    "the hurt risk shown is the hurt risk rolled":
      "compares previewQuest against resolveQuest; both read the same constants, so no " +
      "external lever can make them disagree -- only a code change can, which is the point",
    "a hero already at Grievous cannot farm Marks":
      "the bug it guards was one line sitting outside its branch; no constant can put " +
      "it back, and every probe that tries instead stops the bug manifesting at all",
    "a wound taken at the end of a quest is not charged for field hours":
      "guards a one-line `sameWound` condition; the expected value is derived from the " +
      "same INJURY_SEVERITIES the code reads, so every constant moves both sides together",
    "an upgrade never takes payment without delivering":
      "guards the ORDER of two statements -- raise the level, then debit. Every constant " +
      "that could be perturbed either makes the upgrade unaffordable (the refusal path, " +
      "which is already safe) or leaves the order untouched",
    "nothing that arrives while the report is open is lost":
      "guards WHERE the pending queue is cleared -- on open rather than on close. No " +
      "constant moves that; only editing the two statements does",
    "durations never render sixty minutes":
      "fmtDurLong is a pure function checked against literal inputs and literal expected " +
      "strings, so there is no configuration surface to perturb",
    "a raid in flight does not spawn another":
      "guards that deploy() carries the incursion flag onto the active quest. No constant " +
      "adds or removes a field; every probe that lowers the threshold simply keeps the " +
      "guard true and stops the bug manifesting",
    "a hero in the field cannot be re-branched underneath their own quest":
      "guards a one-line status check in chooseSubclass. No constant adds or removes " +
      "a guard, and anything that blocks branching entirely stops the bug manifesting",
    "a long absence rotates through events instead of freezing one":
      "guards the segmented loop inside advance(). Lengthening every event still leaves the " +
      "FIRST one expiring inside the window, so rotation happens anyway -- only deleting the " +
      "loop reproduces the bug, and that is a code change"
  };

  const covered = new Set(P.map(p => p[1]));
  const uncovered = before.names.filter(n => !covered.has(n) && !UNPROBEABLE[n]);
  const declaredUnprobeable = before.names.filter(n => !!UNPROBEABLE[n])
    .map(n => n + " — " + UNPROBEABLE[n]);
  const unknown = [...covered].filter(c => before.names.indexOf(c) < 0);

  return {
    baselineClean: before.pass,
    checks: before.count,
    probes: results.length,
    probeTotal: P.length,
    range: [lo, Math.min(hi, P.length)],
    missed: results.filter(r => !r.caught),
    notRestored: results.filter(r => !r.restoredClean),
    uncovered,                       // assertions never shown to fail -- look here
    declaredUnprobeable,             // known gaps, with the reason stated
    probesNamingNoSuchCheck: unknown, // a renamed check that left its probe behind
    ok: results.every(r => r.caught && r.restoredClean) &&
        unknown.length === 0 && assertAll().pass &&
        (results.length === P.length ? uncovered.length === 0 : true)
  };
}

/* ============================================================ HARNESS =====
   Answers open decision #4: is the decay actually a threat, or does hero
   throughput swamp it? Deterministic -- expected values, no dice -- so the
   number is arguable rather than anecdotal.
   ========================================================================= */
function simulate(opts){
  const o = Object.assign({ days:14, heroCount:6, strategy:"spread", stepMin:5,
                            questType:"clear", level:1, subclass:null }, opts || {});
  const zones = CONFIG.ZONES.map(z => ({ id:z.id, danger:z.danger, travel:z.travel,
                                         influence:0, influenceFloor:0, rival:0 }));
  // Hero-shaped so the real effectivePower()/traitEffects() run against them --
  // a harness that models power its own way stops measuring the actual game.
  const roster = STARTING_HEROES.slice(0, o.heroCount).map(h => {
    const p = { name: h.name, cls: h.cls, role: h.role, homeZone: h.homeZone,
      traits: (h.traits || []).slice(), marks: [], attrs: Object.assign({}, h.attrs),
      injury: { severity:null, healsAt:0 }, fatigue: 0, level: 1, xp: 0,
      subclass: null, freeAt: 0 };
    // Grow them to the requested level, and branch if they have reached it, so
    // the harness measures the roster the player will actually have rather than
    // the level-1 one every earlier figure assumed.
    if (o.level > 1){ p.xp = xpToReach(o.level); applyLevels(p); }
    if (o.subclass && p.level >= CONFIG.SUBCLASS_LEVEL){
      const list = CONFIG.SUBCLASSES[p.cls] || [];
      const want = list.filter(s => s.id === o.subclass[p.cls])[0] || list[0];
      if (want) p.subclass = want.id;
    }
    p.presence = p.attrs.presence;
    return p;
  });
  const targets = o.strategy === "focus2" ? zones.slice(0, 2)
                : o.strategy === "focus1" ? zones.slice(0, 1) : zones;

  let t = 0, sent = 0, gained = 0, lostToDecay = 0;
  const stepMs = o.stepMin * 60000, totalMs = o.days * 86400000;
  const pending = [];

  while (t < totalMs){
    // decay
    zones.forEach(z => { lostToDecay += applyDecay(z, o.stepMin / 60); });
    // completions
    for (let i = pending.length - 1; i >= 0; i--){
      if (pending[i].at <= t){
        const p = pending[i];
        const z = zones.find(x => x.id === p.zoneId);
        const ev = p.chance * p.influence - (1 - p.chance) * CONFIG.FAIL_INFLUENCE_PENALTY;
        const before = z.influence;
        z.influence = clamp(0, CONFIG.INFLUENCE_MAX, z.influence + ev);
        gained += z.influence - before;
        pending.splice(i, 1);
      }
    }
    // dispatch: idle heroes in pairs, to the target with the lowest influence
    const idle = roster.filter(h => h.freeAt <= t);
    const req = CONFIG.QUEST_TYPES[o.questType].min;
    for (let i = 0; i + req <= idle.length; i += req){
      const party = idle.slice(i, i + req);
      const z = targets.slice().sort((a, b) => a.influence - b.influence)[0];
      const ctx = { zoneId: z.id, danger: z.danger, failed: false };
      const type = CONFIG.QUEST_TYPES[o.questType];
      const power = partyPower(party, req, ctx, type.stat);
      const locked = z.rival >= CONFIG.RIVAL_LOCK_AT;
      const diff = questDifficulty(o.questType, req, z.danger)
                 * (locked ? CONFIG.RIVAL_LOCK_DIFFICULTY_MULT : 1);
      const chance = successChance(power / diff);
      const length = type.lengths[type.lengths.length - 1];
      const dur = CONFIG.DURATION_MS[length] * (1 + z.travel);
      const pres = party.reduce((n, p) => n + p.presence, 0);
      const gain = type.warfrontInfluence
        ? CONFIG.INFLUENCE_GAIN.warfront : CONFIG.INFLUENCE_GAIN[length];
      pending.push({ at: t + dur, zoneId: z.id, chance,
        influence: gain * type.influenceMult
                 * (1 + pres * CONFIG.PRESENCE_INFLUENCE_PER_POINT)
                 * (1 + partyInfluenceBonus(party, ctx)) });
      party.forEach(p => { p.freeAt = t + dur; });
      sent++;
    }
    t += stepMs;
  }
  return {
    strategy: o.strategy, days: o.days, heroes: o.heroCount, questsSent: sent,
    influenceGained: round1(gained), influenceLostToDecay: round1(lostToDecay),
    finalTiers: zones.map(z => CONFIG.TIERS[tierIndexFor(z.influence)].name),
    final: zones.map(z => z.id + " " + round1(z.influence)),
    zonesAtHonored: zones.filter(z => tierIndexFor(z.influence) >= CONFIG.WIN_MIN_TIER).length
  };
}

function decayVsThroughput(){
  const rows = ["spread","focus2","focus1"].map(s => simulate({ strategy:s, days:21 }));
  const upkeepAtWin = CONFIG.WIN_ZONE_COUNT * CONFIG.TIERS[CONFIG.WIN_MIN_TIER].decayPerHour * 24;
  return { upkeepAtWinPerDay: round1(upkeepAtWin), runs: rows };
}

/* Run the whole suite at every Keep configuration. Two Phase 4 checks hardcoded
   the base heal and rest rates, so they passed on a fresh save and broke the
   moment an Infirmary existed -- a class of failure the suite cannot see while it
   only ever runs against default state. Too slow for boot; kept as a tool to run
   after touching anything the Keep modifies. */
function sweepKeep(){
  const real = state;
  const B = CONFIG.BUILDINGS;
  const ids = Object.keys(B);
  const failures = [];
  const seen = new Set();
  let combos = 0;

  const run = keep => {
    const sig = ids.map(i => keep[i]).join(",");
    if (seen.has(sig)) return;
    seen.add(sig);
    state = JSON.parse(JSON.stringify(real));
    state.keep = keep;
    combos++;
    const r = assertAll();
    if (!r.pass)
      failures.push(ids.map(i => i + " " + keep[i]).join(", ") + ": " + r.fails.join(" | "));
  };
  const base = () => { const k = {}; ids.forEach(i => { k[i] = B[i].start; }); return k; };

  try {
    // Pass A: every level of every building on its own. Stepping only 0 and max
    // meant a data error at an intermediate level -- War Room 3, where `preview`
    // turns on -- was never visited by any configuration.
    ids.forEach(id => {
      for (let lv = B[id].start; lv <= B[id].max; lv++){
        const k = base(); k[id] = lv; run(k);
      }
    });
    // Pass B: interactions, at the corners plus one mixed middle.
    const corners = [
      () => base(),
      () => { const k = {}; ids.forEach(i => { k[i] = B[i].max; }); return k; },
      () => { const k = {}; ids.forEach((i, n) => { k[i] = n % 2 ? B[i].max : B[i].start; }); return k; },
      () => { const k = {}; ids.forEach((i, n) => { k[i] = n % 2 ? B[i].start : B[i].max; }); return k; },
      () => { const k = {}; ids.forEach(i => { k[i] = Math.max(B[i].start, Math.floor(B[i].max / 2)); }); return k; }
    ];
    corners.forEach(f => run(f()));
  } finally { state = real; }
  return { combos, failures, ok: failures.length === 0 };
}

/* ------------------------------------------------------- sweepPlay ------
   sweepKeep() sweeps the BUILDING space. This sweeps the PLAY space, and it
   exists because two assertions were caught assuming a premise they never
   stated: both cloned the live save, and both broke the first time the suite
   ran while a hero was actually in the field. One reported "a valid branch was
   refused" (branching is refused mid-quest, correctly) and the other "decay
   stopped after the win" (a quest resolving in the window added influence
   before decay took any). Neither was a bug in the game. Both were checks that
   only ever ran against a Keep where nothing was happening.

   The suite runs on every boot against whatever the player's save looks like,
   so every shape below is a shape it will really meet. Run this after touching
   any assertion that clones live state.
   ------------------------------------------------------------------------ */
function sweepPlay(){
  const real = state, wasDisarmed = savesDisarmed;
  const wasHelp = helpOpen, wasReport = reportOpen;
  const liveScrims = [...document.querySelectorAll(".scrim")];
  liveScrims.forEach(n => n.remove());
  savesDisarmed = true;            // some shapes call deploy(), which saves
  const failures = [];
  const run = (name, mutate) => {
    state = JSON.parse(JSON.stringify(real));
    try { mutate(state); } catch (e){ failures.push(name + ": setup threw " + e.message); return; }
    const r = assertAll();
    if (!r.pass) failures.push(name + ": " + r.fails.join(" | "));
  };
  const sev = CONFIG.INJURY_SEVERITIES;

  try {
    run("fresh", () => {});
    run("a party in the field", s => {
      const q = s.zones[0].slate[0];
      if (!q) return;
      state = s;                                    // deploy() reads the global
      deploy(q, s.heroes.filter(h => h.status === "idle").slice(0, q.required));
    });
    run("several parties out at once", s => {
      // Through deploy(), not by setting status by hand: a hero flagged
      // "deployed" with no quest behind them is not a state the game can reach,
      // and generating one only trips the assertion that exists to catch it.
      state = s;
      s.zones.forEach(z => {
        const q = z.slate[0];
        const idle = s.heroes.filter(h => h.status === "idle");
        if (q && idle.length >= q.required) deploy(q, idle.slice(0, q.required));
      });
    });
    run("the whole roster hurt", s => {
      s.heroes.forEach((h, i) => {
        h.injury = { severity: sev[i % sev.length].id, healsAt: nowMs() + 3600000 };
        h.fatigue = 60;
      });
    });
    run("marked and levelled", s => {
      const ids = Object.keys(MARKS);
      s.heroes.forEach((h, i) => {
        h.level = CONFIG.SUBCLASS_LEVEL;
        h.marks = [{ id: ids[i % ids.length], zoneId: s.zones[0].id, atMs: 0 }];
      });
    });
    run("already won", s => {
      s.zones.forEach(z => { z.influence = CONFIG.TIERS[CONFIG.WIN_MIN_TIER].min + 10; });
      s.won = true; s.wonAt = nowMs();
    });
    run("contested everywhere", s => {
      s.zones.forEach(z => { z.rival = CONFIG.RIVAL_LOCK_AT + 5; z.influence = 25; });
    });
    run("consolidated everywhere", s => {
      s.zones.forEach(z => { z.influence = 70; z.influenceFloor = 60; });
      s.charters = 3;
    });
    run("empty slates", s => { s.zones.forEach(z => { z.slate = []; }); });
    run("a report waiting", s => {
      s.pendingAbsence = { elapsedMs: 48 * 3600000, zones: {}, healed: [] };
    });
    // The state a brand new player is in for their whole first minute: the
    // tutorial is on screen. Two report-driving checks broke here the moment
    // showReport() learned to defer to it -- they owned `reportOpen` but not
    // `helpOpen`, so they could no longer open the surface they drive, and said
    // "the report did not open" as if the game were broken.
    run("everyone kitted out, shelf full", s => {
      s.keep.forge = CONFIG.BUILDINGS.forge.max;
      s.stash = [];
      const top = CONFIG.GEAR_TIER_MAX;
      s.heroes.forEach(h => {
        h.gear = {};
        CONFIG.GEAR_SLOTS.forEach(slot => {
          h.gear[slot] = { id: GEAR[slot][top][0].id, tier: top };
        });
      });
      while (s.stash.length < CONFIG.GEAR_STASH_MAX)
        s.stash.push({ id: GEAR.weapon[1][0].id, tier: 1 });
    });
    run("marked, with a Sanctum", s => {
      s.keep.sanctum = CONFIG.BUILDINGS.sanctum.max;
      const ids = Object.keys(MARKS);
      s.heroes.forEach((h, i) => {
        h.marks = [{ id: ids[i % ids.length], zoneId: s.zones[i % s.zones.length].id, atMs: 0 }];
      });
    });
    run("a campaign in flight on a fallen zone", s => {
      state = s;
      const z = s.zones[0];
      z.rival = CONFIG.RIVAL_LOCK_AT + 8;
      z.influence = 15;
      z.slate = [];
      reseedSlate(z, nowMs(), true);
      const rc = z.slate.filter(q => q.type === "reclaim")[0];
      const idle = s.heroes.filter(h => h.status === "idle");
      if (rc && idle.length >= rc.required) deploy(rc, idle.slice(0, rc.required));
    });
    run("with the tutorial on screen", s => {
      state = s;
      helpOpen = false; reportOpen = false;
      document.querySelectorAll(".scrim").forEach(n => n.remove());
      showHelp();
    });
  } finally {
    document.querySelectorAll(".scrim").forEach(n => n.remove());
    liveScrims.forEach(n => document.body.appendChild(n));
    helpOpen = wasHelp; reportOpen = wasReport;
    savesDisarmed = wasDisarmed; state = real;
  }
  return { shapes: 14, failures, ok: failures.length === 0 };
}

const BK = {
  get state(){ return state; },
  sweepKeep,
  sweepPlay,
  // Registries are exported and mutable on purpose: falsifying an assertion
  // means breaking the thing it names from the console in one call.
  CONFIG, CLEAR_QUESTS, TRAITS, MARKS, STARTING_HEROES, QUEST_POOLS, DERIVED,
  NARRATION, narrate, showReport,
  maybeMark,
  traitEffects, partyInfluenceBonus, effectivePower, injuryChance, partyPower,
  heroStat, questDifficulty, availableTypes, hunterCounterMult,
  keepLevel, keepEffect, keepUpgradeCost, keepCanAfford, keepUpgrade, rosterCap,
  RECRUITS, xpForLevel, xpToReach, applyLevels, subclassDef, awaitingSubclass,
  chooseSubclass, checkVictory, zonesHeld, activatable,
  recruitOffers, canRecruit, recruit, partyInjuryMult,
  zoneEvent, eventEffect, rollEvent, INCURSIONS, makeIncursion, incursionIgnored,
  canConsolidate, consolidate, consolidateTarget,
  resolveQuest, makeQuest, reseedSlate, sanitizeLoaded, migrate, deploy, incursionActive,
  assertAll, falsify, simulate, decayVsThroughput,
  advance, applyDecay, previewQuest, successChance, staffing, roleCoverage,
  tierIndexFor, save: saveNow, render,
  disarmSaves(){ savesDisarmed = true; clearTimeout(saveTimer); return "saves disarmed"; },
  armSaves(){ savesDisarmed = false; return "saves armed"; },
  /* Disarming first is not optional: the app persists on pagehide and
     visibilitychange, so a bare removeItem() is undone by the outgoing page the
     moment you navigate, and the "wiped" save comes straight back. */
  wipe(){
    savesDisarmed = true;
    clearTimeout(saveTimer);
    try { localStorage.removeItem(CONFIG.SAVE_KEY); } catch (e) {}
    memoryStore = null;
    return "save cleared and saves disarmed -- reload for a fresh game";
  },
  /* Fast-forward for verifying offline resolution. Every epoch timestamp moves
     back together -- rewinding lastTick alone leaves quests dated in the future,
     so nothing ever completes and the helper silently verifies nothing. */
  skip(hours){
    const ms = hours * 3600000;
    state.lastTick  -= ms;
    state.startedAt -= ms;
    state.activeQuests.forEach(q => { q.startedAt -= ms; q.completesAt -= ms; });
    state.zones.forEach(z => {
      z.nextReseed -= ms;
      if (z.event && z.event.expires) z.event.expires -= ms;
      z.slate.forEach(q => { q.expiresAt -= ms; });
    });
    state.heroes.forEach(h => { if (h.injury.healsAt) h.injury.healsAt -= ms; });
    advance(nowMs()); render(); showReport();
    return "fast-forwarded " + hours + "h";
  }
};
window.BK = BK;
/* CONFIG-SCAN-EXCLUDE-END */

boot();
</script>
