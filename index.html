<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banner &amp; Keep</title>
<style>
:root{
  --bg:#16130f; --panel:#211c16; --panel2:#2b241c; --raise:#352c21;
  --ink:#e8dcc6; --muted:#a08f74; --dim:#6f6350;
  --line:#3d3328; --line2:#4d4133;
  --gold:#c9a227; --gold-dim:#8a6f1c;
  --crimson:#a3342d; --crimson-dim:#6d2320;
  --verd:#5d8a45; --verd-dim:#3d5c2d;
  --azure:#4a7d8a;
  --t0:#6b5c46; --t1:#7d8a5a; --t2:#5a8a8a; --t3:#c08a3a; --t4:#e0b93f;
  --radius:6px;
  --font:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background:radial-gradient(ellipse at 50% 0%,rgba(201,162,39,.07),transparent 60%);
}
#app{position:relative; z-index:1; max-width:560px; margin:0 auto; padding-bottom:76px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20; background:linear-gradient(var(--panel),var(--panel) 70%,rgba(33,28,22,.94));
  border-bottom:1px solid var(--line); padding:8px 12px 7px;
}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.brand h1{font-size:16px;margin:0;letter-spacing:.06em;font-weight:600}
.brand .sub{font-size:11px;color:var(--dim);font-family:var(--sans);margin-left:auto;letter-spacing:.04em}
.helpbtn{width:21px;height:21px;flex:none;padding:0;border-radius:50%;cursor:pointer;
  border:1px solid var(--gold-dim);background:transparent;color:var(--gold);
  font-size:12.5px;font-weight:700;line-height:1;display:grid;place-items:center}
.helpbtn:hover{background:var(--gold-dim);color:#1a1408}
.res{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--sans);font-size:12px}
.res b{font-weight:600;font-variant-numeric:tabular-nums}
.res .r{display:flex;align-items:center;gap:3px;color:var(--muted)}
.res .r.on b{color:var(--ink)}
.res .r.off{opacity:.42}
.hstat{margin-left:auto;display:flex;gap:7px;font-size:11.5px}
.hstat span{color:var(--muted)}
.hstat i{font-style:normal;font-variant-numeric:tabular-nums}
.hstat .idle i{color:var(--verd)} .hstat .dep i{color:var(--gold)} .hstat .inj i{color:var(--crimson)}

/* ---------- nav ---------- */
nav{
  position:fixed; bottom:0; left:0; right:0; z-index:25;
  display:flex; background:var(--panel); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; background:none; border:0; border-top:2px solid transparent;
  color:var(--dim); font-family:var(--sans); font-size:11.5px; letter-spacing:.08em;
  text-transform:uppercase; padding:9px 4px 11px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
nav button svg{width:19px;height:19px;opacity:.75}
nav button[aria-current="true"]{color:var(--gold);border-top-color:var(--gold)}
nav button[aria-current="true"] svg{opacity:1}

/* ---------- generic ---------- */
.view{padding:12px}
.view[hidden]{display:none!important}
h2{font-size:15px;margin:0 0 8px;letter-spacing:.05em;font-weight:600}
h3{font-size:13px;margin:0 0 6px;letter-spacing:.05em;font-weight:600;color:var(--muted);
   text-transform:uppercase;font-family:var(--sans)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px;margin-bottom:9px}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.tiny{font-family:var(--sans);font-size:11.5px;line-height:1.4}
.num{font-variant-numeric:tabular-nums}
button{font-family:var(--sans)}
.btn{
  background:var(--raise); color:var(--ink); border:1px solid var(--line2);
  border-radius:4px; padding:8px 13px; font-size:13px; cursor:pointer; letter-spacing:.03em;
}
.btn:hover{background:var(--panel2);border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--gold-dim);border-color:var(--gold);color:#1a1408;font-weight:600}
.btn.pri:hover{background:var(--gold)}
.btn.sm{padding:5px 9px;font-size:12px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- map ---------- */
#map-svg{display:block;width:100%;height:auto;border:1px solid var(--line);
  border-radius:var(--radius);background:#100e0b;margin-bottom:10px}
.zone-hit{cursor:pointer}
.zone-hit:hover .zring{stroke:var(--gold);stroke-opacity:.9}
.zone-hit:focus-visible{outline:none}
.zone-hit:focus-visible .zring{stroke:var(--gold);stroke-width:2.5;stroke-opacity:1}

/* ---------- bars ---------- */
.bar{height:7px;background:#0f0d0a;border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;transition:width .3s}
.bar .flr{position:absolute;top:0;bottom:0;width:2px;background:var(--azure);opacity:.85}
.bar.inf i{background:linear-gradient(90deg,var(--verd-dim),var(--verd))}
.bar.riv i{background:linear-gradient(90deg,var(--crimson-dim),var(--crimson))}
.barrow{display:flex;align-items:center;gap:7px;margin:5px 0}
.barrow .lab{font-family:var(--sans);font-size:11px;color:var(--muted);width:52px;flex:none;letter-spacing:.04em}
.barrow .bar{flex:1}
.barrow .val{font-family:var(--sans);font-size:11.5px;width:58px;text-align:right;flex:none}

/* tier pill */
.tier{display:inline-block;font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid;font-weight:600}
.tier.t0{color:var(--t0);border-color:var(--t0)}
.tier.t1{color:var(--t1);border-color:var(--t1)}
.tier.t2{color:var(--t2);border-color:var(--t2)}
.tier.t3{color:var(--t3);border-color:var(--t3)}
.tier.t4{color:var(--t4);border-color:var(--t4);box-shadow:0 0 9px rgba(224,185,63,.28)}
.locked{color:var(--crimson);border-color:var(--crimson)}

/* ---------- zone panel ---------- */
.zhead{display:flex;align-items:flex-start;gap:9px;margin-bottom:4px}
.zhead h2{margin:0}
.zhead .danger{margin-left:auto;font-family:var(--sans);font-size:11px;color:var(--muted);white-space:nowrap}
.pips{letter-spacing:2px;color:var(--crimson)}
.pips .off{color:var(--line2)}

/* ---------- quests ---------- */
.quest{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
  padding:10px;margin-bottom:8px}
.quest.sel{border-color:var(--gold);background:var(--panel2)}
.quest .qt{display:flex;align-items:baseline;gap:8px}
.quest .qname{font-weight:600;font-size:14.5px}
/* Unscoped on purpose: the tutorial shows the same pill in its table of quest
   types, and a type badge that renders as bare text there teaches the wrong
   thing about what the player is looking for on the slate. */
.qtype{display:inline-block;font-family:var(--sans);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--azure);border:1px solid var(--azure);
  border-radius:3px;padding:1px 5px;flex:none}
/* Type colour carries the risk gradient: quiet work cool, violent work hot. */
.qtype.t-patrol{color:#6f8a7a;border-color:#6f8a7a}
.qtype.t-investigate{color:var(--azure);border-color:var(--azure)}
.qtype.t-court{color:#9a7fb0;border-color:#9a7fb0}
.qtype.t-clear{color:#a99a86;border-color:#a99a86}
.qtype.t-hunt{color:var(--t3);border-color:var(--t3)}
.qtype.t-delve{color:#c4703a;border-color:#c4703a}
.qtype.t-warfront{color:var(--crimson);border-color:var(--crimson);
  box-shadow:0 0 8px rgba(163,52,45,.3)}
.qtype.t-raid{color:#fff;background:var(--crimson);border-color:var(--crimson)}
/* The largest thing in the game, and the only one that undoes a rival's hold:
   gold on crimson, so it never reads as one more entry on the board. */
.qtype.t-reclaim{color:var(--t4);background:rgba(163,52,45,.35);border-color:var(--t4);
  box-shadow:0 0 10px rgba(224,185,63,.25)}
.quest.reclaim{border-color:var(--t4);background:rgba(224,185,63,.05)}
.quest.raid{border-color:var(--crimson);background:rgba(163,52,45,.08)}

/* zone events */
.evrow{display:flex;align-items:center;gap:8px}
.ev{font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 8px;border-radius:3px;border:1px solid;font-weight:600}
.ev.e-quiet{color:#7d8a92;border-color:#7d8a92}
.ev.e-blight{color:#9a7fb0;border-color:#9a7fb0;background:rgba(154,127,176,.12)}
.ev.e-muster{color:var(--verd);border-color:var(--verd)}
.ev.e-festival{color:var(--t4);border-color:var(--t4);box-shadow:0 0 9px rgba(224,185,63,.25)}
.evtag{font-family:var(--sans);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.quest .qflav{font-size:13px;color:var(--muted);margin:5px 0 7px;line-height:1.4}
.qmeta{display:flex;flex-wrap:wrap;gap:3px 12px;font-family:var(--sans);font-size:11.5px;color:var(--muted)}
.qmeta b{color:var(--ink);font-weight:600}
.qexp{margin-left:auto;color:var(--dim)}
.qexp.soon{color:var(--crimson)}
.reward{display:inline-flex;align-items:center;gap:3px}
.reward svg{width:12px;height:12px}

/* active quest */
.active{border-left:3px solid var(--gold)}
.prog{height:4px;background:#0f0d0a;border-radius:2px;overflow:hidden;margin-top:7px}
.prog i{display:block;height:100%;background:var(--gold);transition:width 1s linear}

/* ---------- deploy drawer ---------- */
.drawer{border:1px solid var(--gold);border-radius:var(--radius);background:var(--panel2);
  padding:11px;margin-bottom:9px}
/* Whole row is the target. The selected state is a box, not a tick in a
   column: the thing the player is choosing is the hero, so the hero lights up. */
.hpick{display:flex;align-items:center;gap:9px;padding:7px 9px;margin-bottom:5px;cursor:pointer;
  border:1px solid var(--line);border-radius:5px;background:var(--panel);transition:border-color .12s}
.hpick:hover{border-color:var(--line2)}
.hpick.sel{border-color:var(--gold);background:rgba(201,162,39,.09);
  box-shadow:inset 0 0 0 1px var(--gold-dim)}
.hpick .tick{width:17px;height:17px;flex:none;border-radius:3px;display:grid;place-items:center;
  border:1px solid var(--line2);background:#0f0d0a}
.hpick.sel .tick{border-color:var(--gold);background:var(--gold)}
.hpick .tick svg{display:block}
.hpick .nm{flex:1;min-width:0}
.hpick .nm b{display:block;font-weight:600;font-size:13.5px}
.hpick.sel .nm b{color:var(--t4)}
.hpick .nm span{font-family:var(--sans);font-size:11px;color:var(--muted)}
.hpick .pw{font-family:var(--sans);font-size:12px;text-align:right;flex:none}
.hpick.busy{opacity:.42;cursor:default}
.hpick.busy:hover{border-color:var(--line)}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-family:var(--sans);
  font-size:12px;margin:9px 0;padding:9px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.readout div{display:flex;justify-content:space-between;gap:8px}
.readout span{color:var(--muted)}
.readout b{font-variant-numeric:tabular-nums}
.good{color:var(--verd)} .warn{color:var(--t3)} .bad{color:var(--crimson)}

/* ---------- roster ---------- */
.hero{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:9px 11px;margin-bottom:7px}
.hero .por{width:38px;height:38px;flex:none;border-radius:4px;background:var(--panel2);
  border:1px solid var(--line2);display:grid;place-items:center}
.hero .por svg{width:24px;height:24px;opacity:.7}
.hero .body{flex:1;min-width:0}
/* Both of these must be block: left inline, the serif name and the sans class
   line run together as "Aldric VaneWarrior · Front" and the row stops scanning. */
.hero .body b{display:block;font-size:14.5px;font-weight:600;line-height:1.25}
.hero .role{display:block;font-family:var(--sans);font-size:11px;color:var(--muted)}
.hero .st{font-family:var(--sans);font-size:11px;text-align:right;flex:none}
/* display:block matters: height and max-width do nothing on an inline span, so
   left as-is the fatigue bar collapsed to a hairline that read as a border. */
.mini{display:block;height:4px;background:#0f0d0a;border:1px solid var(--line);border-radius:2px;
  overflow:hidden;margin-top:4px;max-width:150px}
.mini i{display:block;height:100%;transition:width 1s linear}
.mini.fat i{background:var(--t3)}
/* The "back in" bar, in the right-hand status column of a roster row. */
.mini.out{width:84px;height:5px;margin-left:auto;margin-top:5px}
.mini.out i{background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
.hero{cursor:pointer}
.hero:hover{border-color:var(--line2);background:var(--panel2)}

/* trait chips */
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-family:var(--sans);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--line2);color:var(--muted);border-radius:3px;padding:1px 6px;white-space:nowrap}
.chip.home{border-color:var(--verd-dim);color:var(--verd)}
/* Marks are permanent, so they read differently from traits: earned, not chosen. */
.chip.mark{border-color:var(--crimson-dim);color:#c98a72;background:rgba(163,52,45,.10)}
.mark-tally{color:#c98a72;font-weight:600}
.xp-tally{color:var(--azure)}
.gear-tally{color:var(--azure);display:inline-flex;align-items:center;gap:3px}
.levelup{font-family:var(--sans);font-size:11.5px;color:var(--t4);margin-top:6px;
  border-left:2px solid var(--t4);padding-left:8px}
.levelup b{color:var(--t4)}
.trait.mark{border-color:var(--crimson-dim);background:rgba(163,52,45,.07)}
.trait.mark b{color:#c98a72}

/* hero detail */
.hdet{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.hdet .porbig{width:78px;height:78px;flex:none;border-radius:5px;background:var(--panel2);
  border:1px solid var(--line2);display:grid;place-items:center;color:var(--muted)}
.hdet .porbig svg{width:60px;height:60px}
.hdet h2{margin:0 0 2px}
.hook{font-size:13.5px;line-height:1.5;color:var(--muted);font-style:italic;
  border-left:2px solid var(--line2);padding-left:9px;margin:9px 0 11px}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin:4px 0}
.attr{display:flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11.5px}
.attr span{color:var(--muted);width:56px;flex:none}
/* Track is LIGHTER than the panel. Darker than the panel reads as a gap, and a
   short fill beside a long "gap" is genuinely hard to compare at 75x5px. */
.attr .abar{flex:1;height:5px;background:#38301f;border-radius:2px;overflow:hidden}
.attr .abar i{display:block;height:100%;background:var(--azure)}
.attr b{width:14px;text-align:right;font-variant-numeric:tabular-nums}
.derived{display:flex;gap:14px;font-family:var(--sans);font-size:12px;margin:8px 0 2px}
.derived b{font-variant-numeric:tabular-nums}
.trait{border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-bottom:6px;
  background:var(--panel2)}
.trait b{font-size:13.5px}
.trait p{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45;font-family:var(--sans)}
.gearslots{display:flex;gap:6px}
.gearslot{flex:1;min-width:0;border:1px dashed var(--line2);border-radius:4px;padding:6px 5px;
  text-align:center;font-family:var(--sans);font-size:10.5px;color:var(--dim)}
.gearslot i{display:block;font-style:normal;letter-spacing:.06em;text-transform:uppercase;
  font-size:9.5px;color:var(--dim)}
.gearslot b{display:block;font-size:11px;font-weight:600;color:var(--ink);margin-top:2px;
  overflow-wrap:anywhere}
.gearslot.filled{border-style:solid;border-color:var(--azure);cursor:pointer}
.gearslot.filled:hover{background:rgba(74,125,138,.10)}
.shelf{display:flex;flex-wrap:wrap;gap:5px}
.shelfitem{text-align:left;line-height:1.25}
.shelfitem span{display:block;font-size:10px;color:var(--muted);letter-spacing:.05em;
  text-transform:uppercase}
.gearrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.gearrow:last-child{border-bottom:0}
.gearrow .gi{flex:1;min-width:0}
.gearrow .gi b{display:block;font-size:13.5px}
.gearrow .gi span{display:block;text-transform:capitalize}
.gearrow .ga{display:flex;gap:5px;flex:none}

/* buildings */
.build .lvl{margin-left:auto;font-family:var(--sans);font-size:11px;color:var(--muted);white-space:nowrap}
.lvlpips{display:flex;gap:3px;margin:2px 0 0}
.lvlpips i{display:block;width:22px;height:4px;border-radius:2px;background:var(--line)}
.lvlpips i.on{background:var(--gold-dim)}
.costrow{display:flex;flex-wrap:wrap;gap:4px 10px;margin:5px 0 7px;
  font-family:var(--sans);font-size:12px}
.cost{display:inline-flex;align-items:center;gap:3px;color:var(--ink)}
.cost.short{color:var(--crimson)}
.xpbar{height:3px;background:#2a231b;border-radius:2px;overflow:hidden;margin-top:3px;max-width:150px}
.xpbar i{display:block;height:100%;background:var(--azure)}
.branchdot{color:var(--t4);font-weight:600}
.branchcard{border-color:var(--t4);box-shadow:0 0 12px rgba(224,185,63,.14)}
.hero.recruit{border-color:var(--t3);background:rgba(192,138,58,.07);cursor:default}
.hero.recruit:hover{background:rgba(192,138,58,.10)}

/* ---------- report ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,8,6,.82);
  display:grid;place-items:center;padding:14px}
.modal{background:var(--panel);border:1px solid var(--gold-dim);border-radius:var(--radius);
  max-width:520px;width:100%;max-height:86vh;display:flex;flex-direction:column}
.modal header{position:static;background:none;border-bottom:1px solid var(--line);padding:12px 14px}
.modal h2{margin:0}
.mbody{overflow-y:auto;padding:12px 14px}
.mfoot{padding:11px 14px;border-top:1px solid var(--line);text-align:right}
.entry{margin-bottom:14px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.entry .eh{font-family:var(--sans);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--gold);margin-bottom:3px}
.entry .en{font-weight:600;font-size:14.5px;margin-bottom:5px}
.entry p{margin:0 0 7px;line-height:1.5}
.entry .tally{font-family:var(--sans);font-size:11.5px;color:var(--muted);
  display:flex;flex-wrap:wrap;gap:3px 11px}
.entry.fail .eh{color:var(--crimson)}
.entry p{font-size:14px;line-height:1.62}

/* ---------- the tutorial ---------- */
.help section{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.help section:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.help h3{color:var(--gold);margin-bottom:7px}
.help p{margin:0 0 8px;font-size:13.5px;line-height:1.6}
.help p:last-child{margin-bottom:0}
.help b{color:var(--ink);font-weight:600}
.help em{color:var(--muted)}
.hol{margin:0 0 8px;padding-left:19px;font-size:13.5px;line-height:1.6}
.hol li{margin-bottom:6px}
.hdl{margin:0 0 8px;font-size:13px}
.hdl dt{font-family:var(--sans);font-size:11.5px;color:var(--gold);margin-top:8px;
  display:flex;align-items:center;gap:4px}
.hdl dt:first-child{margin-top:0}
.hdl dd{margin:2px 0 0;color:var(--muted);line-height:1.55}
.hdl dd b{color:var(--ink)}
/* Wide content scrolls inside itself rather than stretching the dialog. */
.htab{width:100%;border-collapse:collapse;margin:0 0 9px;font-family:var(--sans);font-size:12px}
.htab th{text-align:left;font-weight:600;color:var(--dim);font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;padding:0 8px 4px 0;border-bottom:1px solid var(--line)}
.htab td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);vertical-align:top;
  color:var(--ink)}
.htab td.num{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.htab tr:last-child td{border-bottom:0}
.htab .hsub td{color:var(--muted);font-size:11.5px;line-height:1.5;padding-top:0;
  border-bottom:1px solid var(--line)}
.htab .hsub b{color:var(--t3)}

/* the absence band: what the realm did while nobody was deciding anything */
.absence{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 11px;margin-bottom:14px}
.absrow{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;padding:5px 0;
  border-bottom:1px solid var(--line);font-family:var(--sans);font-size:11.5px}
.absrow:last-of-type{border-bottom:0}
.absrow .zn{font-family:var(--font);font-size:13.5px;font-weight:600;min-width:96px}
.absrow .bits{margin-left:auto;text-align:right}
.absrow .fell{color:var(--crimson);font-size:11px}
.absrow.dropped .zn{color:var(--crimson)}
.logh{margin:2px 0 9px}
.entry.victory{border-bottom:0;background:rgba(224,185,63,.06);
  border:1px solid var(--gold-dim);border-radius:var(--radius);padding:11px}
.entry.victory .eh{color:var(--t4)}
.wonbanner{border-color:var(--gold-dim);box-shadow:0 0 14px rgba(224,185,63,.12)}

/* ---------- keep / win ---------- */
.wincount{display:flex;gap:5px;margin:7px 0}
.wincount i{flex:1;height:5px;border-radius:2px;background:var(--line)}
.wincount i.on{background:var(--t3)}
.stub{border:1px dashed var(--line2);border-radius:var(--radius);padding:11px;color:var(--dim);
  font-family:var(--sans);font-size:12px}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:35;
  background:var(--raise);border:1px solid var(--gold);color:var(--ink);
  padding:8px 15px;border-radius:4px;font-family:var(--sans);font-size:12.5px;
  pointer-events:none;opacity:0;transition:opacity .25s}
.toast.on{opacity:1}
</style>
</head>

<script>
"use strict";
/* ==========================================================================
   BANNER & KEEP  —  Phase 0 (skeleton) + Phase 1 (the tense core)
   Single file. No build step, no network. See DESIGN.md and CLAUDE.md.
   ========================================================================== */

/* ---------------------------------------------------------------- CONFIG --
   Every balance number lives here. Nothing numeric may hide in a function
   body. assertAll() scans this file's own source and fails on any top-level
   key that nothing reads.
   -------------------------------------------------------------------------- */
const CONFIG = {
  SAVE_KEY: "bannerkeep.save",
  SAVE_VERSION: 2,          // 2: Phase 2 added hero identity (portrait, home zone, hook, traits)
  SAVE_DEBOUNCE_MS: 500,
  TICK_MS: 1000,

  /* influence ------------------------------------------------------------ */
  INFLUENCE_MAX: 100,
  TIERS: [
    { id:"unknown",   name:"Unknown",   min:0,  decayPerHour:0.00 },
    { id:"noticed",   name:"Noticed",   min:20, decayPerHour:0.15 },
    { id:"respected", name:"Respected", min:40, decayPerHour:0.30 },
    { id:"honored",   name:"Honored",   min:60, decayPerHour:0.50 },
    { id:"sovereign", name:"Sovereign", min:80, decayPerHour:0.80 }
  ],
  INFLUENCE_GAIN: { short:3, medium:6, long:12, warfront:25 },
  PRESENCE_INFLUENCE_PER_POINT: 0.02,
  FAIL_INFLUENCE_PENALTY: 2,
  OFFLINE_DECAY_CAP_H: 48,
  PATROL_DECAY_MULT: 0.5,
  DECAY_SLICE_H: 0.25,          // integration step; tier is re-read each slice

  /* rivals --------------------------------------------------------------- */
  RIVAL_MAX: 100,
  RIVAL_DECAY_SHARE: 0.5,
  RIVAL_GAIN_ON_FAIL: 3,
  RIVAL_LOCK_AT: 80,
  // Open decision #1: a locked zone is *weakened, never forbidden*. Reclaim

/* ------------------------------------------------------------- helpers -- */
const clamp = (lo, hi, v) => v < lo ? lo : v > hi ? hi : v;
const nowMs = () => Date.now();

/* Randomness runs through one function so the assertion suite can make itself
   deterministic. Sampling checks (Monte Carlo reconciliations) are otherwise
   flaky by construction: at ~3 sigma a single check fails roughly one run in
   300, and falsify() executes the whole suite over a hundred times, so a flake
   is near-certain and shows up as "a probe did not restore cleanly". */
let rngSeed = null;
function rand(){
  if (rngSeed === null) return Math.random();
  rngSeed ^= rngSeed << 13; rngSeed >>>= 0;
  rngSeed ^= rngSeed >>> 17;
  rngSeed ^= rngSeed << 5;  rngSeed >>>= 0;
  return rngSeed / 4294967296;
}
function withSeed(seed, fn){
  const prev = rngSeed;
  rngSeed = (seed >>> 0) || 1;
  try { return fn(); } finally { rngSeed = prev; }
}
const randRange = (a, b) => a + rand() * (b - a);
const pick  = arr => arr[Math.floor(rand() * arr.length)];
const round1 = n => Math.round(n * 10) / 10;
const pct = n => Math.round(n * 100) + "%";

function fmtDur(ms){
  if (ms <= 0) return "now";
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  if (h > 0) return h + "h " + String(m).padStart(2, "0") + "m";
  if (m > 0) return m + "m " + String(ss).padStart(2, "0") + "s";
  return ss + "s";
}
function fmtDurLong(ms){
  // Round to whole minutes FIRST, then split. Flooring hours before rounding
  // minutes produced "60m" for anything in the last half-minute before an hour.
  const mins = Math.round(ms / 60000);
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h > 0) return m > 0 ? h + "h " + m + "m" : h + "h";
  return m + "m";
}

/* --------------------------------------------------------- tier lookups -- */
function tierIndexFor(influence){
  let idx = 0;
  for (let i = 0; i < TIER_COUNT; i++) if (influence >= CONFIG.TIERS[i].min) idx = i;
  return idx;
}
const tierFor = influence => CONFIG.TIERS[tierIndexFor(influence)];
function tierFloorFor(influence){ return CONFIG.TIERS[tierIndexFor(influence)].min; }

/* ======================================================== SAVE / MIGRATE ==
   Guarded in try/catch and degrading to in-memory. A version field and a
   migration stub exist before there are saves worth migrating (DESIGN.md §15).
   ========================================================================= */
let storageOK = true;
let memoryStore = null;
let savesDisarmed = false;   // BK.disarmSaves() -- for verification agents
let saveTimer = null;

function storageGet(){
  if (!storageOK) return memoryStore;
  try { return localStorage.getItem(CONFIG.SAVE_KEY); }
  catch (e) { storageOK = false; return memoryStore; }
}
function storageSet(str){
  memoryStore = str;
  if (!storageOK) return;
  try { localStorage.setItem(CONFIG.SAVE_KEY, str); }
  catch (e) { storageOK = false; }
}

function migrate(raw){
  let data = raw;
  if (typeof data.version !== "number") data.version = 0;
  let guard = 0;
  while (data.version < CONFIG.SAVE_VERSION && guard++ < 32){
    switch (data.version){
      case 0:
        data.version = 1;                              // pre-versioned -> v1
        break;

      case 1:
        // Phase 2 gave every hero an identity: portrait, home zone, background
        // hook and traits. A v1 save has none of them, and without this the
        // heroes load as anonymous stat blocks FOREVER -- no crash, no warning,
        // just a permanently diminished roster. Backfill from the authored
        // table by name; anyone not in it gets safe, playable defaults.
        (data.heroes || []).forEach(h => {
          const def = STARTING_HEROES.find(d => d.name === h.name);
          if (def){
            if (!h.portraitId) h.portraitId = def.portraitId;
            if (!h.homeZone)   h.homeZone   = def.homeZone;
            if (!h.hook)       h.hook       = def.hook;
            if (!Array.isArray(h.traits) || !h.traits.length)
              h.traits = def.traits.slice();
          } else {
            h.portraitId = h.portraitId || "sym-hero";
            if (!Array.isArray(h.traits)) h.traits = [];
          }
          if (!Array.isArray(h.marks)) h.marks = [];
        });
        data.version = 2;
        break;

      default:
        data.version = CONFIG.SAVE_VERSION;
        break;
    }
  }
  return data;
}

/* Normalisation that must run on EVERY load, not only when the version number
   happens to change. Dropping a renamed trait id inside migrate()'s case 1 only
   ran for saves coming from v1 -- a save already at the current version kept the
   dangling id forever, silently losing the effect and printing the raw id as its
   own chip label. Load-time sanitising is version-independent by construction. */
function sanitizeLoaded(data){
  (data.heroes || []).forEach(h => {
    if (!Array.isArray(h.traits)) h.traits = [];
    if (!Array.isArray(h.marks))  h.marks  = [];
    h.traits = h.traits.filter(t => !!TRAITS[t]);
    // Marks get the same treatment as traits. Two render sites fall back to
    // printing the raw id, so a bare string or an unknown id would show a chip
    // literally reading "undefined" rather than being dropped.
    h.marks = h.marks
      .map(m => (typeof m === "string" ? { id: m, zoneId: h.homeZone || null, atMs: 0 } : m))
      .filter(m => m && MARKS[m.id]);
    if (!h.portraitId) h.portraitId = "sym-hero";
    if (h.homeZone && !zoneDef(h.homeZone)) h.homeZone = null;
    // Progression fields: a save from before Phase 8 has no subclass, and a
    // level or XP that is not a finite number must not reach the formulas.
    const lv = Number(h.level);
    h.level = isFinite(lv) ? clamp(1, CONFIG.LEVEL_MAX, Math.floor(lv)) : 1;
    const xp = Number(h.xp);
    h.xp = isFinite(xp) ? Math.max(0, xp) : 0;
    if (h.subclass && !(CONFIG.SUBCLASSES[h.cls] || []).some(s => s.id === h.subclass))
      h.subclass = null;                       // a branch this build no longer defines
    if (h.subclass && h.level < CONFIG.SUBCLASS_LEVEL) h.subclass = null;

    // Gear. The field existed in the save schema from Phase 0 and nothing read
    // it until the Forge landed, so every save in the wild has it empty or
    // absent -- and any of it could hold an id this build no longer defines.
    // Same treatment as traits and Marks: coerce the shape, drop the unknown.
    if (!h.gear || typeof h.gear !== "object") h.gear = {};
    CONFIG.GEAR_SLOTS.forEach(slot => {
      const it = h.gear[slot];
      const def = it && gearDef(it.id);
      // An item in the wrong slot is not equipment, it is corruption.
      h.gear[slot] = (def && def.slot === slot)
        ? { id: it.id, tier: clamp(1, CONFIG.GEAR_TIER_MAX, Math.round(Number(it.tier)) || 1) }
        : null;
    });
    Object.keys(h.gear).forEach(k => {
      if (CONFIG.GEAR_SLOTS.indexOf(k) < 0) delete h.gear[k];   // a slot this build removed
    });
  });
  (data.zones || []).forEach(z => {
    if (!Array.isArray(z.slate)) z.slate = [];
    if (typeof z.intelUntil !== "number") z.intelUntil = 0;
    // An event this build no longer defines becomes a fresh roll on the next tick.
    if (!z.event || typeof z.event !== "object" || !CONFIG.ZONE_EVENTS[z.event.type])
      z.event = { type:"quiet", expires:0 };
    if (typeof z.event.expires !== "number" || !isFinite(z.event.expires)) z.event.expires = 0;
    const fl = Number(z.influenceFloor);
    z.influenceFloor = isFinite(fl) ? clamp(0, CONFIG.INFLUENCE_MAX, fl) : 0;
    // Drop slate entries whose type this build no longer defines, and backfill
    // the Phase 3 fields onto any Clear quest saved before the types existed.
    z.slate = z.slate.filter(q => !!CONFIG.QUEST_TYPES[q.type]);
    z.slate.forEach(q => {
      if (!q.stat) q.stat = CONFIG.QUEST_TYPES[q.type].stat;
      if (!q.stages) q.stages = CONFIG.QUEST_TYPES[q.type].stages || 1;
    });
  });
  (data.activeQuests || []).forEach(q => {
    if (!q.stat) q.stat = (CONFIG.QUEST_TYPES[q.type] || CONFIG.QUEST_TYPES.clear).stat;
    if (!q.stages) q.stages = 1;
  });

  // The Keep. Every READ path is defensive (keepLevel falls back to the building's
  // start), so a save with no `keep` at all played perfectly and only blew up on
  // the first upgrade -- after taking payment. Normalise it here like everything
  // else, so no code downstream has to wonder.
  if (!data.keep || typeof data.keep !== "object") data.keep = {};
  Object.keys(CONFIG.BUILDINGS).forEach(id => {
    const b = CONFIG.BUILDINGS[id];
    const n = Number(data.keep[id]);
    data.keep[id] = isFinite(n) ? clamp(b.start, b.max, Math.floor(n)) : b.start;
  });
  Object.keys(data.keep).forEach(id => {
    if (!CONFIG.BUILDINGS[id]) delete data.keep[id];   // a building this build removed
  });

  // Currency, for the same reason: costs are deducted from these by name.
  if (typeof data.gold !== "number" || !isFinite(data.gold)) data.gold = 0;
  if (typeof data.charters !== "number" || !isFinite(data.charters)) data.charters = 0;
  if (!data.materials || typeof data.materials !== "object") data.materials = {};
  Object.keys(CONFIG.MATERIALS).forEach(m => {
    const n = Number(data.materials[m]);
    data.materials[m] = isFinite(n) ? Math.max(0, n) : 0;
  });
  // The stash, normalised in the one place every field goes through -- and
  // capped, because a save written by a build with a larger cap must not leave
  // the player permanently over the line with no way to get back under it.
  data.stash = (Array.isArray(data.stash) ? data.stash : [])
    .map(it => {
      const def = gearDef(it && it.id);
      return def ? { id: it.id, tier: clamp(1, CONFIG.GEAR_TIER_MAX,
                                            Math.round(Number(it.tier)) || 1) } : null;
    })
    .filter(Boolean)
    .slice(0, CONFIG.GEAR_STASH_MAX);
  data.activeQuests   = Array.isArray(data.activeQuests)   ? data.activeQuests   : [];
  data.pendingReports = Array.isArray(data.pendingReports) ? data.pendingReports : [];
  // An absence summary saved by an older build may be missing its parts.
  if (!Array.isArray(data.pendingIgnored)) data.pendingIgnored = [];
  // An existing save is an existing player: default them to having seen the
  // tutorial rather than ambushing them with it on the load after an update.
  // Only newGame() sets this false, so only a genuinely new Keep is taught.
  if (typeof data.seenHelp !== "boolean") data.seenHelp = true;
  if (data.pendingAbsence && typeof data.pendingAbsence === "object"){
    const a = data.pendingAbsence;
    if (typeof a.elapsedMs !== "number" || !isFinite(a.elapsedMs)) a.elapsedMs = 0;
    if (!a.zones || typeof a.zones !== "object") a.zones = {};
    if (!Array.isArray(a.healed)) a.healed = [];
  } else data.pendingAbsence = null;
  return data;
}

function save(){
  if (savesDisarmed) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, CONFIG.SAVE_DEBOUNCE_MS);
}
function saveNow(){
  if (savesDisarmed) return;
  clearTimeout(saveTimer);
  try { storageSet(JSON.stringify(state)); } catch (e) { /* non-fatal */ }
}
function load(){
  const raw = storageGet();
  if (!raw) return null;
  try { return sanitizeLoaded(migrate(JSON.parse(raw))); }
  catch (e) { return null; }
}

/* ============================================================ NEW GAME ==== */
let heroSeq = 1;

function makeHero(def){
  return {
    id: "h" + (heroSeq++),
    name: def.name,
    cls: def.cls,
    role: def.role,
    portraitId: def.portraitId,
    homeZone: def.homeZone,
    hook: def.hook,
    level: 1,
    xp: 0,
    subclass: null,
    attrs: Object.assign({}, def.attrs),
    traits: (def.traits || []).slice(),
    marks: [],
    fatigue: 0,
    injury: { severity: null, healsAt: 0 },
    gear: { weapon:null, armor:null, trinket:null },
    status: "idle",
    deployedTo: null
  };
}

function newGame(){
  const t = nowMs();
  const s = {
    version: CONFIG.SAVE_VERSION,
    lastTick: t,
    startedAt: t,
    gold: CONFIG.START_GOLD,
    charters: 0,
    materials: { grain:0, bogiron:0, hardstone:0, cinderglass:0 },
    keep: { greatHall:1, trainingYard:0, infirmary:0, warRoom:0, sanctum:0, forge:0 },
    stash: [],
    zones: CONFIG.ZONES.map(z => ({
      id: z.id,
      influence: 0,
      influenceFloor: 0,
      rival: 0,
      event: { type:"quiet", expires:0 },   // rolled properly on the first tick
      intelUntil: 0,
      slate: [],
      nextReseed: 0
    })),
    heroes: STARTING_HEROES.slice(0, CONFIG.ROSTER_START).map(makeHero),
    activeQuests: [],
    pendingReports: [],
    pendingAbsence: null,
    pendingIgnored: [],
    won: false,
    seenHelp: false,        // a brand new lord gets the tutorial once, unasked
    questSeq: 1
  };
  // The slate builders read the global `state` (questSeq, active Patrols), so it
  // must be live before the first seed -- not after newGame() returns.
  state = s;
  s.zones.forEach(z => { rollEvent(z, t); reseedSlate(z, t, true); });
  return s;
}

let state = null;

/* ============================================================= LOOKUPS ==== */
const zoneDef  = id => CONFIG.ZONES.find(z => z.id === id);
const zoneOf   = id => state.zones.find(z => z.id === id);
const heroOf   = id => state.heroes.find(h => h.id === id);
const isLocked = z => z.rival >= CONFIG.RIVAL_LOCK_AT;

/* ============================================================= DYNAMISM ==
   One event is always live in every zone (§9). Effects are read through
   zoneEvent() so no caller ever has to know whether one is running.
   ========================================================================= */
function zoneEvent(zoneState){
  const e = zoneState && zoneState.event;
  const def = e && CONFIG.ZONE_EVENTS[e.type];
  return def || CONFIG.ZONE_EVENTS.quiet;
}
function eventEffect(zoneState, key, dflt){
  const v = zoneEvent(zoneState)[key];
  return v === undefined ? dflt : v;
}
function rollEvent(zoneState, t, avoid){
  const ids = Object.keys(CONFIG.ZONE_EVENTS).filter(id => id !== avoid);
  const total = ids.reduce((n, id) => n + CONFIG.ZONE_EVENTS[id].weight, 0);
  let r = rand() * total, pick = ids[ids.length - 1];
  for (const id of ids){ r -= CONFIG.ZONE_EVENTS[id].weight; if (r <= 0){ pick = id; break; } }
  const d = CONFIG.ZONE_EVENTS[pick];
  zoneState.event = { type: pick, expires: t + randRange(d.minH, d.maxH) * 3600000 };
  return zoneState.event;
}

/* An incursion is the rival coming to the Keep rather than waiting to be
   visited. Ignoring it is allowed and expensive -- weakened, never forbidden. */
const INCURSIONS = {
  greenhollow: [
    { name:"Coterie Riders on the Keep Road", flavor:"The Coteries have brought armed men up the Keep road and are making a point of being seen." },
    { name:"The Toll Comes to the Gate", flavor:"A Coterie captain is at the gate demanding a share of the Keep's own stores." },
    { name:"Raid on the Home Farms", flavor:"The home farms are being stripped in daylight and the raiders are not hurrying." }
  ],
  marrowfen: [
    { name:"The Water Rises at the Walls", flavor:"The Drowned Court has pushed the black water up to the Keep's own ditches." },
    { name:"Drowned Dead at the Causeway", flavor:"Something has walked up out of the fen and is standing in the road below the Keep." },
    { name:"The Court Sends Word", flavor:"A dead man in a reeve's chain is waiting outside the gate with terms nobody wants to hear." }
  ],
  thornmarch: [
    { name:"Vantre Colours on the Ridge", flavor:"House Vantre has drawn up in strength on the ridge and is waiting to be answered." },
    { name:"The Quarry Road Seized", flavor:"Vantre soldiers have taken the quarry road within sight of the Keep's own walls." },
    { name:"A Writ and Two Hundred Men", flavor:"House Vantre has arrived with a legal claim and enough soldiers to enforce it." }
  ],
  ashenreach: [
    { name:"Ash-Knights at the Gate", flavor:"A column of Ash-Knights has come out of the waste and halted within sight of the Keep." },
    { name:"The Burning Comes Closer", flavor:"Fires have been set on the Keep's own side of the ash line and nobody is putting them out." },
    { name:"Consecration by Force", flavor:"The Ash-Knights mean to burn the outlying holdings and call it a cleansing." }
  ]
};

function incursionActive(zoneState){
  return zoneState.slate.some(q => q.incursion) ||
         state.activeQuests.some(q => q.zoneId === zoneState.id && q.incursion);
}
function makeIncursion(zoneState, t){
  const zd = zoneDef(zoneState.id);
  const src = pick(INCURSIONS[zoneState.id]);
  const required = CONFIG.QUEST_TYPES.clear.min + 1;
  const q = makeQuest(zoneState, t, "clear");
  if (!q) return null;
  q.incursion = true;
  q.name = src.name;
  q.flavor = src.flavor;
  q.required = required;
  q.difficulty = questDifficulty("clear", required, zd.danger) * CONFIG.INCURSION_DIFFICULTY_MULT;
  q.gold = Math.round(q.gold * CONFIG.INCURSION_REWARD_MULT);
  q.material = Math.round(q.material * CONFIG.INCURSION_REWARD_MULT);
  q.expiresAt = t + CONFIG.INCURSION_EXPIRY_MS;
  return q;
}
/* The cost of not answering. Charged once, when the raid expires unanswered. */
function incursionIgnored(zoneState, t, into){
  const zd = zoneDef(zoneState.id);
  const gold = CONFIG.INCURSION_IGNORED_GOLD * zd.danger;
  const mat  = CONFIG.INCURSION_IGNORED_MATERIAL * zd.danger;
  const tookGold = Math.min(state.gold, gold);
  const tookMat  = Math.min(state.materials[zd.material] || 0, mat);
  state.gold -= tookGold;
  state.materials[zd.material] -= tookMat;
  zoneState.rival = clamp(0, CONFIG.RIVAL_MAX, zoneState.rival + CONFIG.INCURSION_IGNORED_RIVAL);
  if (into) into.push({ zoneId: zoneState.id, zoneName: zd.name,
                        gold: tookGold, material: tookMat, materialId: zd.material });
  return { gold: tookGold, material: tookMat };
}

/* ------------------------------------------------------- Consolidation ---
   §4: spend a Charter to lock a permanent decay floor at the bottom of the
   current tier. This is the whole answer to the treadmill.
   ------------------------------------------------------------------------ */
function consolidateTarget(zoneState){
  return CONFIG.TIERS[tierIndexFor(zoneState.influence)].min;
}
function canConsolidate(zoneState){
  const target = consolidateTarget(zoneState);
  if (target <= (zoneState.influenceFloor || 0))
    return { ok:false, why:"already", target: target };
  if (state.charters < CONFIG.CONSOLIDATE_CHARTER_COST)
    return { ok:false, why:"charters", target: target };
  return { ok:true, target: target };
}
function consolidate(zoneState){
  const c = canConsolidate(zoneState);
  if (!c.ok) return false;
  // Raise the floor BEFORE spending, so a throw cannot cost a Charter for nothing.
  zoneState.influenceFloor = c.target;
  state.charters -= CONFIG.CONSOLIDATE_CHARTER_COST;
  save();
  return true;
}

/* ============================================================== THE KEEP ==
   One accessor per building so no caller ever indexes the level table by hand.
   ========================================================================= */
function keepLevel(id){
  const b = CONFIG.BUILDINGS[id];
  if (!b) return 0;
  const n = Number(state && state.keep ? state.keep[id] : undefined);
  // Number(null) is 0 and clamp() lets null through both comparisons, so a null
  // or NaN level used to reach levels[null] and blow up on the first field read.
  if (!isFinite(n)) return b.start;
  return clamp(b.start, b.max, Math.floor(n));
}
function keepEffect(id, level){
  const b = CONFIG.BUILDINGS[id];
  return b.levels[clamp(0, b.max, level === undefined ? keepLevel(id) : level)];
}
/* The material and gold cost of the NEXT level, or null when maxed. */
function keepUpgradeCost(id){
  const b = CONFIG.BUILDINGS[id];
  const next = keepLevel(id) + 1;
  if (next > b.max) return null;
  const row = b.levels[next];
  const cost = { gold: row.gold || 0, materials: {} };
  Object.keys(CONFIG.MATERIALS).forEach(m => { if (row[m]) cost.materials[m] = row[m]; });
  return cost;
}
function keepCanAfford(id){
  const c = keepUpgradeCost(id);
  if (!c) return { ok:false, maxed:true, short:{} };
  const short = {};
  if (state.gold < c.gold) short.gold = c.gold - state.gold;
  Object.keys(c.materials).forEach(m => {
    const have = state.materials[m] || 0;
    if (have < c.materials[m]) short[m] = c.materials[m] - have;
  });
  return { ok: Object.keys(short).length === 0, maxed:false, short: short, cost: c };
}
function keepUpgrade(id){
  const b = CONFIG.BUILDINGS[id];
  if (!b) return false;
  if (!state.keep || typeof state.keep !== "object") state.keep = {};
  const a = keepCanAfford(id);
  if (!a.ok) return false;
  const next = keepLevel(id) + 1;
  if (next > b.max) return false;
  // Raise the level BEFORE paying. Debiting first meant that if this line threw
  // -- which it did on any save without a `keep` object -- the gold and materials
  // were already gone and no building had been gained, silently, with the click
  // appearing to do nothing so the player pressed it again.
  state.keep[id] = next;
  state.gold -= a.cost.gold;
  Object.keys(a.cost.materials).forEach(m => {
    state.materials[m] = (state.materials[m] || 0) - a.cost.materials[m];
  });
  save();
  return true;
}
function rosterCap(){ return keepEffect("greatHall").rosterCap; }

/* Phase 1 has no Patrol quests, but decay must already ask the question so
   Phase 3 does not have to reopen the decay path. */
function zoneHasPatrol(zoneState){
  return state ? state.activeQuests.some(q => q.zoneId === zoneState.id && q.type === "patrol") : false;
}

/* ======================================================== HERO MECHANICS == */
/* DESIGN.md §7 derives exactly three: Power, Guile, Grace. §6 then names
   ENDURANCE as Patrol's test and never defines it -- see Open Decision #5.
   Might + Spirit is the reading taken here: body and will, the two things a long
   lonely circuit actually costs. Muster is "Everything" for Warfronts, and is
   the raw sum of all five so no single specialist can carry a pitched action.
   `physical` marks the stats a wound and a power-modifying trait actually bite
   into. DESIGN.md §7 calls the injury penalty a POWER penalty, and every trait
   that touches strength says "power" -- so Guile and Grace are left alone. That
   is deliberate and it earns its keep: a hero with a Grievous wound is still the
   right person to send to a funeral, which is what "injured heroes remain
   deployable" is supposed to mean. See Open Decision #6. */
const DERIVED = {
  power:     { name:"Power",     physical:true,  of: h => h.attrs.might + h.attrs.agility },
  guile:     { name:"Guile",     physical:false, of: h => h.attrs.wits  + h.attrs.agility },
  grace:     { name:"Grace",     physical:false, of: h => h.attrs.presence + h.attrs.spirit },
  endurance: { name:"Endurance", physical:true,  of: h => h.attrs.might + h.attrs.spirit },
  muster:    { name:"Muster",    physical:true,  of: h => h.attrs.might + h.attrs.agility +
                                          h.attrs.wits + h.attrs.spirit + h.attrs.presence }
};
function basePower(h){ return DERIVED.power.of(h); }
function baseGuile(h){ return DERIVED.guile.of(h); }
function baseGrace(h){ return DERIVED.grace.of(h); }

function injuryDef(sevId){
  return CONFIG.INJURY_SEVERITIES.find(s => s.id === sevId) || null;
}
function injuryPenalty(h){
  const d = injuryDef(h.injury.severity);
  return d ? d.powerPenalty : 0;
}

/* ========================================================== PROGRESSION ==
   XP has been accruing since the Training Yard. Levels spend it.
   ========================================================================= */
function xpForLevel(level){
  return Math.round(CONFIG.XP_PER_LEVEL * Math.pow(CONFIG.XP_LEVEL_GROWTH, level - 1));
}
/* Total XP a level-1 hero must bank to stand at `level`. */
function xpToReach(level){
  let n = 0;
  for (let i = 1; i < clamp(1, CONFIG.LEVEL_MAX, level); i++) n += xpForLevel(i);
  return n;
}
function subclassDef(h){
  const list = CONFIG.SUBCLASSES[h.cls] || [];
  return list.filter(s => s.id === h.subclass)[0] || null;
}
/* True when the hero has earned a Tier 2 branch and not yet chosen one (§7). */
function awaitingSubclass(h){
  return h.level >= CONFIG.SUBCLASS_LEVEL && !h.subclass && !!CONFIG.SUBCLASSES[h.cls];
}
function chooseSubclass(h, id){
  if (!awaitingSubclass(h)) return false;
  // Not while they are in the field. resolveQuest reads a hero's injury and heal
  // multipliers LIVE, so branching someone mid-quest would quietly change the
  // odds the deploy drawer had already promised -- safer as a Knight, more
  // dangerous as a Berserker, with no notice either way. Deploy freezes ratio,
  // chance and the party-wide modifiers precisely so this cannot happen; a
  // hero's own subclass is the one thing that could still move underneath it.
  if (h.status === "deployed") return false;
  const pick = (CONFIG.SUBCLASSES[h.cls] || []).filter(s => s.id === id)[0];
  if (!pick) return false;
  h.subclass = id;
  save();
  return true;
}
/* Spend banked XP. Each level raises one attribute, cycling through the order
   the class grows in, so a Warrior grows into a Warrior. */
function applyLevels(h){
  let gained = 0;
  while (h.level < CONFIG.LEVEL_MAX && h.xp >= xpForLevel(h.level)){
    h.xp -= xpForLevel(h.level);
    h.level++;
    const cycle = CONFIG.LEVEL_ATTR_CYCLE[h.cls] || ["might"];
    const attr = cycle[(h.level - 2) % cycle.length];
    h.attrs[attr] = (h.attrs[attr] || 0) + 1;
    gained++;
  }
  return gained;
}

/* XP a hero takes from one piece of work (§7). Paid per hero, so overstaffing
   teaches everyone -- it already costs duration and slate slots, which is where
   that trade belongs. `share` carries partial Delve credit: a party that turned
   back after one stage of three learned a third as much, the same rule the gold
   and influence already follow.

   `hours` is the quest's own nominal length, NOT the elapsed wall clock: an
   overstaffed party finishes faster and must not be paid less for it, and a
   quest resolved after a two-day absence must not pay two days of XP. */
function questXP(aq, zd, success, share){
  const hours = (CONFIG.DURATION_MS[aq.length] || CONFIG.DURATION_MS.medium) / 3600000;
  const base = Math.max(CONFIG.QUEST_XP_MIN, CONFIG.QUEST_XP_PER_HOUR * hours);
  const danger = 1 + (zd.danger - 1) * CONFIG.QUEST_XP_DANGER_SCALE;
  // ONE outcome multiplier, not a failure rate times a share -- multiplying the
  // two would pay a party that cleared two Delve stages of three LESS than the
  // arithmetic suggests and make the curve non-obvious. Ordering is the thing
  // that matters here: a rout pays the floor, a partial pays what it cleared,
  // and only a clean finish pays in full.
  const outcome = success ? 1
    : Math.max(CONFIG.QUEST_XP_FAIL_MULT, share || 0);
  return Math.round(base * danger * outcome);
}

/* ============================================================ SANCTUM =====
   §8: Mark removal. Every Mark's detail page has promised this since Phase 4,
   which made "permanent" a half-truth the game itself kept pointing at. It is
   expensive on purpose -- a Mark should cost something real to be rid of, or
   the whole consequence layer becomes a toll booth.
   ========================================================================= */
function sanctumLiftCost(){
  const e = keepEffect("sanctum");
  return { gold: e.liftGold, material: e.liftMaterial };
}
function canLiftMark(h, markId){
  if (keepLevel("sanctum") < 1) return { ok:false, why:"nosanctum" };
  if (!h || !(h.marks || []).some(m => m.id === markId)) return { ok:false, why:"nomark" };
  // Not while they are out. Same rule as branching: nothing about a hero may
  // move underneath a quest whose odds were frozen when it was deployed.
  if (h.status === "deployed") return { ok:false, why:"deployed" };
  const c = sanctumLiftCost();
  if (state.gold < c.gold) return { ok:false, why:"gold" };
  // Paid in the material of the zone the Mark was taken in: the ground that
  // did it is the ground that answers for it.
  const m = (h.marks || []).filter(x => x.id === markId)[0];
  const matId = (zoneDef(m.zoneId) || CONFIG.ZONES[0]).material;
  if ((state.materials[matId] || 0) < c.material) return { ok:false, why:"material", matId: matId };
  return { ok:true, matId: matId, cost: c };
}
function liftMark(h, markId){
  const can = canLiftMark(h, markId);
  if (!can.ok) return false;
  // Remove BEFORE taking payment. The Phase 5 lesson: a debit followed by a
  // throw is the one failure mode a defensive read cannot show you.
  h.marks = (h.marks || []).filter(m => m.id !== markId);
  state.gold -= can.cost.gold;
  state.materials[can.matId] = Math.max(0, (state.materials[can.matId] || 0) - can.cost.material);
  save();
  return true;
}

/* ============================================================== FORGE =====
   §8: craft, upgrade, salvage. Crafting from nothing is deliberately absent --
   §6 makes gear the reward for going out, and a bench that prints it would
   undercut the three quest types whose payoff it is. Upgrade and salvage both
   act on what the field actually gave you.
   ========================================================================= */
function gearUpgradeCost(it){
  const t = gearTier(it);
  if (t >= CONFIG.GEAR_TIER_MAX) return null;
  return { gold: CONFIG.GEAR_UPGRADE_GOLD[t], material: CONFIG.GEAR_UPGRADE_MATERIAL[t] };
}
/* Upgrading spends the material of the zone whose danger can produce the tier
   being bought, so the hardest ground gates the best gear twice over. */
function gearUpgradeMaterial(toTier){
  const z = CONFIG.ZONES.filter(z => z.danger >= (toTier >= 3 ? CONFIG.GEAR_TIER3_AT_DANGER
                                                              : CONFIG.GEAR_TIER2_AT_DANGER));
  return (z[0] || CONFIG.ZONES[CONFIG.ZONES.length - 1]).material;
}
function canUpgradeGear(it){
  if (!keepEffect("forge").upgrade) return { ok:false, why:"forge" };
  const cost = gearUpgradeCost(it);
  if (!cost) return { ok:false, why:"maxed" };
  if (gearTier(it) + 1 > keepEffect("forge").maxTier) return { ok:false, why:"tier" };
  const matId = gearUpgradeMaterial(gearTier(it) + 1);
  if (state.gold < cost.gold) return { ok:false, why:"gold", cost:cost, matId:matId };
  if ((state.materials[matId] || 0) < cost.material)
    return { ok:false, why:"material", cost:cost, matId:matId };
  return { ok:true, cost:cost, matId:matId };
}
function upgradeGear(it){
  const can = canUpgradeGear(it);
  if (!can.ok) return false;
  it.tier = gearTier(it) + 1;          // raise first, then pay
  state.gold -= can.cost.gold;
  state.materials[can.matId] = Math.max(0, (state.materials[can.matId] || 0) - can.cost.material);
  save();
  return true;
}
function salvageGear(index){
  if (!keepEffect("forge").salvage) return false;
  const it = stash()[index];
  if (!it) return false;
  const t = gearTier(it);
  stash().splice(index, 1);
  state.gold += CONFIG.GEAR_SALVAGE_GOLD[t];
  // Broken down into the material of the ground it most likely came from.
  const matId = gearUpgradeMaterial(Math.max(2, t));
  state.materials[matId] = (state.materials[matId] || 0) + CONFIG.GEAR_SALVAGE_MATERIAL[t];
  save();
  return true;
}
/* Equip from the stash. Anything already in that slot goes back to the stash
   rather than being destroyed -- swapping kit must never cost the player an
   item they earned. */
function equipGear(h, index){
  const it = stash()[index];
  const def = gearDef(it && it.id);
  if (!h || !def) return false;
  if (h.status === "deployed") return false;
  h.gear = h.gear || { weapon:null, armor:null, trinket:null };
  const current = h.gear[def.slot];
  stash().splice(index, 1);
  if (current) stash().push(current);
  h.gear[def.slot] = it;
  save();
  return true;
}
function unequipGear(h, slot){
  if (!h || !h.gear || !h.gear[slot]) return false;
  if (h.status === "deployed") return false;
  if (stash().length >= CONFIG.GEAR_STASH_MAX) return false;
  stash().push(h.gear[slot]);
  h.gear[slot] = null;
  save();
  return true;
}

/* --------------------------------------------------------- recruitment --- */
function recruitOffers(){
  const held = new Set(state.heroes.map(h => h.name));
  return RECRUITS.filter(r => {
    if (held.has(r.name)) return false;
    const z = zoneOf(r.homeZone);
    return z && tierIndexFor(z.influence) >= CONFIG.RECRUIT_MIN_TIER;
  });
}
function canRecruit(def){
  if (!def) return { ok:false, why:"unknown" };
  if (state.heroes.some(h => h.name === def.name)) return { ok:false, why:"already" };
  const z = zoneOf(def.homeZone);
  if (!z || tierIndexFor(z.influence) < CONFIG.RECRUIT_MIN_TIER)
    return { ok:false, why:"tier" };
  if (state.heroes.length >= rosterCap()) return { ok:false, why:"room" };
  return { ok:true };
}
function recruit(def){
  if (!canRecruit(def).ok) return false;
  state.heroes.push(makeHero(def));
  save();
  return true;
}

/* Resolve every trait a hero carries against the job in front of them. `ctx`
   carries { zoneId, danger, failed }; a bare call with no context yields only
   the unconditional effects, which is what the Roster wants to show. */
/* The one definition of an effect accumulator. The assertion suite builds these
   too, and hand-rolled copies had already drifted -- one carried a dead key and
   was missing statMult entirely, so it would have silently stopped detecting any
   trait that used it. There is exactly one constructor now.

   `powerMult` is general physical strength and applies to every physical stat.
   `statMult` is per-stat and is what Marks use, since a scar can sharpen Guile or
   cost Grace -- neither of which powerMult is allowed to touch. */
/* =============================================================== GEAR =====
   DESIGN.md §6 lists gear as the reward for Clear, Hunt and Delve, and §8 gives
   the Forge to craft, upgrade and salvage it. The authored table below carries
   NAMES AND FLAVOUR ONLY -- every number lives in the CONFIG gear block, so a retune
   never touches content and content never has to be re-verified for balance.

   An owned item is { id, tier }. Tier is on the INSTANCE, not the definition,
   because the Forge upgrades an item in place: a billhook that has been
   reforged twice is still that billhook, which is the whole appeal.

   What each slot does is a real choice rather than a ladder:
     weapon  - raises the PHYSICAL derived stats only, exactly the set a wound
               bites. A blade does nothing for a hero sent to a funeral, which
               is the same rule the injury model already states.
     armor   - lowers injury chance, for anyone.
     trinket - raises influence, which no other equipment in the game touches
               and which is what a Court specialist actually wants.
   ========================================================================= */
const GEAR_BY_ID = {};
function registerGear(raw){
  Object.keys(GEAR).forEach(k => delete GEAR[k]);
  Object.keys(GEAR_BY_ID).forEach(k => delete GEAR_BY_ID[k]);
  CONFIG.GEAR_SLOTS.forEach(slot => {
    GEAR[slot] = {};
    for (let tier = 1; tier <= CONFIG.GEAR_TIER_MAX; tier++){
      const list = ((raw[slot] || {})[tier] || (raw[slot] || {})[String(tier)] || []);
      GEAR[slot][tier] = list.map(it => {
        const def = { id: it.id, name: it.name, flavor: it.flavor, slot: slot, baseTier: tier };
        GEAR_BY_ID[it.id] = def;
        return def;
      });
    }
  });
}
const gearDef = id => GEAR_BY_ID[id] || null;
const gearTier = it => it ? clamp(1, CONFIG.GEAR_TIER_MAX, Math.round(it.tier) || 1) : 0;
function gearName(it){
  const d = gearDef(it && it.id);
  if (!d) return "unknown";
  // A reforged item says so. Tier is the instance's, not the table's, so this
  // is the only place the difference is visible to the player.
  const up = gearTier(it) - d.baseTier;
  return d.name + (up > 0 ? " +" + up : "");
}
/* Effect of one equipped item, resolved against CONFIG rather than the table. */
function gearEffect(it){
  const d = gearDef(it && it.id);
  if (!d) return null;
  return (CONFIG.GEAR_EFFECTS[d.slot] || [])[gearTier(it)] || null;
}
const PHYSICAL_STATS = Object.keys(DERIVED).filter(k => DERIVED[k].physical);
registerGear(GEAR_RAW);

/* Every item the Keep owns but nobody is carrying. */
function stash(){ return (state.stash = state.stash || []); }
function equipped(h, slot){ return (h.gear || {})[slot] || null; }
/* Roll a find. Only the types §6 says pay gear can drop it, and the tier is
   gated on how dangerous the ground was -- the best gear comes out of the worst
   places, which is what makes a Delve in the Reach worth the bodies. */
function rollGearDrop(typeId, danger, forge){
  const base = CONFIG.GEAR_DROP_CHANCE[typeId];
  if (base === undefined) return null;
  const chance = base * (1 + (danger - 1) * CONFIG.GEAR_DROP_DANGER_SCALE) + forge.dropBonus;
  if (rand() >= chance) return null;
  let tier = 1;
  if (danger >= CONFIG.GEAR_TIER2_AT_DANGER && rand() < 0.45) tier = 2;
  if (danger >= CONFIG.GEAR_TIER3_AT_DANGER && rand() < 0.18) tier = 3;
  tier = Math.min(tier, forge.maxTier);
  const slot = pick(CONFIG.GEAR_SLOTS);
  const pool = (GEAR[slot] || {})[tier] || [];
  if (!pool.length) return null;
  return { id: pick(pool).id, tier: tier };
}

function blankEffects(){
  return { powerMult:1, influenceBonus:0, injuryMult:1,
           fatigueGainMult:1, restMult:1, healMult:1, fatigueIgnoredBelow:null,
           statMult: { power:1, guile:1, grace:1, endurance:1, muster:1 } };
}

function traitEffects(h, ctx){
  const acc = blankEffects();
  const c = ctx || {};
  (h.traits || []).forEach(id => {
    const t = TRAITS[id];
    if (t && t.apply) t.apply(acc, h, c);
  });
  (h.marks || []).forEach(m => {
    const def = MARKS[m && m.id];
    if (def && def.apply) def.apply(acc, h, c, m);
  });
  // Gear rides the same accumulator as everything else, which is the only
  // reason it reaches the drawer's odds, the resolver, the roster and the
  // harness without any of them being told gear exists.
  if (h.gear) CONFIG.GEAR_SLOTS.forEach(slot => {
    const eff = gearEffect(h.gear[slot]);
    if (!eff) return;
    // A weapon lifts the PHYSICAL stats only -- the same set a wound bites, and
    // for the same reason: a better blade is no use at a funeral.
    if (eff.statMult) PHYSICAL_STATS.forEach(k => { acc.statMult[k] *= eff.statMult; });
    if (eff.injuryMult)     acc.injuryMult *= eff.injuryMult;
    if (eff.influenceBonus) acc.influenceBonus += eff.influenceBonus;
  });
  // The Tier 2 branch, folded in the same way so nothing downstream has to know
  // whether an effect came from a trait, a Mark or a subclass.
  const sub = subclassDef(h);
  if (sub){
    if (sub.statMult)
      Object.keys(sub.statMult).forEach(k => { acc.statMult[k] *= sub.statMult[k]; });
    if (sub.injuryMult)     acc.injuryMult *= sub.injuryMult;
    if (sub.healMult)       acc.healMult   *= sub.healMult;
    if (sub.influenceBonus) acc.influenceBonus += sub.influenceBonus;
  }
  return acc;
}

/* One hero's contribution to whichever stat a quest tests. */
function heroStat(h, statId, ctx){
  const d = DERIVED[statId] || DERIVED.power;
  const fx = traitEffects(h, ctx);
  const v = d.of(h) * (fx.statMult[statId] || 1);
  if (!d.physical) return v;
  return v * (1 - injuryPenalty(h)) * fx.powerMult;
}
function effectivePower(h, ctx){ return heroStat(h, "power", ctx); }
function fatigueMult(h){
  const ignore = traitEffects(h).fatigueIgnoredBelow;
  if (ignore !== null && h.fatigue < ignore) return 1;
  return 1 + h.fatigue / CONFIG.FATIGUE_MAX;
}
function isAvailable(h){ return h.status === "idle"; }

/* ======================================================= PARTY MATH ======
   DESIGN.md §6. These formulas are the difficulty curve; they are never
   delegated and the harness measures them rather than guessing.
   ========================================================================= */
function roleCoverage(heroes){
  const roles = new Set(heroes.map(h => h.role));
  return Math.min(
    CONFIG.ROLE_COVERAGE_CAP,
    CONFIG.ROLE_COVERAGE_BASE + roles.size * CONFIG.ROLE_COVERAGE_PER_ROLE
  );
}
function staffing(count, required){
  const extra   = Math.max(0, count - required);
  const missing = Math.max(0, required - count);
  return {
    extra, missing,
    powerMult:    missing ? Math.max(CONFIG.UNDERSTAFF_POWER_FLOOR,
                    1 - CONFIG.UNDERSTAFF_POWER_PER_HERO * missing) : 1,
    injuryMult:   extra ? Math.max(CONFIG.OVERSTAFF_FLOOR,
                    1 - CONFIG.OVERSTAFF_INJURY_PER_HERO * extra) : 1,
    durationMult: extra ? Math.max(CONFIG.OVERSTAFF_FLOOR,
                    1 - CONFIG.OVERSTAFF_DURATION_PER_HERO * extra) : 1
  };
}
function partyPower(heroes, required, ctx, statId){
  const raw = heroes.reduce((n, h) => n + heroStat(h, statId || "power", ctx), 0);
  return raw * roleCoverage(heroes) * staffing(heroes.length, required).powerMult;
}
/* The exact injury odds a hero faces across every possible stage outcome, given
   a per-stage success chance `p`. This is the same model resolveQuest rolls:
   each cleared stage exposes them at `perOk`, and a run that ends in failure
   adds one more exposure at `perFail`. Returns the probability-weighted expected
   risk (the honest headline) and the risk on the single worst outcome. */
function injuryOutcomeOdds(perOk, perFail, p, stages){
  let expected = 0, worst = 0;
  for (let k = 0; k < stages; k++){            // cleared exactly k, then failed
    const pk = Math.pow(p, k) * (1 - p);
    const c  = 1 - Math.pow(1 - perOk, k) * (1 - perFail);
    expected += pk * c;
    worst = Math.max(worst, c);
  }
  const pAll = Math.pow(p, stages);            // cleared every stage
  const cAll = 1 - Math.pow(1 - perOk, stages);
  expected += pAll * cAll;
  worst = Math.max(worst, cAll);
  return { expected: clamp(0, 1, expected), worst: clamp(0, 1, worst) };
}

/* Hunt names a quarry and the kind of hero who knows how to take it. Bringing
   that role is a real bonus; not bringing it is a penalty, never a refusal. */
function hunterCounterMult(quest, heroes){
  // Gate on the TYPE declaring a counter, not merely on the quest carrying a
  // counterRole field. Keying off the field alone meant a stray counterRole on
  // any other type silently applied a Hunt bonus to it.
  const t = CONFIG.QUEST_TYPES[quest.type];
  if (!t || !t.counter || !quest.counterRole) return 1;
  if (!heroes.some(h => h.role === quest.counterRole)) return CONFIG.HUNT_COUNTER_MISSING;
  // A Hunter is better at this than an ordinary Skirmisher.
  const bonus = heroes.reduce((n, h) => {
    const s = subclassDef(h);
    return n + ((s && s.counterBonus && h.role === quest.counterRole) ? s.counterBonus : 0);
  }, 0);
  return CONFIG.HUNT_COUNTER_BONUS + bonus;
}

/* Party-wide injury modifiers (the Warden keeps everyone standing). Computed
   from the party, so it is frozen at deploy alongside the event multiplier --
   otherwise a Warden joining or leaving between preview and resolution would
   change odds the drawer had already promised. */
function partyInjuryMult(heroes){
  return (heroes || []).reduce((n, h) => {
    const s = subclassDef(h);
    return n * (s && s.partyInjuryMult ? s.partyInjuryMult : 1);
  }, 1);
}
/* Influence traits are ADDITIVE across the party, never multiplicative -- four
   Banner-Bearers should be +100%, not +144%, and compounding makes a large
   party's standing gain run away from the numbers shown in the drawer. */
function partyInfluenceBonus(heroes, ctx){
  return heroes.reduce((n, h) => n + traitEffects(h, ctx).influenceBonus, 0);
}
function successChance(ratio){
  return clamp(CONFIG.SUCCESS_MIN, CONFIG.SUCCESS_MAX,
    CONFIG.SUCCESS_BASE + (ratio - 1) * CONFIG.SUCCESS_RATIO_SLOPE);
}
/* `eventMult` overrides the zone's live event multiplier. Resolution passes the
   value frozen at deploy; the preview leaves it undefined and reads the current
   event, which is what the player is being shown. */
function injuryChance(hero, danger, ratio, staff, failed, locked, zoneId, questType, eventMult){
  let c = danger * CONFIG.INJURY_DANGER_COEFF * (1 / Math.max(0.05, ratio))
        * fatigueMult(hero) * staff.injuryMult;
  if (failed) c *= CONFIG.INJURY_FAIL_MULT;
  if (locked) c *= CONFIG.RIVAL_LOCK_INJURY_MULT;
  const t = questType && CONFIG.QUEST_TYPES[questType];
  if (t) c *= t.injuryMult;         // a Court is not a Delve
  if (eventMult !== undefined) c *= eventMult;
  else if (zoneId && state){
    const zs = zoneOf(zoneId);
    if (zs) c *= eventEffect(zs, "injuryMult", 1);   // Blight
  }
  c *= traitEffects(hero, { zoneId, danger, failed }).injuryMult;
  return clamp(0, 0.95, c);
}
/* A Grievous wound may leave something permanent. Marks restricted to a zone can
   only be taken in that zone, and nobody carries the same Mark twice. */
function maybeMark(hero, zoneId, atMs, report){
  // The Sanctum's second half: consecrated ground makes fewer Marks take hold.
  // It acts ONLY here, on the Mark roll -- lowering injury chance instead would
  // be the Infirmary's and the Warden's ground, and §8 asks each building to
  // own a system rather than stack another percentage on a shared one.
  if (rand() >= CONFIG.MARK_CHANCE_ON_GRIEVOUS * keepEffect("sanctum").markChanceMult)
    return null;
  const held = new Set((hero.marks || []).map(m => m.id));
  const eligible = Object.keys(MARKS).filter(id =>
    !held.has(id) && (!MARKS[id].onlyZone || MARKS[id].onlyZone === zoneId));
  if (!eligible.length) return null;
  const id = pick(eligible);
  const mark = { id: id, zoneId: zoneId, atMs: atMs };
  hero.marks = (hero.marks || []).concat([mark]);
  if (report) report.marks.push({ name: hero.name, mark: MARKS[id].name });
  return mark;
}

function rollSeverity(ratio){
  // Worse ratios shift weight toward the worse severities.
  const shift = clamp(0, CONFIG.INJURY_SEVERITY_RATIO_SHIFT,
                      (1 / Math.max(0.05, ratio) - 1) * CONFIG.INJURY_SEVERITY_RATIO_SHIFT);
  const sev = CONFIG.INJURY_SEVERITIES;
  const w = sev.map((s, i) => Math.max(0, s.weight + (i === 0 ? -shift : shift / (sev.length - 1))));
  const total = w.reduce((a, b) => a + b, 0);
  let r = rand() * total;
  for (let i = 0; i < sev.length; i++){ r -= w[i]; if (r <= 0) return sev[i]; }
  return sev[sev.length - 1];
}

/* Preview shown in the deploy drawer. Pure -- the same numbers the resolver
   will use, so the readout can never drift from the outcome. */
function previewQuest(quest, heroes){
  const zd = zoneDef(quest.zoneId), zs = zoneOf(quest.zoneId);
  const locked = isLocked(zs);
  const type = CONFIG.QUEST_TYPES[quest.type];
  const req = quest.required;
  const ctx = { zoneId: quest.zoneId, danger: zd.danger, failed: false };
  const staff = staffing(heroes.length, req);
  const counter = hunterCounterMult(quest, heroes);
  const power = partyPower(heroes, req, ctx, type.stat) * counter;
  const diff = quest.difficulty * (locked ? CONFIG.RIVAL_LOCK_DIFFICULTY_MULT : 1);
  const ratio = diff > 0 ? power / diff : 1;
  const chance = successChance(ratio);
  const duration = Math.round(quest.durationMs * staff.durationMult);
  const totalPresence = heroes.reduce((n, h) => n + h.attrs.presence, 0);
  const baseGain = type.warfrontInfluence
    ? CONFIG.INFLUENCE_GAIN.warfront : CONFIG.INFLUENCE_GAIN[quest.length];
  const festival = quest.type === "court" ? eventEffect(zs, "courtInfluenceMult", 1) : 1;
  const influence = baseGain * type.influenceMult
                  * (1 + totalPresence * CONFIG.PRESENCE_INFLUENCE_PER_POINT)
                  * (1 + partyInfluenceBonus(heroes, ctx))
                  * (1 + keepEffect("greatHall").influenceBonus)
                  * festival;
  const stagesN = type.stages || 1;
  const injMod = eventEffect(zs, "injuryMult", 1) * partyInjuryMult(heroes);
  const injuries = heroes.map(h => {
    // A hero who is ALREADY hurt does not roll the danger-derived chance at
    // all. §7's rule, and resolveQuest's own code, is that the existing wound
    // worsens by one step at a flat rate or it does not -- there is no fresh
    // wound to take. So the danger figure is not what will be rolled for them,
    // and quoting it was wrong in both directions: it understated a Light wound
    // in Greenhollow (9% shown, 30% real) and, worse, told a GRIEVOUS hero they
    // faced up to 60% when they have nothing left to worsen into and their true
    // risk is zero. That number talked players out of exactly the send the
    // design exists to permit -- a maimed hero is still the right person for a
    // Court. Found by running the assertion suite against a wounded roster.
    const already = injuryDef(h.injury.severity);
    if (already){
      const order = CONFIG.INJURY_SEVERITIES;
      const worsenable = order.findIndex(s => s.id === already.id) < order.length - 1;
      const p = worsenable ? CONFIG.INJURY_WORSEN_CHANCE : 0;
      return { hero: h, perOk: p, perFail: p, expected: p, worst: p,
               worsens: true, worsenable: worsenable };
    }
    const perOk   = injuryChance(h, zd.danger, ratio, staff, false, locked, quest.zoneId, quest.type, injMod);
    const perFail = injuryChance(h, zd.danger, ratio, staff, true,  locked, quest.zoneId, quest.type, injMod);
    const odds = injuryOutcomeOdds(perOk, perFail, chance, stagesN);
    return { hero: h, perOk: perOk, perFail: perFail,
             expected: odds.expected, worst: odds.worst };
  });
  // Headline is the EXPECTED risk across every outcome, not the best case. The
  // old number read only the on-success branch, so it understated danger most
  // on exactly the desperate sends the design calls "weakened, never forbidden"
  // -- those have the lowest success odds and the widest gap to the failure
  // branch. And for a Delve it ignored stage exposure entirely.
  const expectedHurt = injuries.reduce((m, i) => Math.max(m, i.expected), 0);
  const worst = injuries.reduce((m, i) => Math.max(m, i.worst), 0);
  return { staff, power, diff, ratio, chance, duration, influence, injuries,
           expectedHurt, worst, locked, req, type, stat: type.stat, counter,
           stages: stagesN, festival: festival,
           reward: eventEffect(zs, "rewardMult", 1) };
}

/* ========================================================= QUEST SLATE ==== */
/* Difficulty is stated per required hero, so every type shares one ratio scale. */
function questDifficulty(typeId, required, danger){
  const t = CONFIG.QUEST_TYPES[typeId];
  return t.perHero * required * (1 + (danger - 1) * CONFIG.QUEST_DANGER_SCALE);
}
function slateSize(zoneState){
  const t = tierIndexFor(zoneState.influence);
  const hi = t >= CONFIG.SLATE_BONUS_MIN_TIER ? CONFIG.SLATE_MAX_HIGH_TIER : CONFIG.SLATE_MAX;
  return Math.floor(randRange(CONFIG.SLATE_MIN, hi + 1));
}

/* Which types this zone can currently offer. Warfront is gated on Honored per
   DESIGN.md §4's tier table; Delve wants at least Noticed. */
/* Types the ordinary weighted slate may offer. A rival-gated type is never in
   here -- Reclaim is placed by reseedSlate() on the zones that need it, and
   leaving it in the pool with weight 0 would still let pickType()'s final
   fallback return it on a zone with nothing wrong. */
function availableTypes(zoneState){
  const tier = tierIndexFor(zoneState.influence);
  return Object.keys(CONFIG.QUEST_TYPES).filter(id => {
    const t = CONFIG.QUEST_TYPES[id];
    return !t.rivalGated && t.weight > 0 && tier >= t.minTier;
  });
}

/* §4: a rival this far in is the condition Reclaim exists for. Deliberately
   BELOW the lock threshold -- a campaign you can only mount once the zone has
   already fallen is a campaign you mount too late. */
function reclaimOffered(zoneState){
  return zoneState.rival >= CONFIG.RIVAL_LOCK_AT * CONFIG.RECLAIM_MIN_RIVAL_FRACTION;
}
function pickType(zoneState){
  const ids = availableTypes(zoneState);
  const total = ids.reduce((n, id) => n + CONFIG.QUEST_TYPES[id].weight, 0);
  let r = rand() * total;
  for (const id of ids){ r -= CONFIG.QUEST_TYPES[id].weight; if (r <= 0) return id; }
  return ids[ids.length - 1];
}

/* One table per type, assembled from the authored sources. Clear keeps its own
   Phase 1 pool; the rest come from the two Phase 3 tables. */
const QUEST_POOLS = {
  clear:       { greenhollow: CLEAR_QUESTS.greenhollow, marrowfen: CLEAR_QUESTS.marrowfen,
                 thornmarch: CLEAR_QUESTS.thornmarch,   ashenreach: CLEAR_QUESTS.ashenreach },
  patrol:      QUIET_QUESTS.patrol,
  investigate: QUIET_QUESTS.investigate,
  court:       QUIET_QUESTS.court,
  hunt:        DANGEROUS_QUESTS.hunt,
  delve:       DANGEROUS_QUESTS.delve,
  warfront:    DANGEROUS_QUESTS.warfront,
  reclaim:     RECLAIM_QUESTS
};
function questPool(typeId, zoneId){
  return (QUEST_POOLS[typeId] && QUEST_POOLS[typeId][zoneId]) || [];
}

function makeQuest(zoneState, t, forcedType){
  const zd = zoneDef(zoneState.id);
  const typeId = forcedType || pickType(zoneState);
  const type = CONFIG.QUEST_TYPES[typeId];
  const pool = questPool(typeId, zoneState.id);
  if (!pool.length) return null;

  const taken = new Set(zoneState.slate.filter(q => q.type === typeId).map(q => q.name));
  const open = pool.filter(q => !taken.has(q.name));
  const src = pick(open.length ? open : pool);

  let required = type.min + Math.floor(rand() * (type.max - type.min + 1));
  // Muster: the countryside turns out, so a Warfront needs one fewer body.
  if (typeId === "warfront")
    required = Math.max(1, required + eventEffect(zoneState, "warfrontReq", 0));
  const length = pick(type.lengths);
  const dur = Math.round(CONFIG.DURATION_MS[length] * (1 + zd.travel));

  const q = {
    id: "q" + (state.questSeq++),
    zoneId: zoneState.id,
    type: typeId,
    typeName: type.name,
    stat: type.stat,
    name: src.name,
    flavor: src.flavor,
    length: length,
    durationMs: dur,
    required: required,
    stages: type.stages || 1,
    difficulty: questDifficulty(typeId, required, zd.danger),
    // BASE reward, with no event multiplier baked in. Multiplying at generation
    // froze whatever event was live when the quest was rolled, so a Blight-priced
    // quest kept paying double long after the Blight ended -- and the injury
    // multiplier, read live, drifted away from it. Both are now applied together
    // at deploy, and the slate card shows the live value.
    gold: Math.round(CONFIG.QUEST_GOLD_BASE * type.goldMult
        * CONFIG.DURATION_GOLD_MULT[length]
        * (1 + (zd.danger - 1) * CONFIG.QUEST_GOLD_DANGER_SCALE)),
    material: Math.round((CONFIG.QUEST_MATERIAL_BASE * type.materialMult)
        * (length === "long" ? 3 : length === "medium" ? 2 : 1) + (zd.danger - 1)),
    // §8: the War Room extends how long a slate entry stays open, which is the
    // pacing gate (§6) loosening rather than more quests appearing.
    expiresAt: t + randRange(CONFIG.QUEST_EXPIRY_MIN_MS, CONFIG.QUEST_EXPIRY_MAX_MS)
             * (1 + keepEffect("warRoom").expiryBonus)
  };
  if (type.counter){
    q.quarry = src.quarry || src.name;
    // The counter is derived from the quarry's own name so it is stable for a
    // given quest rather than rerolled every render.
    const roles = ["Front", "Skirmish", "Arcane", "Support"];
    let h = 0;
    for (let i = 0; i < q.quarry.length; i++) h = (h * 31 + q.quarry.charCodeAt(i)) >>> 0;
    q.counterRole = roles[h % roles.length];
  }
  return q;
}

function reseedSlate(zoneState, t, force){
  zoneState.slate = zoneState.slate.filter(q => q.expiresAt > t);
  const want = slateSize(zoneState);
  let guard = 0;
  while (zoneState.slate.length < want && guard++ < 24){
    const q = makeQuest(zoneState, t);
    if (q) zoneState.slate.push(q);
  }
  // The campaign sits ON TOP of the slate rather than replacing it, and it does
  // not count against the slate size -- a zone the rival has nearly taken must
  // not have its ordinary work crowded out by the thing that fixes it. One at a
  // time, and not while one is already being fought.
  if (reclaimOffered(zoneState) &&
      !zoneState.slate.some(q => q.type === "reclaim") &&
      !state.activeQuests.some(q => q.type === "reclaim" && q.zoneId === zoneState.id)){
    const r = makeQuest(zoneState, t, "reclaim");
    if (r) zoneState.slate.push(r);
  }
  zoneState.nextReseed = t + CONFIG.SLATE_RESEED_MS;
  if (force) zoneState.nextReseed = t + CONFIG.SLATE_RESEED_MS;
}
