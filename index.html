        '<div class="costrow">' +
          '<span class="cost' + (a.short.gold ? " short" : "") + '">' +
            icon("sym-gold", 12, "var(--gold)") + ' ' + a.cost.gold + '</span>' +
          Object.keys(a.cost.materials).map(m => {
            const md = CONFIG.MATERIALS[m];
            return '<span class="cost' + (a.short[m] ? " short" : "") + '">' +
              icon(md.sym, 12, md.color) + ' ' + a.cost.materials[m] + '</span>';
          }).join("") +
        '</div>';
      if (!a.ok){
        const need = Object.keys(a.short).map(k =>
          a.short[k] + " " + (k === "gold" ? "gold" : CONFIG.MATERIALS[k].name.toLowerCase()));
        h += '<div class="tiny warn" style="margin-bottom:6px">Short ' + need.join(", ") + '.</div>';
      }
      h += '<button class="btn sm ' + (a.ok ? "pri" : "") + '" data-up="' + id + '"' +
        (a.ok ? "" : " disabled") + '>Build</button>';
    }
    h += '</div>';
  });

  h += '<div class="tiny dim" style="margin-top:4px">Every upgrade needs materials ' +
    'from at least ' + CONFIG.KEEP_MIN_MATERIALS_PER_UPGRADE + ' different zones, and each ' +
    'zone is the only source of its own. Holding two zones forever will not build a Keep.</div>';

  v.innerHTML = h;
  v.querySelectorAll("button[data-up]").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.up;
      if (keepUpgrade(id)){
        toast(CONFIG.BUILDINGS[id].name + " raised to level " + keepLevel(id));
        render();
      }
    };
  });
  v.querySelectorAll("button[data-reforge]").forEach(btn => {
    btn.onclick = () => {
      const it = stash()[Number(btn.dataset.reforge)];
      if (it && upgradeGear(it)){ toast(gearName(it) + " reforged."); render(); }
    };
  });
  v.querySelectorAll("button[data-salv]").forEach(btn => {
    btn.onclick = () => {
      const i = Number(btn.dataset.salv);
      const label = gearName(stash()[i]);
      if (salvageGear(i)){ toast(label + " broken down."); render(); }
    };
  });
}

/* Escape closes; Tab stays inside. ONE implementation, shared by the return
   report and the tutorial: the scrim covers the page but everything behind it
   stays keyboard-reachable otherwise, so a Tab-happy player could deploy a
   quest through a dialog that is nominally the only thing on screen. Shipping a
   second, subtly different copy for the second dialog is exactly how the first
   one broke.

   `[href]` must NOT appear in the selector: it also matches every SVG <use>
   icon in a dialog body, a bare <use> is never a Tab stop and ignores focus(),
   so the computed `first` was unreachable, the backward wrap never fired, and
   Shift+Tab walked straight out onto the live page. Anchors specifically, and
   drop anything not actually rendered. */
function trapFocus(scrim, close){
  scrim.onkeydown = e => {
    if (e.key === "Escape"){ close(); return; }
    if (e.key !== "Tab") return;
    const focusable = [...scrim.querySelectorAll(CONFIG.MODAL_FOCUS_SELECTOR)]
      .filter(n => n.getClientRects().length > 0 && !n.disabled);
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  };
}

    'goes on <b>the shelf</b> at the Keep; carrying it is a separate decision, made ' +
    'on a hero&rsquo;s own page. The three slots are not interchangeable:</p>' +

        ["Trinket", "Raises the standing every success is worth. The only equipment " +

    (CONFIG.ZONES.filter(z => z.danger >= CONFIG.GEAR_TIER3_AT_DANGER)[0] || {}).name +
    '</b>. The shelf holds <b>' + CONFIG.GEAR_STASH_MAX + '</b>; a find made with no ' +
    'room is left where it lay, and the report says so.</p>');

  add("The Keep", '<p>' + spell(Object.keys(CONFIG.BUILDINGS).length) + ' buildings, ' +
    CONFIG.BUILDINGS.greatHall.max +
    ' levels each. Every upgrade costs gold plus materials from at least <b>' +
    CONFIG.KEEP_MIN_MATERIALS_PER_UPGRADE + ' different regions</b> — which is why ' +
    'going wide is a prerequisite and not a preference.</p>' +
    dl(Object.keys(CONFIG.BUILDINGS).map(id =>
      ["<b>" + CONFIG.BUILDINGS[id].name + "</b>", CONFIG.BUILDINGS[id].blurb])) +
    '<p>New heroes come from the map, not from coin: a named recruit offers ' +

    '</b>, and the Great Hall decides whether there is a bed for them.</p>');

  add("Winning", '<p>Hold <b>' + spell(CONFIG.WIN_ZONE_COUNT) + ' regions at ' +
    tierName(CONFIG.WIN_MIN_TIER) + '</b> at the same time. Not one after another — ' +
    'at once, with decay pulling at all ' + spell(CONFIG.WIN_ZONE_COUNT) +
    ' of them. It is not reachable with a starting roster, and it is not meant to be.</p>' +
    '<p>Reaching it does not end the game. The Keep goes on.</p>');

  add("Your first week", '<ol class="hol">' +
    '<li><b>' + CONFIG.ZONES[0].name + ' is the gentle one.</b> ' +
      CONFIG.ZONES[CONFIG.ZONES.length - 1].name + ' will maim a level-1 party. Going ' +
      'wide too early is the classic way to lose this game.</li>' +
    '<li><b>Match the hero to the test.</b> Your Mage and Priest look useless on a ' +
      'Clear because they are — they are for Investigate and Court, which pay the best ' +
      'standing in the game.</li>' +
    '<li><b>Bench anyone hurt.</b> They do not heal out there, and a wound that ' +
      'worsens costs far more than the job was worth.</li>' +
    '<li><b>Get three regions to ' + tierName(CONFIG.MATERIAL_DROP_MIN_TIER) +
      '</b> before you plan any building. Below that they produce no materials, and ' +
      'no building can be paid for out of one region anyway.</li>' +
    '<li><b>Post a Patrol before you close the tab.</b> Halved decay across an ' +
      'absence is worth more than almost anything else you could have sent them to do.</li>' +
    '</ol>');
  return S;
}

  // report's scrim covers the ? and its focus trap holds the keyboard, so this
  // arm is not reachable today -- but the invariant is what the assertion
  // checks, and half an invariant is the thing that rots.
  if (helpOpen || reportOpen) return;
  helpOpen = true;
  const scrim = el("div", "scrim");
  scrim.setAttribute("role", "dialog");
  scrim.setAttribute("aria-modal", "true");
  scrim.setAttribute("aria-label", "How to play");
  scrim.innerHTML = '<div class="modal"><header><h2>How to play</h2>' +
    '<div class="tiny dim">Everything a new lord needs, and nothing you have to ' +
    'memorise — the numbers below are read live out of the running game.</div>' +
    '</header><div class="mbody help">' +
    helpSections().map(s => '<section><h3>' + s.title + '</h3>' + s.html + '</section>').join("") +
    '</div><div class="mfoot"><button class="btn pri" id="hclose">Understood</button></div></div>';
  document.body.appendChild(scrim);

  // On the auto-open at boot nothing is focused yet, and handing focus back to
  // <body> drops a keyboard player at the top of the document with no cue. Fall
  // back to the ? itself, which is both where the dialog came from and how to
  // get it back.
  const from = document.activeElement;
  const returnFocus = (from && from !== document.body) ? from : $("#help");
  const close = () => {
    helpOpen = false;
    scrim.remove();
    // Seen once, never forced again -- but the ? in the header is always there.
    if (state && !state.seenHelp){ state.seenHelp = true; saveNow(); }
    if (returnFocus && returnFocus.focus) { try { returnFocus.focus(); } catch (e) {} }
    // Anything the tick queued while this was up was deliberately held back
    // rather than stacked on top. Show it now, the same way the report chains
    // into a second report.
    showReport();
  };
  scrim.querySelector("#hclose").onclick = close;
  scrim.querySelector("#hclose").focus();
  trapFocus(scrim, close);
}

/* ------------------------------------------------------- report modal ---- */
let reportOpen = false;
function showReport(){
  // One modal at a time. The tick keeps running behind an open dialog by
  // design, so a quest finishing (or a raid lapsing) while the player is
  // reading the tutorial used to append a SECOND aria-modal scrim on top of the
  // first, leaving the help dialog live underneath with its own key handler.
  // Deferring is safe precisely because of the Phase 6 fix: the queue is
  // consumed on OPEN, never cleared on close, so anything that arrives while
  // this is postponed simply accumulates. showHelp()'s close chains back here.
  if (reportOpen || helpOpen) return;
  const abs = state.pendingAbsence;
  if (!state.pendingReports.length && !abs && !(state.pendingIgnored || []).length) return;
  reportOpen = true;

  // CONSUME the queue on open rather than clearing it on close. The tick keeps
  // running while the modal is up, so quests finish and absences accrue behind
  // it -- and close() used to wipe `pendingReports` and `pendingAbsence`
  // wholesale, deleting entries the player had never been shown. Taking
  // ownership here also detaches the absence object, so the figures on screen
  // cannot go stale while advance() mutates a record this modal is rendering.
  const reports = state.pendingReports.slice().sort((a, b) => a.at - b.at);
  state.pendingReports = [];
  state.pendingAbsence = null;

  const scrim = el("div", "scrim");
  scrim.setAttribute("role", "dialog");
  scrim.setAttribute("aria-modal", "true");
  scrim.setAttribute("aria-label", "While you were away");
  const away = abs ? fmtDurLong(abs.elapsedMs) : null;
  let h = '<div class="modal"><header><h2>While you were away</h2>' +
    '<div class="tiny dim">' +
      (away ? "The Keep managed " + away + " without you" : "Just now") +
      (reports.length ? " · " + reports.length + " " +
        (reports.length === 1 ? "report" : "reports") : "") +
    '</div></header><div class="mbody">';

  // The realm's own story first: what changed while nobody was deciding anything.
  if (abs){
    const rows = state.zones.map(z => {
      const s = abs.zones[z.id];
      if (!s) return null;
      const zd = zoneDef(z.id);
      const dropped = s.tierAfter < s.tierBefore;
      const bits = [];
      if (s.lost > 0.05) bits.push('<span class="bad">−' + round1(s.lost) + ' standing</span>');
      if (s.rivalGained > 0.05) bits.push('<span class="warn">' + zd.rivalName +
        ' +' + round1(s.rivalGained) + '</span>');
      if (s.patrolled) bits.push('<span class="good">patrolled</span>');
      if (!bits.length) bits.push('<span class="dim">held</span>');
      return '<div class="absrow' + (dropped ? " dropped" : "") + '">' +
        '<span class="zn">' + zd.name + '</span>' +
        '<span class="tier t' + s.tierAfter + '">' + CONFIG.TIERS[s.tierAfter].name + '</span>' +
        (dropped ? '<span class="fell">fell from ' + CONFIG.TIERS[s.tierBefore].name + '</span>' : '') +
        (s.lockedNow ? '<span class="fell">' + zd.rivalName + ' hold it now</span>' : '') +
        '<span class="bits">' + bits.join(" · ") + '</span></div>';
    }).filter(Boolean).join("");

    h += '<div class="absence"><div class="eh">The realm</div>' + rows;
    if (abs.healed.length)
      h += '<div class="tiny good" style="margin-top:7px">' +
        nameList(abs.healed) + (abs.healed.length > 1 ? " are" : " is") +
        ' back on their feet.</div>';
    if ((abs.levelled || []).length)
      h += '<div class="tiny" style="margin-top:5px;color:var(--azure)">' +
        icon("sym-sword", 11, "var(--azure)") + ' ' + abs.levelled.join(", ") +
        '. The Training Yard has been earning its keep.</div>';
    h += '</div>';
  }

  // A raid nobody answered. This has to be stated plainly -- it is the one thing
  // in the report that cost the player something without any party being sent.
  const ignored = state.pendingIgnored || [];
  if (ignored.length){
    h += '<div class="absence raidband"><div class="eh">Unanswered</div>';
    ignored.forEach(g => {
      h += '<div class="absrow"><span class="zn">' + g.zoneName + '</span>' +
        '<span class="tiny">The raid was not answered.</span>' +
        '<span class="bits bad">−' + g.gold + ' gold · −' + g.material + ' ' +
          CONFIG.MATERIALS[g.materialId].name.toLowerCase() + '</span></div>';
    });
    h += '</div>';
  }
  state.pendingIgnored = [];

  // "What came back" heads a list of returning parties. A victory is not that.
  if (reports.some(r => !r.victory)) h += '<div class="eh logh">What came back</div>';

  reports.forEach(r => {
    if (r.victory){
      h += '<div class="entry victory"><div class="eh">The realm remembers</div>' +
        '<div class="en">Highcrown Sends Word</div>' +
        '<p>Four zones answer to your banner at the same time, which nobody has ' +
        'managed here in living memory. A rider came up the south road with a ' +
        'sealed writ and would not say what was in it.</p>' +
        '<p>It was done by ' + nameList(r.heroNames) + ', who are owed a great deal ' +
        'and will not be getting it.</p>' +
        '<p class="dim">Highcrown itself, and what it wants, is the next thing. ' +
        'The Keep stands either way — keep playing.</p></div>';
      return;
    }
    h += '<div class="entry' + (r.success || r.partial ? "" : " fail") + '">' +
      '<div class="eh">' + r.zoneName +
        (r.success ? "" : r.partial ? " · turned back" : " · failed") + '</div>' +
      '<div class="en">' + r.questName + '</div>' +
      '<p>' + narrate(r) + '</p><div class="tally">';
    if (r.influence)  h += '<span class="' + (r.influence > 0 ? "good" : "bad") + '">' +
      (r.influence > 0 ? "+" : "") + r.influence + ' banner</span>';
    if (r.gold)       h += '<span>' + icon("sym-gold", 11, "var(--gold)") + ' +' + r.gold + '</span>';
    if (r.material)   h += '<span>' + icon(CONFIG.MATERIALS[r.materialId].sym, 11,
      CONFIG.MATERIALS[r.materialId].color) + ' +' + r.material + ' ' +
      CONFIG.MATERIALS[r.materialId].name + '</span>';
    if (r.charters)   h += '<span class="good">' + icon("sym-charter", 11, "var(--ink)") +
      ' +' + r.charters + ' Charter' + (r.charters > 1 ? "s" : "") + '</span>';
    if (r.rivalPushed) h += '<span class="good">−' + r.rivalPushed + ' rival</span>';
    if (r.gear)       h += '<span class="gear-tally">' + icon("sym-sword", 11, "var(--azure)") +
      ' ' + r.gear.name + '</span>';
    if (r.gearLost)   h += '<span class="warn">' + r.gearLost + ' left behind — the shelf is full</span>';
    if (r.reclaimed)  h += '<span class="good">the hold is broken</span>';
    if (r.xp)         h += '<span class="xp-tally">+' + r.xp + ' XP' +
      (r.xpTo && r.xpTo < r.heroNames.length ? ' to ' + r.xpTo : ' each') + '</span>';
    (r.marks || []).forEach(m => { h += '<span class="mark-tally">' + m.mark + '</span>'; });
    h += '</div>';
    // A level is the one thing in this tally the player might act on, so it gets
    // its own line rather than a chip lost among the coin.
    if ((r.levelled || []).length)
      h += '<div class="levelup">' + icon("sym-sword", 11, "var(--t4)") + ' ' +
        nameList(r.levelled.map(s => s.replace(" to ", " reached level "))) + '.' +
        (r.branchReady ? ' <b>A branch is waiting on the roster.</b>' : '') + '</div>';
    h += '</div>';
  });
  h += '</div><div class="mfoot"><button class="btn pri" id="rclose">Very well</button></div></div>';
  scrim.innerHTML = h;
  document.body.appendChild(scrim);
  const returnFocus = document.activeElement;
  const close = () => {
    reportOpen = false;
    scrim.remove();
    saveNow();
    render();
    if (returnFocus && returnFocus.focus) { try { returnFocus.focus(); } catch (e) {} }
    // Anything that arrived while this was open is still queued: show it now
    // rather than leaving the player to discover it on the next tick.
    showReport();
  };
  scrim.querySelector("#rclose").onclick = close;
  scrim.querySelector("#rclose").focus();
  trapFocus(scrim, close);
}

/* ====================================================== THE RETURN REPORT ==
   DESIGN.md §11: a narrative log, not a stat dump. "With named heroes and Marks
   this is the emotional payload of the entire game... the screen worth polishing
   most." Fragments are authored in NARRATION and assembled here.
   ========================================================================= */
function nameList(names){
  if (!names || !names.length) return "The company";
  if (names.length === 1) return names[0];
  if (names.length === 2) return names[0] + " and " + names[1];
  return names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
}
function timeOfDay(ms){
  const h = new Date(ms).getHours();
  return h < 6 ? "night" : h < 11 ? "dawn" : h < 17 ? "day" : h < 21 ? "dusk" : "night";
}
/* Deterministic pick: the same entry must read identically every time the modal
   re-renders, so the choice is hashed from the entry rather than rolled. */
function fragment(list, seedStr, used){
  if (!list || !list.length) return "";
  let h = 2166136261;
  const s = String(seedStr);
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
  let idx = h % list.length;
  // Within one entry, two heroes hurt the same way must not get the same
  // sentence -- a 1-in-5 hash collision otherwise reads as a copy-paste bug.
  if (used){
    for (let n = 0; n < list.length && used.has(list[idx]); n++)
      idx = (idx + 1) % list.length;
    used.add(list[idx]);
  }
  return list[idx];
}
function fillTokens(line, vals){
  return String(line || "").replace(/\{(\w+)\}/g, (m, k) =>
    vals[k] !== undefined ? vals[k] : m);
}

function narrate(r){
  const who = nameList(r.heroNames);
  const vals = { who: who, zone: r.zoneName, quarry: r.quarry || "it" };
  const seed = r.questName + "|" + r.zoneId + "|" + r.at;
  const type = r.type || "clear";
  const parts = [];

  parts.push(fillTokens(fragment(NARRATION.returns[timeOfDay(r.at)], seed + "|r"), vals));

  const bucket = r.partial ? NARRATION.partial
               : (r.success ? NARRATION.success : NARRATION.failure)[type]
                 || (r.success ? NARRATION.success : NARRATION.failure).clear;
  parts.push(fillTokens(fragment(bucket, seed + "|o"), vals));

  const used = new Set();
  (r.injuries || []).forEach((i, n) => {
    const sev = String(i.severity || "Light").toLowerCase();
    const list = NARRATION.injury[sev] || NARRATION.injury.light;
    const line = fillTokens(fragment(list, seed + "|i" + n, used), { hero: i.name });
    parts.push(i.worsened
      ? line.replace(/\.$/, "") + ", and it was already bad before they left."
      : line);
  });
  (r.marks || []).forEach((m, n) => {
    parts.push(fillTokens(fragment(NARRATION.marks, seed + "|m" + n, used), { hero: m.name }));
  });

  return parts.filter(Boolean).join(" ");
}

/* ------------------------------------------------------------ render ---- */
function render(){
  if (!state) return;
  renderHeader();
  if (currentView === "map") renderMap();
  else if (currentView === "roster") renderRoster();
  else renderKeep();
}

/* Timers update in place so an open deploy drawer never loses its selection. */
function updateTimers(){
  const t = nowMs();
  document.querySelectorAll("[data-until]").forEach(n => {
    n.textContent = fmtDur(Number(n.dataset.until) - t);
  });
  document.querySelectorAll("[data-prog]").forEach(n => {
    const [a, b] = n.dataset.prog.split(",").map(Number);
    // Same Math.max(1) the initial render uses. A zero-length span makes this
    // NaN, and clamp() passes NaN through (neither comparison is true), so the
    // bar would be set to the invalid width "NaN%" -- which the browser ignores
    // silently, freezing the bar rather than throwing. No current CONFIG can
    // produce a zero-length quest; CONFIG on this project is retuned constantly.
    n.style.width = clamp(0, 100, ((t - a) / Math.max(1, b - a)) * 100) + "%";
  });
}

/* ============================================================== TICK ====== */
function tick(){
  const t = nowMs();
  const resolved = advance(t);
  save();
  // pendingIgnored belongs here too: a raid can lapse on a tick where nothing
  // else resolves, and the cost was already charged. Without this the player's
  // gold and materials vanish silently until some later quest happens to finish.
  if (resolved || state.pendingReports.length || (state.pendingIgnored || []).length){
    render(); showReport();
  }
  else if (currentView === "map" && !openZone) render();
  else updateTimers();
}

/* ============================================================== BOOT ====== */
function boot(){
  const loaded = load();
  if (loaded){
    state = loaded;
    // Backfill anything a partial save is missing rather than throwing.
    state.pendingReports = state.pendingReports || [];
    state.activeQuests   = state.activeQuests   || [];
    state.questSeq       = state.questSeq       || 1;
    heroSeq = state.heroes.reduce((m, h) => Math.max(m, Number(String(h.id).slice(1)) || 0), 0) + 1;
    advance(nowMs());
  } else {
    state = newGame();
  }
  saveNow();

  $("#nav-map").onclick    = () => setView("map");
  $("#nav-roster").onclick = () => setView("roster");
  $("#nav-keep").onclick   = () => setView("keep");
  $("#help").onclick       = showHelp;

  addEventListener("pagehide", saveNow);
  addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); });

  render();
  showReport();
  // The tutorial yields to the report: a returning player wants to know what
  // happened, and two stacked dialogs is how you teach someone to dismiss both
  // without reading either.
  if (!state.seenHelp && !reportOpen) showHelp();
  setInterval(tick, CONFIG.TICK_MS);
  if (!storageOK) toast("Saving to memory only — storage unavailable.");

  // Run the suite on every boot. Left to be typed into a console by hand it
  // catches nothing in normal play, which makes it documentation rather than a
  // safety net. It is cheap, it never throws (chk traps), and it must never
  // block the game -- so it only reports.
  try {
    const r = assertAll();
    if (!r.pass){
      console.error("Banner & Keep — " + r.fails.length + " of " + r.count +
                    " assertions FAILED on boot:");
      r.fails.forEach(f => console.error("  · " + f));
      toast(r.fails.length + " assertion" + (r.fails.length > 1 ? "s" : "") +
            " failed — see console");
    } else {
      console.info("Banner & Keep — " + r.count + " assertions passed. " +
                   "BK.falsify() checks that they can still fail.");
    }
  } catch (e){ console.error("assertion suite threw on boot:", e); }
}

/* ========================================================= ASSERTIONS =====
   The whole safety net. Falsify every new check before trusting it: break the
   thing it names, confirm it fails, restore. See CLAUDE.md.
   ========================================================================= */
/* CONFIG-SCAN-EXCLUDE-START */
function pageSource(){ return document.documentElement.outerHTML; }
function scannableSource(){
  const src = pageSource();
  const a = src.indexOf("CONFIG-SCAN-EXCLUDE-START");
  const b = src.lastIndexOf("CONFIG-SCAN-EXCLUDE-END");
  return (a < 0 || b < 0) ? src : src.slice(0, a) + src.slice(b);
}

function assertAll(){
  const fails = [];
  let ran = 0;
  const names = [];
  const stateAtStart = state;
  const stateJsonAtStart = JSON.stringify(state);
  const savedAtStart = storageGet();
  const chk = (name, fn) => {
    ran++; names.push(name);
    try { const r = fn(); if (r !== true) fails.push(name + ": " + r); }
    catch (e) { fails.push(name + " THREW: " + e.message); }   // report, never halt
  };

  // --- the class check: no dead CONFIG keys -----------------------------
  chk("no dead CONFIG keys", () => {
    const src = scannableSource();
    const dead = Object.keys(CONFIG).filter(k => !src.includes("CONFIG." + k));
    return dead.length === 0 ? true : "unread: " + dead.join(", ");
  });

  chk("no CONFIG key is read that does not exist", () => {
    // The mirror of the check above, and the one that actually bites: deleting a
    // constant leaves every `CONFIG.OLD_NAME` reading undefined, which quietly
    // turns arithmetic into NaN rather than throwing. The dead-key scan cannot
    // see this because there is no key left to be dead.
    const src = scannableSource();
    const referenced = new Set();
    (src.match(/CONFIG\.[A-Za-z_][A-Za-z0-9_]*/g) || [])
      .forEach(m => referenced.add(m.slice(7)));
    const missing = [...referenced].filter(k => !(k in CONFIG));
    return missing.length === 0 ? true : "undefined: " + missing.join(", ");
  });

  // --- the class check: no dead sprite references -----------------------
  chk("every <use href> resolves", () => {
    // Scan the real elements, not the page text. A source regex also matched the
    // literal inside a nearby COMMENT and reported a symbol named "id" as broken,
    // and a narrower regex had silently skipped any id containing a digit.
    const defined = new Set([...document.querySelectorAll("symbol[id]")].map(s => s.id));
    const missing = new Set();
    document.querySelectorAll("use").forEach(u => {
      const href = u.getAttribute("href") || u.getAttribute("xlink:href") || "";
      if (href.charAt(0) !== "#") return;
      const id = href.slice(1);
      if (!defined.has(id)) missing.add(id);
    });
    // Also catch icons built at runtime, which have no <use> until they render.
    (scannableSource().match(/icon\("([A-Za-z0-9_-]+)"/g) || []).forEach(m => {
      const id = m.slice(6, -1);
      if (!defined.has(id)) missing.add(id);
    });
    return missing.size === 0 ? true : "undefined symbols: " + [...missing].join(", ");
  });
  chk("no unused sprite symbols", () => {
    // Most icons are built at runtime by icon(), so a symbol can be live without
    // any literal href="#id" in the DOM. Count every quoted mention of the id and
    // subtract its own definition -- anything left is a real reference.
    const src = pageSource();
    const count = (hay, needle) => hay.split(needle).length - 1;
    const unused = [...document.querySelectorAll("symbol[id]")].map(s => s.id)
      .filter(id => count(src, id + '"') - count(src, 'id="' + id + '"') <= 0);
    return unused.length === 0 ? true : "never referenced: " + unused.join(", ");
  });

  // --- tier table -------------------------------------------------------
  chk("tiers cover 0..100 in order", () => {
    if (CONFIG.TIERS[0].min !== 0) return "first tier does not start at 0";
    for (let i = 1; i < TIER_COUNT; i++)
      if (CONFIG.TIERS[i].min <= CONFIG.TIERS[i - 1].min) return "tier " + i + " min out of order";
    for (let v = 0; v <= CONFIG.INFLUENCE_MAX; v++)
      if (!CONFIG.TIERS[tierIndexFor(v)]) return "no tier at influence " + v;
    return true;
  });
  chk("decay rises with tier", () => {
    for (let i = 1; i < TIER_COUNT; i++)
      if (CONFIG.TIERS[i].decayPerHour < CONFIG.TIERS[i - 1].decayPerHour)
        return "tier " + i + " decays slower than " + (i - 1);
    return true;
  });

  // --- zones ------------------------------------------------------------
  chk("zones well formed", () => {
    const ids = CONFIG.ZONES.map(z => z.id), mats = CONFIG.ZONES.map(z => z.material);
    if (new Set(ids).size !== ids.length) return "duplicate zone id";
    if (new Set(mats).size !== mats.length) return "two zones share a material";
    for (const z of CONFIG.ZONES){
      if (!CONFIG.MATERIALS[z.material]) return z.id + " has no material def";
      if (!CLEAR_QUESTS[z.id]) return z.id + " has no Clear quest pool";
      if (CLEAR_QUESTS[z.id].length < 6) return z.id + " quest pool too small";
    }
    return true;
  });
  chk("quest pools are complete and well formed", () => {
    // The content contract, enforced permanently rather than by a one-off script
    // outside the game. Two subagents wrote 120 of these entries; this is what
    // makes their output verifiable on every boot instead of only on the day.
    const names = [], flavors = [];
    for (const typeId of Object.keys(CONFIG.QUEST_TYPES)){
      const pools = QUEST_POOLS[typeId];
      if (!pools) return "no pool table for type " + typeId;
      for (const z of CONFIG.ZONES){
        const list = pools[z.id];
        if (!Array.isArray(list) || list.length < 5)
          return typeId + "/" + z.id + " has " + ((list && list.length) || 0) + " entries, want 5+";
        for (const q of list){
          const tag = typeId + "/" + z.id + "/" + String(q.name).slice(0, 20);
          if (!q.name || q.name.length < 3 || q.name.length > 38)
            return tag + ": name length " + (q.name || "").length;
          if (!q.flavor || q.flavor.length < 40 || q.flavor.length > 130)
            return tag + ": flavor length " + (q.flavor || "").length;
          if (q.flavor.slice(-1) !== ".") return tag + ": flavor does not end in a period";
          if (/[!?;]/.test(q.flavor)) return tag + ": forbidden punctuation";
          if (/\b(you|your)\b/i.test(q.flavor)) return tag + ": second person";
          if (/[^\x20-\x7E]/.test(q.name + q.flavor)) return tag + ": non-ASCII character";
          if (CONFIG.QUEST_TYPES[typeId].counter && !q.quarry)
            return tag + ": a Hunt with no quarry";
          names.push(q.name); flavors.push(q.flavor);
        }
      }
    }
    if (new Set(names).size !== names.length){
      const seen = new Set(), dup = names.filter(n => seen.has(n) || (seen.add(n), false));
      return "duplicate quest name across all pools: " + dup[0];
    }
    if (new Set(flavors).size !== flavors.length) return "duplicate flavor line across all pools";
    return true;
  });

  chk("every quest type is reachable and sane", () => {
    for (const id of Object.keys(CONFIG.QUEST_TYPES)){
      const t = CONFIG.QUEST_TYPES[id];
      if (!DERIVED[t.stat]) return id + " tests unknown stat '" + t.stat + "'";
      if (t.min < 1 || t.max < t.min) return id + " has a nonsense party range";
      if (!t.lengths.every(l => CONFIG.DURATION_MS[l])) return id + " has an unknown length";
      if (!(t.perHero > 0)) return id + " has no per-hero difficulty";
      if (!t.blurb) return id + " has no blurb";
      if (t.minTier >= TIER_COUNT) return id + " is gated above the highest tier";
    }
    // Every type must actually be offered somewhere: a type gated above any
    // reachable tier is content nobody will ever see.
    const reachable = new Set();
    CONFIG.TIERS.forEach((tier, i) =>
      Object.keys(CONFIG.QUEST_TYPES).forEach(id => {
        if (i >= CONFIG.QUEST_TYPES[id].minTier) reachable.add(id);
      }));
    const unreachable = Object.keys(CONFIG.QUEST_TYPES).filter(id => !reachable.has(id));
    if (unreachable.length) return "never offered at any tier: " + unreachable.join(", ");
    // And an Unknown zone must still have something to offer on day one.
    const day1 = Object.keys(CONFIG.QUEST_TYPES).filter(id => CONFIG.QUEST_TYPES[id].minTier === 0);
    return day1.length >= 3 ? true : "only " + day1.length + " types available at Unknown";
  });

  chk("difficulty scales with the party a type asks for", () => {
    // Difficulty is per required hero, which is what lets one success curve serve
    // a 1-hero Court and a 5-hero Warfront. If it stopped scaling, big quests
    // would become trivially easy and nothing else would look wrong.
    for (const id of Object.keys(CONFIG.QUEST_TYPES)){
      const t = CONFIG.QUEST_TYPES[id];
      const one = questDifficulty(id, 1, 1);
      const two = questDifficulty(id, 2, 1);
      if (Math.abs(two - one * 2) > 1e-9) return id + " difficulty is not linear in party size";
      const d1 = questDifficulty(id, t.min, 1), d4 = questDifficulty(id, t.min, 4);

    if (new Set(titles).size !== titles.length) return "two sections share a title";
    const empty = secs.filter(s => !s.html || s.html.length < 80).map(s => s.title);
    if (empty.length) return "thin section: " + empty[0];
    const txt = secs.map(s => s.title + " " + s.html).join(" ");
    const want = []
      .concat(CONFIG.TIERS.map(t => ["tier", t.name]))
      .concat(Object.keys(CONFIG.QUEST_TYPES).map(k => ["quest type", CONFIG.QUEST_TYPES[k].name]))
      .concat(Object.keys(CONFIG.MATERIALS).map(k => ["material", CONFIG.MATERIALS[k].name]))
      .concat(CONFIG.ZONES.map(z => ["zone", z.name]))
      .concat(Object.keys(CONFIG.BUILDINGS).map(k => ["building", CONFIG.BUILDINGS[k].name]))
      .concat(Object.keys(CONFIG.ZONE_EVENTS).map(k => ["event", CONFIG.ZONE_EVENTS[k].name]))
      .concat(CONFIG.INJURY_SEVERITIES.map(s => ["wound", s.name]))
      .concat(Object.keys(DERIVED).map(k => ["stat", DERIVED[k].name]))
      .concat([["attribute", "Might"], ["attribute", "Agility"], ["attribute", "Wits"],
               ["attribute", "Spirit"], ["attribute", "Presence"],
               ["currency", "Charter"], ["currency", "Gold"],
               ["mechanic", "Mark"], ["mechanic", "Consolidate"], ["mechanic", "fatigue"]]);
    const missing = want.filter(([, name]) => txt.indexOf(name) < 0);

  chk("the tutorial states the design's own numbers", () => {
    // Every figure in the tutorial is interpolated from CONFIG, which is what
    // stops it rotting -- but that only helps if it is really interpolated.
    // These are DESIGN.md's own literals, deliberately not read back out of
    // CONFIG: write CONFIG.X on both sides and the check moves with the bug.
    //
    // Each literal is ANCHORED to its own sentence and must appear EXACTLY
    // once. A bare "48 hours" looked fine and then quietly stopped testing
    // anything the day the events table gained "runs 24-48 hours" -- the probe
    // that moves the cap went from caught to missed without a word, because the
    // check was matching a completely unrelated line. A loose substring is not
    // an assertion, and a second occurrence is now a failure rather than a
    // silent upgrade to always-true.
    const txt = helpSections().map(s => s.html).join(" ");
    const need = [
      ["the 48-hour offline cap", "first <b>48 hours</b>"],
      ["the win condition's four zones", "four regions at Honored"],
      ["materials gated on Noticed", "below Noticed"],
      ["the Warfront tier gate", "Needs Honored standing"],
      ["the Delve tier gate", "Needs Noticed standing"],
      ["the rival lock threshold", "Rival 80+"],
      ["the incursion threshold", "Rival 60+"],
      ["worsening a wound on redeploy", "<b>30%</b> that the wound worsens"],
      ["the Mark chance", "<b>25%</b> chance of a permanent Mark"],
      ["resting recovery", "<b>8 an hour</b> resting"],
      ["three materials per upgrade", "<b>3 different regions</b>"],
      ["the branch level", "At level <b>10</b>"]
    ];
    const count = (hay, needle) => hay.split(needle).length - 1;
    const missing = [], duplicated = [];
    need.forEach(([label, lit]) => {
      const n = count(txt, lit);
      if (n === 0) missing.push(label);
      else if (n > 1) duplicated.push(label + " (x" + n + ")");
    });
    if (missing.length) return "no longer states " + missing.join("; ");
    return duplicated.length === 0 ? true
      : "matched in more than one place, so it no longer pins anything: " +
        duplicated.join("; ");
  });

  chk("finished work pays XP, and benching still out-teaches it", () => {
    const real = state, wasDisarmed = savesDisarmed;
    try {
      savesDisarmed = true;
      state = JSON.parse(JSON.stringify(real));
      const gentle = CONFIG.ZONES[0], harsh = CONFIG.ZONES[CONFIG.ZONES.length - 1];

      // Ordering: a clean finish beats a partial, which beats a rout, which is
      // still more than nothing. Nobody comes home having learned negative.
      const aq = { length:"long" };
      const win  = questXP(aq, gentle, true,  1);
      const part = questXP(aq, gentle, false, 2 / 3);
      const rout = questXP(aq, gentle, false, 0);
      if (!(win > part && part > rout && rout > 0))
        return "outcome order is wrong: win " + win + ", partial " + part + ", rout " + rout;

      // Longer work teaches more, and so does worse ground.
      if (!(questXP({ length:"long" }, gentle, true, 1) >
            questXP({ length:"medium" }, gentle, true, 1) &&
            questXP({ length:"medium" }, gentle, true, 1) >
            questXP({ length:"short" }, gentle, true, 1)))
        return "a longer quest does not teach more";
      if (!(questXP(aq, harsh, true, 1) > questXP(aq, gentle, true, 1)))
        return "the dangerous end of the map teaches no more than the gentle end";

      // §7's balance requirement, asserted as a RATE rather than a total: a
      // maxed Training Yard must out-teach ordinary work, or the bench stops
      // being a real choice and "deploy everyone always" wins the argument.
      const yard = CONFIG.BUILDINGS.trainingYard;
      const maxYard = yard.levels[yard.max].xpPerHour;
      const fieldRate = win / (CONFIG.DURATION_MS.long / 3600000);
      if (!(maxYard > fieldRate))
        return "a maxed Training Yard (" + maxYard + "/h) does not beat ordinary " +
               "field work (" + round1(fieldRate) + "/h), so benching stops paying";
      // ...but the worst ground in the realm should beat it, or danger buys
      // nothing but scars.
      if (!(questXP(aq, harsh, true, 1) / (CONFIG.DURATION_MS.long / 3600000) > maxYard))
        return "the most dangerous work in the game teaches no faster than resting";

      // And it must actually reach the hero through the real resolver.
      const zs = state.zones[0];
      const party = state.heroes.slice(0, 2);
      party.forEach(h => { h.status = "idle"; h.xp = 0; h.level = 1;
                           h.injury = { severity:null, healsAt:0 }; h.fatigue = 0; });
      const q = { id:"xpprobe", zoneId: zs.id, type:"clear", typeName:"Clear",
        stat:"power", name:"XP Probe", flavor:"f", length:"medium",
        durationMs: CONFIG.DURATION_MS.medium, required:2, stages:1,
        difficulty: questDifficulty("clear", 2, gentle.danger),
        gold:24, material:1, expiresAt: nowMs() + 1e6 };
      zs.slate.push(q);
      deploy(q, party);
      const rec = state.activeQuests.pop();
      state.pendingReports = [];
      withSeed(0xC0FFEE, () => resolveQuest(rec, nowMs()));
      if (!(party[0].xp > 0)) return "a hero finished a quest and earned no XP";
      const rep = state.pendingReports[state.pendingReports.length - 1];
      if (!rep || !(rep.xp > 0)) return "the report does not tell the player about the XP";
      if (rep.xp !== party[0].xp && !rep.levelled.length)
        return "the report says " + rep.xp + " XP but the hero banked " + party[0].xp;
      if (rep.xpTo !== party.length)
        return "the report credits " + rep.xpTo + " of " + party.length + " heroes";

      // A hero at the ceiling banks nothing. applyLevels() cannot spend it, so
      // without the guard a long save grows a number no screen will ever use --
      // and the report must not claim "each" when one of them earned nothing.
      const maxed = party[0];
      maxed.level = CONFIG.LEVEL_MAX; maxed.xp = 0; maxed.status = "idle";
      party[1].status = "idle";
      const q2 = Object.assign({}, q, { id:"xpprobe2" });
      zs.slate.push(q2);
      deploy(q2, [maxed, party[1]]);
      const rec2 = state.activeQuests.pop();
      withSeed(0xC0FFEE, () => resolveQuest(rec2, nowMs()));
      if (maxed.xp !== 0)
        return "a hero at level " + CONFIG.LEVEL_MAX + " banked " + maxed.xp +
               " XP that nothing can ever spend";
      const rep2 = state.pendingReports[state.pendingReports.length - 1];
      if (rep2.xpTo !== 1)
        return "the report credits " + rep2.xpTo + " heroes when only one could learn";
      return true;
    } finally { savesDisarmed = wasDisarmed; state = real; }
  });

  chk("a save written before gear existed loads clean", () => {
    // The half that rots is the PERSISTED copy. Every save in the wild predates
    // the Sanctum, the Forge and gear, and the gear field has sat in the schema
    // since Phase 0 with nothing reading it -- so it can hold anything.
    const old = JSON.parse(JSON.stringify(state));
    delete old.stash;
    old.keep = { greatHall:2, trainingYard:1, infirmary:0, warRoom:0 };  // no new buildings
    const anyWeapon = GEAR.weapon[1][0].id, anyTrinket = GEAR.trinket[1][0].id;
    old.heroes.forEach(h => { h.gear = { weapon:null, armor:null, trinket:null }; });
    old.heroes[0].gear = {
      weapon: { id:"no-such-item", tier:9 },        // an id this build dropped
      armor:  { id: anyWeapon, tier:2 },            // a weapon in the armour slot
      trinket: null,
      boots:  { id: anyTrinket, tier:1 }            // a slot this build does not have
    };
    old.stash = [{ id: anyTrinket, tier:"2" }, { id:"gone", tier:1 }, null, { id: anyWeapon }];
    for (let i = 0; i < CONFIG.GEAR_STASH_MAX + 20; i++) old.stash.push({ id: anyWeapon, tier:1 });

    const m = sanitizeLoaded(migrate(old));
    Object.keys(CONFIG.BUILDINGS).forEach(id => {
      if (typeof m.keep[id] !== "number") throw new Error("keep." + id + " missing after load");
    });
    const g = m.heroes[0].gear;
    if (g.weapon) return "an item this build no longer defines survived the load";
    if (g.armor) return "a weapon stayed equipped in the armour slot";
    if ("boots" in g) return "a slot this build does not have survived the load";
    if (Object.keys(g).length !== CONFIG.GEAR_SLOTS.length) return "the gear object has stray keys";
    if (m.stash.length !== CONFIG.GEAR_STASH_MAX)
      return "the stash loaded at " + m.stash.length + ", over the cap of " + CONFIG.GEAR_STASH_MAX;
    if (m.stash.some(it => !gearDef(it.id))) return "an unknown item survived in the stash";
    if (m.stash.some(it => typeof it.tier !== "number" || !isFinite(it.tier)))
      return "a stash item has a tier that is not a number";
    if (m.stash.some(it => it.tier < 1 || it.tier > CONFIG.GEAR_TIER_MAX))
      return "a stash item has a tier outside the range";
    // And the whole thing must still be a save the game can run.
    if (!Array.isArray(m.heroes) || !m.heroes.length) return "the roster did not survive";
    return true;
  });

  chk("the gear table is complete and every item does something", () => {
    const seenId = new Set(), seenName = new Set();
    for (const slot of CONFIG.GEAR_SLOTS){
      if (!GEAR[slot]) return "no gear at all for slot " + slot;
      for (let t = 1; t <= CONFIG.GEAR_TIER_MAX; t++){
        const list = GEAR[slot][t];
        if (!Array.isArray(list) || list.length < 3)
          return slot + " tier " + t + " has " + ((list && list.length) || 0) + " items, want 3+";
        // Every tier of every slot must actually change something, or a whole
        // rank of gear is decoration the player cannot tell apart.
        const eff = (CONFIG.GEAR_EFFECTS[slot] || [])[t];
        if (!eff || !Object.keys(eff).length) return slot + " tier " + t + " has no effect";
        for (const it of list){
          if (!it.id || !it.name || !it.flavor) return slot + "/" + t + " has an incomplete item";
          if (seenId.has(it.id)) return "two items share the id " + it.id;
          if (seenName.has(it.name)) return "two items share the name " + it.name;
          seenId.add(it.id); seenName.add(it.name);
          if (gearDef(it.id) !== it) return it.id + " is not indexed by registerGear";
          if (gearDef(it.id).slot !== slot) return it.id + " is indexed under the wrong slot";
        }
      }
      // Tiers must improve monotonically, or reforging can make an item worse.
      for (let t = 2; t <= CONFIG.GEAR_TIER_MAX; t++){
        const a = CONFIG.GEAR_EFFECTS[slot][t - 1], b = CONFIG.GEAR_EFFECTS[slot][t];
        if (a.statMult !== undefined && !(b.statMult > a.statMult))
          return slot + " tier " + t + " is no stronger than tier " + (t - 1);
        if (a.injuryMult !== undefined && !(b.injuryMult < a.injuryMult))
          return slot + " tier " + t + " protects no better than tier " + (t - 1);
        if (a.influenceBonus !== undefined && !(b.influenceBonus > a.influenceBonus))
          return slot + " tier " + t + " is worth no more than tier " + (t - 1);
      }
    }
    return true;
  });

  chk("the Sanctum lifts a Mark, takes payment, and refuses when it cannot", () => {
    const real = state;
    try {
      state = JSON.parse(JSON.stringify(real));
      const h = state.heroes[0];
      h.status = "idle";
      const markId = Object.keys(MARKS)[0];
      const zone = MARKS[markId].onlyZone || CONFIG.ZONES[0].id;
      const matId = zoneDef(zone).material;
      // The control is this hero WITHOUT the Mark, measured now -- not a
      // stripped stand-in. Comparing against a bare synthetic hero silently
      // folded in everything else they carry, so the check failed the moment
      // the roster had gear on it and blamed the Sanctum for the difference.
      h.marks = [];
      const unmarked = traitEffects(h, { zoneId: zone, danger:1 }).injuryMult;
      h.marks = [{ id: markId, zoneId: zone, atMs: 0 }];

      state.keep.sanctum = 0;
      if (canLiftMark(h, markId).ok) return "a Mark was liftable with no Sanctum";
      if (liftMark(h, markId)) return "a Mark was lifted with no Sanctum";

      state.keep.sanctum = 1;
      const cost = sanctumLiftCost();
      // The design's literal, not a value read back out of the same constant
      // the probe moves: lifting a Mark COSTS SOMETHING. Without this the whole
      // affordability half below is a tautology -- zero the price and both the
      // check's expectation and the code's requirement fall to zero together,
      // which is precisely how a free-lift probe sailed through.
      if (!(cost.gold > 0 && cost.material > 0))
        return "the Sanctum lifts Marks for nothing";
      state.gold = cost.gold - 1;
      state.materials[matId] = cost.material + 5;
      if (canLiftMark(h, markId).ok) return "a Mark was liftable without the gold";
      state.gold = cost.gold + 10;
      state.materials[matId] = cost.material - 1;
      if (canLiftMark(h, markId).ok) return "a Mark was liftable without the material";

      state.materials[matId] = cost.material + 5;
      h.status = "deployed";
      if (canLiftMark(h, markId).ok) return "a Mark was lifted off a hero in the field";
      h.status = "idle";

      const goldBefore = state.gold, matBefore = state.materials[matId];
      if (!liftMark(h, markId)) return "a Mark was refused with the Sanctum and the price paid";
      if (h.marks.some(m => m.id === markId)) return "the Mark is still there";
      if (state.gold !== goldBefore - cost.gold) return "the gold was not taken";
      if (state.materials[matId] !== matBefore - cost.material) return "the material was not taken";
      // §7: the effect must be gone, not merely the chip.
      if (traitEffects(h, { zoneId: zone, danger:1 }).injuryMult !== unmarked)
        return "the Mark's effect survived the lift";

      // And the other half: consecrated ground makes fewer Marks take hold.
      const lvls = CONFIG.BUILDINGS.sanctum.levels;
      if (!(lvls[CONFIG.BUILDINGS.sanctum.max].markChanceMult < 1))
        return "a maxed Sanctum does not reduce the Mark chance at all";
      for (let i = 2; i <= CONFIG.BUILDINGS.sanctum.max; i++)
        if (lvls[i].markChanceMult > lvls[i - 1].markChanceMult)
          return "Sanctum level " + i + " protects worse than the level below it";
      return true;
    } finally { state = real; }
  });

      if (h.level !== 2) return "level is " + h.level + " after one level-up";

      const grown = Object.keys(h.attrs).filter(k => h.attrs[k] !== base[k]);
      if (grown.length !== 1) return grown.length + " attributes moved on one level";
      // A class must grow into itself. Reading the expected attribute out of the

      const defining = { Warrior:"might", Ranger:"agility", Mage:"wits", Priest:"spirit" };

      if (h.attrs[grown[0]] !== base[grown[0]] + 1) return "an attribute moved by more than one";

  chk("narration is complete and well formed", () => {
    // The content contract for the 116 authored fragments, enforced on every boot
    // rather than once on the day they arrived.
    const seen = new Set();
    const check = (list, path, allowed) => {
      if (!Array.isArray(list) || list.length < 4)
        return path + " has " + ((list && list.length) || 0) + " fragments, want 4+";
      for (const f of list){
        const tag = path + "/" + String(f).slice(0, 24);
        if (typeof f !== "string" || f.length < 30 || f.length > 130)
          return tag + ": length " + (f || "").length;
        if (f.slice(-1) !== ".") return tag + ": does not end in a period";
        if (/[!?;]/.test(f)) return tag + ": forbidden punctuation";
        if (/[^\x20-\x7E]/.test(f)) return tag + ": non-ASCII character";
        if (/\d/.test(f)) return tag + ": contains a digit";
        if (/\b(you|your)\b/i.test(f)) return tag + ": second person";
        if (/[.!?]\s/.test(f)) return tag + ": more than one sentence";
        const toks = (f.match(/\{(\w+)\}/g) || []).map(x => x.slice(1, -1));
        for (const tk of toks)
          if (allowed.indexOf(tk) < 0) return tag + ": token {" + tk + "} not allowed here";
        if (seen.has(f)) return tag + ": duplicated fragment";
        seen.add(f);
      }
      return true;
    };
    for (const slot of ["dawn", "day", "dusk", "night"]){
      const r = check(NARRATION.returns[slot], "returns." + slot, ["who", "zone"]);
      if (r !== true) return r;
      // A return line has to say who came back and from where.
      for (const f of NARRATION.returns[slot]){
        if (f.indexOf("{who}") < 0) return "returns." + slot + " has a line with no {who}";
        if (f.indexOf("{zone}") < 0) return "returns." + slot + " has a line with no {zone}";
      }
    }
    for (const outcome of ["success", "failure"]){
      for (const type of Object.keys(CONFIG.QUEST_TYPES)){
        const list = NARRATION[outcome][type];
        if (!list) return outcome + " has no lines for quest type " + type;
        const r = check(list, outcome + "." + type, type === "hunt" ? ["quarry"] : []);
        if (r !== true) return r;
      }
    }
    let r = check(NARRATION.partial, "partial", []);
    if (r !== true) return r;
    for (const sev of CONFIG.INJURY_SEVERITIES){
      r = check(NARRATION.injury[sev.id], "injury." + sev.id, ["hero"]);
      if (r !== true) return r;
      for (const f of NARRATION.injury[sev.id])
        if (f.indexOf("{hero}") < 0) return "injury." + sev.id + " has a line with no {hero}";
    }
    r = check(NARRATION.marks, "marks", ["hero"]);
    if (r !== true) return r;
    for (const f of NARRATION.marks)
      if (f.indexOf("{hero}") < 0) return "marks has a line with no {hero}";
    return true;
  });

            typeName: type, type: type, quarry:"The Probe",
            success: success, partial:false, heroNames: names,

      cleared:1, stages:3, heroNames: names, injuries: [], marks: [] }));

      if (!s || s.length < 40) return "an assembled entry came out empty or stunted: '" + s + "'";
      if (/\{\w+\}/.test(s)) return "an unresolved token survived assembly: " + s.match(/\{\w+\}/)[0];
      if (s.indexOf("  ") >= 0) return "a double space in an assembled entry";
      if (s.indexOf("undefined") >= 0) return "'undefined' reached an assembled entry";
    }
    // Exhaustive sweep: the assembly above only exercises whichever fragments the
    // hash happens to land on, so a bad token in an unpicked line would sail
    // through. Every fragment gets filled and inspected.
    const vals = { who:"A and B", zone:"Greenhollow", hero:"A", quarry:"The Probe" };
    const sweep = (list, path) => {
      for (const f of (list || [])){
        const filled = fillTokens(f, vals);
        if (/\{\w+\}/.test(filled))
          return path + " leaves " + filled.match(/\{\w+\}/)[0] + " unresolved";
      }
      return true;
    };
    const buckets = [[NARRATION.partial, "partial"], [NARRATION.marks, "marks"]];
    Object.keys(NARRATION.returns).forEach(k => buckets.push([NARRATION.returns[k], "returns." + k]));
    Object.keys(NARRATION.injury).forEach(k => buckets.push([NARRATION.injury[k], "injury." + k]));
    ["success", "failure"].forEach(o =>
      Object.keys(NARRATION[o]).forEach(k => buckets.push([NARRATION[o][k], o + "." + k])));
    for (const [list, path] of buckets){
      const r = sweep(list, path);
      if (r !== true) return r;

    const once = narrate({ at: 1700000000000, zoneId:"greenhollow", zoneName:"Greenhollow",
      questName:"Stable", typeName:"clear", type:"clear", success:true, partial:false,
      heroNames: names, injuries: [], marks: [] });
    const twice = narrate({ at: 1700000000000, zoneId:"greenhollow", zoneName:"Greenhollow",
      questName:"Stable", typeName:"clear", type:"clear", success:true, partial:false,
      heroNames: names, injuries: [], marks: [] });

        const s = a.zones[z.id];
        if (!s) return z.id + " is missing from the summary";
        if (!(s.lost > 0)) return z.id + " recorded no decay across 30 hours at Honored";
        if (!(s.rivalGained > 0)) return z.id + " recorded no rival gain";
        if (s.tierAfter > s.tierBefore) return z.id + " gained a tier while decaying";
      }
      // A short tick must NOT be treated as an absence.
      state.pendingAbsence = null;
      state.lastTick = nowMs();
      advance(nowMs() + 1000);
      return state.pendingAbsence === null
        ? true : "a one-second tick was recorded as an absence";
    } finally { state = real; }
  });

    const mats = Object.keys(CONFIG.MATERIALS);

  chk("a quest finishing mid-window splits field time from rest time", () => {
    // Both benching checks set activeQuests = [] first, which is exactly the case
    // that used to break: resolveQuest flips the hero to idle in step 1, so step 5
    // saw "idle" and credited the WHOLE window as rest -- full fatigue recovery
    // and an un-paused wound for hours actually spent in the field.
    const real = state;
    const worsen = CONFIG.INJURY_WORSEN_CHANCE;
    try {
      // Isolate the timing mechanism: worsening would replace the wound at
      // completesAt and change which clock we are measuring.
      CONFIG.INJURY_WORSEN_CHANCE = 0;
      state = JSON.parse(JSON.stringify(real));
      const t0 = nowMs();
      const hero = state.heroes[0];
      const other = state.heroes[1];
      // Deliberately far longer than any severity: a strong Infirmary would
      // finish an 8h wound inside the window and the timing being measured would
      // vanish. The severity label is irrelevant here; only the clock is.
      const healMs = 100 * 3600000;

      // Hero A: deployed, quest ends 6h into a 10h window -> 6h field, 4h rest.
      // Hero B: never deployed at all -> 10h rest. B is the control.
      [hero, other].forEach(h => {
        h.fatigue = 100;
        h.injury = { severity:"serious", healsAt: t0 + healMs };
        h.status = "idle"; h.deployedTo = null;
      });
      hero.status = "deployed"; hero.deployedTo = state.zones[0].id;
      state.activeQuests = [{ questId:"probe", zoneId: state.zones[0].id, type:"clear",
        typeName:"Clear", stat:"power", stages:1, name:"Probe", length:"short",
        heroIds:[hero.id], ratio:5, chance:1, startedAt: t0, completesAt: t0 + 6 * 3600000,
        gold:0, material:0, influence:0, locked:false, staffCount:1, required:1 }];
      state.pendingReports = [];
      state.lastTick = t0;
      advance(t0 + 10 * 3600000);

      // Derive the expectation from LIVE state, not from the base constants: the
      // Infirmary changes both rates, so hardcoding them made this check pass on
      // a fresh save and fail the moment a player built one.
      const infE = keepEffect("infirmary");
      const restRate = CONFIG.FATIGUE_REST_PER_HOUR * infE.restRate;
      const wantA = clamp(0, CONFIG.FATIGUE_MAX, 100 - restRate * 4 * traitEffects(hero).restMult);
      const wantB = clamp(0, CONFIG.FATIGUE_MAX, 100 - restRate * 10 * traitEffects(other).restMult);
      if (Math.abs(hero.fatigue - wantA) > 0.5)
        return "a hero in the field 6 of 10 hours rested to " + round1(hero.fatigue) +
               ", expected " + round1(wantA) + " (only 4 hours of rest earned)";
      if (Math.abs(other.fatigue - wantB) > 0.5)
        return "the control hero rested to " + round1(other.fatigue) + ", expected " + round1(wantB);
      if (!(hero.fatigue > other.fatigue))
        return "being in the field for 6 hours cost nothing against staying home";

      // The wound's clock must have been paused for exactly the 6 field hours.
      const now = t0 + 10 * 3600000;
      if (!hero.injury.severity || !other.injury.severity)
        return "the probe wound was too short for this Infirmary to be measured against";
      const left = hero.injury.healsAt - now;
      const ctrlLeft = other.injury.healsAt - now;
      // 6h paused in the field, 4h of rest -- and the Infirmary makes the clock
      // run faster than real time, so 4h of rest is 4h x healRate of healing.
      const want = healMs - 4 * 3600000 * infE.healRate;
      if (Math.abs(left - want) > 60000)
        return "wound has " + round1(left / 3600000) + "h left, expected " +
               round1(want / 3600000) + "h";
      if (!(left > ctrlLeft + 3599000))
        return "six hours in the field cost the wound nothing against resting throughout";
      return true;
    } finally { state = real; CONFIG.INJURY_WORSEN_CHANCE = worsen; }
  });

    // It runs over three STARTING WOUNDS, not one. Left at "whatever the save

  function reconcileHurtRisk(startWound, N){
    const real = state, wasDisarmed = savesDisarmed;
    try {
      savesDisarmed = true;                 // deploy() saves; this must not
      state = JSON.parse(JSON.stringify(real));
      const zd = zoneDef(CONFIG.ZONES[0].id);
      const party = state.heroes.slice(0, 3);
      party.forEach(h => {
        h.fatigue = 0;
        h.injury = startWound
          ? { severity: startWound, healsAt: nowMs() + 100 * 3600000 }
          : { severity: null, healsAt: 0 };
      });
      const q = { id:"probe", zoneId: zd.id, type:"delve", typeName:"Delve", stat:"power",
        name:"Probe", flavor:"p", length:"long", durationMs: CONFIG.DURATION_MS.long,
        required:3, stages: CONFIG.QUEST_TYPES.delve.stages,
        difficulty: questDifficulty("delve", 3, zd.danger),
        gold:90, material:3, expiresAt: nowMs() + 1e6 };
      // The party state the PREVIEW measured. Restoring to pristine heroes each
      // iteration instead was the bug that made this check valid only on a
      // fresh save: with a wounded roster the drawer was quoted for hurt heroes
      // and the resolver ran healthy ones, and the two disagreed by 27 points.
      const partySnap = JSON.stringify(party);
      const pv = previewQuest(q, party);
      const target = party[0];
      const predicted = pv.injuries.filter(i => i.hero.id === target.id)[0].expected;

      // Build the in-flight record with deploy(), NOT by hand. Hand-rolling it
      // meant this check compared the drawer against a record the game would
      // never have produced -- it had already silently dropped the event
      // multiplier once, and hardcoding `locked:false` made it disagree by 18
      // points the moment a zone went Contested. One source for the frozen
      // fields is the only version of this check that stays true.
      state.zones[0].slate.push(q);
      deploy(q, party);
      const record = JSON.stringify(state.activeQuests.pop());

      let hurt = 0;
      return withSeed(0x5EED1, () => {
      for (let i = 0; i < N; i++){
        const restore = JSON.parse(partySnap);
        party.forEach((h, n) => { Object.keys(h).forEach(k => delete h[k]);
                                  Object.assign(h, restore[n]); });
        state.pendingReports = [];
        state.zones[0].influence = 50;
        resolveQuest(JSON.parse(record), nowMs());
        if (target.injury.severity && target.injury.severity !== restore[0].injury.severity)
          hurt++;
      }
      const observed = hurt / N;
      // ~1500 samples: 4 points of slack is comfortably outside sampling noise
      // but tight enough to catch the 2-3x errors this check exists to find.
      return Math.abs(observed - predicted) < 0.04
        ? true : "the drawer promises " + pct(predicted) +
                 " but resolution produced " + pct(observed) + " over " + N + " runs";
      });
    } finally { savesDisarmed = wasDisarmed; state = real; }
  }

      if (!h.hook || h.hook.length < 40) return h.name + " has no background hook";
      if (!zoneIds.has(h.homeZone)) return h.name + " home zone '" + h.homeZone + "' is not a zone";
      if (!syms.has(h.portraitId)) return h.name + " portrait '" + h.portraitId + "' undefined";
      if (!(h.traits || []).length) return h.name + " has no traits";
      for (const t of h.traits) if (!TRAITS[t]) return h.name + " has unknown trait '" + t + "'";
      for (const k of ["might","agility","wits","spirit","presence"])
        if (typeof h.attrs[k] !== "number") return h.name + " missing attribute " + k;
    }
    // Portraits must be distinct or the roster stops being readable at a glance.
    const ports = STARTING_HEROES.map(h => h.portraitId);
    return new Set(ports).size === ports.length ? true : "two heroes share a portrait";
  });

  chk("loaded heroes keep their identity", () => {
    // "heroes are fully authored" validates STARTING_HEROES -- the table in the
    // source. It is blind to what actually came back out of localStorage, which
    // is where identity gets lost. A v1 save loaded with no traits, no portrait
    // and no hook and every check still passed. This one reads the LIVE state.
    for (const h of state.heroes){
      if (!h.portraitId) return h.name + " has no portrait in the live save";
      if (!Array.isArray(h.traits)) return h.name + " has no traits array in the live save";
      for (const t of h.traits)
        if (!TRAITS[t]) return h.name + " carries unknown trait '" + t + "'";
      const def = STARTING_HEROES.find(d => d.name === h.name);
      if (def){
        if (h.homeZone !== def.homeZone)
          return h.name + " lost their home zone (" + h.homeZone + " vs " + def.homeZone + ")";
        if (!h.hook) return h.name + " lost their background hook";
        if (h.traits.length !== def.traits.length)
          return h.name + " carries " + h.traits.length + " traits, authored with " + def.traits.length;
      }
    }
    return true;
  });

  chk("migration restores a v1 roster", () => {
    const v1 = {
      version: 1,
      heroes: STARTING_HEROES.map(d => ({
        name: d.name, cls: d.cls, role: d.role, level: 1, xp: 0,
        attrs: Object.assign({}, d.attrs), injury:{ severity:null, healsAt:0 },
        fatigue: 0, status:"idle", deployedTo: null
        // deliberately no portraitId / homeZone / hook / traits / marks
      }))
    };
    const out = migrate(v1);
    if (out.version !== CONFIG.SAVE_VERSION) return "ended at version " + out.version;
    for (const h of out.heroes){
      const def = STARTING_HEROES.find(d => d.name === h.name);
      if (h.portraitId !== def.portraitId) return h.name + " portrait not restored";
      if (h.homeZone !== def.homeZone) return h.name + " home zone not restored";
      if (!h.hook) return h.name + " hook not restored";
      if (h.traits.join() !== def.traits.join()) return h.name + " traits not restored";
      if (!Array.isArray(h.marks)) return h.name + " marks not initialised";
    }
    // An unknown hero (a future recruit) must survive with playable defaults.
    const stranger = migrate({ version:1, heroes:[{ name:"Nobody At All" }] }).heroes[0];
    return stranger.portraitId && Array.isArray(stranger.traits)
      ? true : "an unrecognised hero was not given safe defaults";
  });

  chk("loading sanitises a save already at the current version", () => {
    // The dangling-id cleanup used to sit inside migrate()'s v1 case, so a save
    // ALREADY at the current version was never cleaned: rename a trait in a
    // later build and every existing save carries the dead id forever, losing
    // the effect and printing the raw id as its own chip label. Sanitising has
    // to be version-independent, so this exercises the real load path.
    const loaded = sanitizeLoaded(migrate({
      version: CONFIG.SAVE_VERSION,
      heroes: [{ name:"Nobody At All", traits:["cautious","noSuchTrait"] }]
    }));
    const h = loaded.heroes[0];
    if (h.traits.length !== 1 || h.traits[0] !== "cautious")
      return "a dangling trait id survived a same-version load: " + JSON.stringify(h.traits);
    if (!h.portraitId) return "no fallback portrait on a same-version load";
    if (!Array.isArray(h.marks)) return "marks were not initialised on a same-version load";
    const bad = sanitizeLoaded({ version: CONFIG.SAVE_VERSION,
      heroes: [{ name:"X", traits:[], homeZone:"nowhere" }] }).heroes[0];
    return bad.homeZone === null ? true : "a home zone naming no real zone survived load";
  });

  chk("no inert trait", () => {
    // The class check for traits: a trait whose apply() never moves the
    // accumulator for ANY zone or outcome is a typo -- almost always a wrong
    // zone id, which is invisible at a glance and silently does nothing.
    const blank = blankEffects;   // the real constructor, never a copy of it
    const ctxs = [{}];
    CONFIG.ZONES.forEach(z => {
      ctxs.push({ zoneId:z.id, danger:z.danger, failed:false });
      ctxs.push({ zoneId:z.id, danger:z.danger, failed:true });
    });
    const dead = [];
    Object.keys(TRAITS).forEach(id => {
      let moved = false;
      CONFIG.ZONES.forEach(home => {
        const probe = { name:"probe", traits:[id], homeZone:home.id,
                        attrs:{ might:5, agility:5, wits:5, spirit:5, presence:5 },
                        injury:{ severity:null, healsAt:0 }, fatigue:0 };
        ctxs.forEach(c => {
          const a = blank();
          TRAITS[id].apply(a, probe, c);
          if (JSON.stringify(a) !== JSON.stringify(blank())) moved = true;
        });
      });
      if (!moved) dead.push(id);
    });
    return dead.length === 0 ? true : "never fires for any zone or outcome: " + dead.join(", ");
  });

  chk("no dead TRAIT_VALUES", () => {
    const src = scannableSource();
    const dead = Object.keys(CONFIG.TRAIT_VALUES).filter(k =>
      !src.includes("TRAIT_VALUES." + k) && !src.includes("TV()." + k));
    return dead.length === 0 ? true : "unread: " + dead.join(", ");
  });

  chk("every trait is well formed", () => {
    for (const id of Object.keys(TRAITS)){
      const t = TRAITS[id];
      if (!t.name) return id + " has no name";
      if (typeof t.apply !== "function") return id + " has no apply()";
      if (typeof t.desc !== "function") return id + " has no desc()";
      const probe = STARTING_HEROES[0];
      const d = t.desc(Object.assign({}, probe, { homeZone: CONFIG.ZONES[0].id }));
      if (typeof d !== "string" || d.length < 20) return id + " description is unusable";
    }
    return true;
  });

  chk("traits reach the real formulas", () => {
    // Asserting the registry is well formed proves only that the table exists.
    // These drive the actual functions the game resolves quests with.
    const mk = traits => ({ id:"probe", name:"Probe", role:"Front", homeZone:"marrowfen",
      traits, attrs:{ might:6, agility:6, wits:5, spirit:5, presence:5 },
      injury:{ severity:null, healsAt:0 }, fatigue:0, status:"idle" });
    const staff = staffing(2, 2);
    const plain = mk([]), cautious = mk(["cautious"]), fen = mk(["fenWise"]);

    if (!(injuryChance(cautious, 2, 1, staff, false, false, "marrowfen") <
          injuryChance(plain, 2, 1, staff, false, false, "marrowfen")))
      return "Cautious does not reduce injury chance";
    if (!(effectivePower(cautious) < effectivePower(plain)))
      return "Cautious does not reduce power";

    const inFen  = effectivePower(fen, { zoneId:"marrowfen" });
    const outFen = effectivePower(fen, { zoneId:"greenhollow" });
    if (!(inFen > outFen)) return "Fen-Wise does not raise power in Marrowfen";
    if (Math.abs(outFen - effectivePower(plain)) > 1e-9)
      return "Fen-Wise leaks outside Marrowfen";

    const home = { zoneId:"marrowfen" }, away = { zoneId:"greenhollow" };
    if (partyInfluenceBonus([mk(["local"])], away) !== 0)
      return "Local pays away from home";
    const one = partyInfluenceBonus([mk(["local"])], home);
    const two = partyInfluenceBonus([mk(["local"]), mk(["local"])], home);
    if (!(one > 0)) return "Local pays nothing at home";
    if (Math.abs(two - one * 2) > 1e-9)
      return "influence bonuses compound instead of adding";

    // Grim only fires on a failure, and must not leak into the success case.
    const grim = mk(["grim"]);
    if (!(injuryChance(grim, 2, 1, staff, true, false, "marrowfen") <
          injuryChance(plain, 2, 1, staff, true, false, "marrowfen")))
      return "Grim does not help on a failed quest";
    if (Math.abs(injuryChance(grim,  2, 1, staff, false, false, "marrowfen") -
                 injuryChance(plain, 2, 1, staff, false, false, "marrowfen")) > 1e-9)
      return "Grim leaks into successful quests";
    return true;
  });

  chk("Ironbound tires, it just does not suffer for it", () => {
    // Gating fatigue ACCRUAL made this permanent total immunity: fatigue starts
    // at 0, nothing else raises it, so the threshold was unreachable forever.
    const mk = traits => ({ name:"probe", traits, homeZone:"greenhollow",
      attrs:{ might:5, agility:5, wits:5, spirit:5, presence:5 },
      injury:{ severity:null, healsAt:0 }, fatigue:0, status:"idle" });
    const iron = mk(["ironbound"]), plain = mk([]);
    const edge = CONFIG.TRAIT_VALUES.ironboundIgnoreBelow;

    if (traitEffects(iron).fatigueGainMult !== 1)
      return "Ironbound is reducing fatigue GAIN; it must only waive the penalty";

    iron.fatigue = plain.fatigue = edge - 1;
    if (fatigueMult(iron) !== 1) return "Ironbound is penalised below the threshold";
    if (!(fatigueMult(plain) > 1)) return "fatigue does not penalise an ordinary hero";

    iron.fatigue = edge + 10;
    const want = 1 + (edge + 10) / CONFIG.FATIGUE_MAX;
    if (Math.abs(fatigueMult(iron) - want) > 1e-9)
      return "Ironbound is not penalised normally above the threshold";
    return true;
  });

  chk("injury is rolled before this quest's own fatigue is added", () => {
    // Structural, deliberately: the chance is a probability, so the only way to
    // catch the ordering is to read the order. Adding fatigue first made every
    // roll use a fatigueMult the drawer never showed, always understating danger.
    const src = scannableSource();
    const at = src.indexOf("function resolveQuest");
    if (at < 0) return "could not find resolveQuest";
    const body = src.slice(at, src.indexOf("state.pendingReports.push", at));
    const iInjury  = body.indexOf("injuryChance(h,");
    const iFatigue = body.indexOf("h.fatigue = clamp(");
    if (iInjury < 0 || iFatigue < 0) return "could not locate both statements";
    return iInjury < iFatigue ? true
      : "fatigue is added before the injury roll, so the roll uses a fatigue the preview never showed";
  });

  chk("the drawer's rows and its odds agree", () => {
    // Dividing partyPower() back out by its own factors just recovers its input
    // by algebra and can never fail -- that version of this check was a
    // tautology. The real risk is previewQuest() building a different context
    // than the hero rows do, so a zone-conditional trait shows on the row and is
    // quietly missing from the odds. So: drive previewQuest, and require the
    // trait to be visible IN its output.
    const zd = zoneDef("marrowfen");
    const fen = state.heroes.find(h => (h.traits || []).includes("fenWise"));
    const other = state.heroes.find(h => h !== fen);
    if (!fen || !other) return true;
    const party = [fen, other];
    // Synthetic, so the check does not depend on what the slate happened to roll.
    // A Hunt exercises the stat lookup and the quarry counter at the same time.
    const mk = (typeId, stat) => ({
      id:"probe", zoneId:"marrowfen", type:typeId, typeName:typeId, stat:stat,
      name:"Probe", flavor:"probe", length:"medium",
      durationMs: CONFIG.DURATION_MS.medium, required:2, stages:1,
      difficulty: questDifficulty(typeId, 2, zd.danger), gold:10, material:1,
      expiresAt: nowMs() + 1e6, quarry:"Probe Quarry", counterRole:"Front"
    });
    const ctx = { zoneId:"marrowfen", danger: zd.danger, failed:false };

    const hunt = mk("hunt", "power");
    const pv = previewQuest(hunt, party);
    const rows = party.reduce((n, h) => n + heroStat(h, "power", ctx), 0);
    const expected = rows * roleCoverage(party)
                   * staffing(party.length, hunt.required).powerMult
                   * hunterCounterMult(hunt, party);
    if (Math.abs(pv.power - expected) > 1e-9)
      return "odds say " + round1(pv.power) + " but the rows total " + round1(expected);
    const flat = party.reduce((n, h) => n + heroStat(h, "power"), 0);
    if (!(rows > flat))
      return "Fen-Wise appears on the row but never reaches the odds in Marrowfen";

    // A quest that tests a non-physical stat must read the same in and out of
    // the zone: Fen-Wise sharpens arms, not conversation.
    const court = mk("court", "grace");
    const inZone  = party.reduce((n, h) => n + heroStat(h, "grace", ctx), 0);
    const outZone = party.reduce((n, h) => n + heroStat(h, "grace"), 0);
    return Math.abs(inZone - outZone) < 1e-9 && previewQuest(court, party).stat === "grace"
      ? true : "a power trait is leaking into a Grace test";
  });

  // Must be last: a diagnostic that perturbs its subject is worse than none.
  // Two checks clone the state to run advance() against it; if either restores
  // by rebinding the global instead of putting the original object back, every
  // outside reference to state -- and to the heroes and zones inside it --
  // silently becomes an orphan. That no-opped four falsification probes before
  // it was caught, which is exactly how a suite starts lying.
  chk("running the suite leaves the game untouched", () => {
    if (stateAtStart !== state) return "the state object was replaced during the run";
    if (JSON.stringify(state) !== stateJsonAtStart)
      return "state contents were modified during the run";
    // Live state is not the only thing a check can corrupt: one that drives the
    // UI reaches saveNow(), and wrote its own cloned fixture into the player's
    // save. The suite must not touch storage at all.
    if (savedAtStart !== storageGet())
      return "the suite wrote to the save while running";
    return true;
  });

  return { pass: fails.length === 0, count: ran, fails, names: names.slice() };
}

/* ============================================================ FALSIFY =====
   Five tautologies have now been found in this suite by hand -- checks that
   compare a clamped value to its own clamp, derive a probe from the constant
   under test, or round-trip an already-plain object. Hunting them by eye does
   not scale, so this makes every check prove it can fail.

   Each probe breaks exactly one thing and names the check that must notice.
   `uncovered` is the point of the whole exercise: any assertion with no probe
   behind it has never been shown to fail, and is where the next tautology is.
   ========================================================================= */
function falsify(opts){
  const V = CONFIG.TRAIT_VALUES;
  const keep = {};
  const P = [
    ["a dead CONFIG key", "no dead CONFIG keys",
      () => { CONFIG.__PROBE_UNUSED = 1; }, () => { delete CONFIG.__PROBE_UNUSED; }],

      () => { keep.mfs = CONFIG.MODAL_FOCUS_SELECTOR;
