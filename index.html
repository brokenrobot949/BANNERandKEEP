/* ============================================================= DEPLOY ===== */
function deploy(quest, heroes){
  const t = nowMs();
  const pv = previewQuest(quest, heroes);
  const zs = zoneOf(quest.zoneId);
  state.activeQuests.push({
    questId: quest.id,
    zoneId: quest.zoneId,
    type: quest.type,
    typeName: quest.typeName,
    stat: quest.stat,
    stages: quest.stages || 1,
    counterRole: quest.counterRole || null,
    quarry: quest.quarry || null,
    // Carried deliberately: incursionActive() looks for this on in-flight quests,
    // and dropping it meant every tick spawned ANOTHER raid while one was being
    // answered, since rival stays above the threshold throughout the fight.
    incursion: !!quest.incursion,
    // Frozen here with ratio and chance: the zone event's multiplier and any
    // party-wide one (a Warden). Read live at resolution instead, a rotation or
    // a roster change mid-flight made the odds the drawer promised differ from
    // the ones actually rolled.
    eventInjuryMult: eventEffect(zoneOf(quest.zoneId), "injuryMult", 1)
                   * partyInjuryMult(heroes),
    name: quest.name,
    length: quest.length,
    heroIds: heroes.map(h => h.id),
    // No `difficulty` here on purpose: it was written to every save and never
    // read again -- resolution uses the frozen ratio and chance.
    ratio: pv.ratio,
    chance: pv.chance,
    startedAt: t,
    completesAt: t + pv.duration,
    // The lock discount applies to BOTH, not just coin -- "weakened, never
    // forbidden" is about the whole reward, and material was escaping it.
    gold: Math.round(quest.gold * pv.reward * (pv.locked ? CONFIG.RIVAL_LOCK_REWARD_MULT : 1)),
    material: Math.round(quest.material * pv.reward * (pv.locked ? CONFIG.RIVAL_LOCK_REWARD_MULT : 1)),
    influence: pv.influence,
    locked: pv.locked,
    staffCount: heroes.length,
    required: quest.required
  });
  heroes.forEach(h => { h.status = "deployed"; h.deployedTo = quest.zoneId; });
  zs.slate = zs.slate.filter(q => q.id !== quest.id);
  save();
}

/* =================================================== QUEST RESOLUTION ===== */
function resolveQuest(aq, atMs){
  const zd = zoneDef(aq.zoneId), zs = zoneOf(aq.zoneId);
  const heroes = aq.heroIds.map(heroOf).filter(Boolean);
  const staff = staffing(aq.staffCount, aq.required);
  const type = CONFIG.QUEST_TYPES[aq.type] || CONFIG.QUEST_TYPES.clear;

  // A Delve is resolved stage by stage. Turning back partway is a real outcome,
  // not a binary failure -- the party is paid for what it actually cleared.
  const stages = aq.stages || 1;
  let cleared = 0;
  while (cleared < stages && rand() < aq.chance) cleared++;
  const success = cleared === stages;
  const partial = stages > 1 && cleared > 0 && !success;
  const share = stages > 1 ? cleared / stages : (success ? 1 : 0);

  const report = {
    at: atMs, zoneId: aq.zoneId, zoneName: zd.name, questName: aq.name,
    typeName: aq.typeName, type: aq.type, quarry: aq.quarry || null,
    success: success, partial: partial,
    stages: stages, cleared: cleared,
    heroNames: heroes.map(h => h.name),
    influence: 0, gold: 0, material: 0, materialId: zd.material,
    charters: 0, intel: false, injuries: [], marks: [],
    xp: 0, xpTo: 0, levelled: []
  };

  if (partial){
    // Partial credit: a fraction of the take, no rival gain, no influence loss.
    const before = zs.influence;
    zs.influence = clamp(0, CONFIG.INFLUENCE_MAX,
      zs.influence + aq.influence * share * CONFIG.DELVE_PARTIAL_INFLUENCE);
    report.influence = round1(zs.influence - before);
    const gold = Math.round(aq.gold * share);
    state.gold += gold;
    report.gold = gold;
    if (tierIndexFor(zs.influence) >= CONFIG.MATERIAL_DROP_MIN_TIER && aq.material){
      const mat = Math.max(1, Math.round(aq.material * share));
      state.materials[zd.material] += mat;
      report.material = mat;
    }
  } else if (success){
    const gain = aq.influence;
    const before = zs.influence;
    zs.influence = clamp(0, CONFIG.INFLUENCE_MAX, zs.influence + gain);
    report.influence = round1(zs.influence - before);
    state.gold += aq.gold;
    report.gold = aq.gold;
    if (tierIndexFor(zs.influence) >= CONFIG.MATERIAL_DROP_MIN_TIER && aq.material){
      state.materials[zd.material] += aq.material;
      report.material = aq.material;
    }
    if (type.charter){
      state.charters += type.charter;
      report.charters = type.charter;
    }
    if (aq.incursion){
      const was = zs.rival;
      zs.rival = clamp(0, CONFIG.RIVAL_MAX, zs.rival - CONFIG.INCURSION_ANSWERED_RIVAL);
      report.rivalPushed = round1(was - zs.rival);
    }
    // §4's own number: a won campaign drops the rival TO 40, it does not
    // subtract 40. That distinction is the whole point -- the worse the hold
    // was, the more a Reclaim is worth, so the campaign is always the answer to
    // a zone that has genuinely gone rather than a flat discount on one that
    // has not. Never raises it: a rival already below the line is left alone.
    if (aq.type === "reclaim"){
      const was = zs.rival;
      zs.rival = Math.min(zs.rival, CONFIG.RECLAIM_RIVAL_TO);
      report.rivalPushed = round1(was - zs.rival);
      report.reclaimed = true;
    }
    if (type.intel){
      zs.intelUntil = atMs + CONFIG.INTEL_DURATION_MS;
      report.intel = true;
    }
    // §6: Clear, Hunt and Delve pay gear. One find per successful job, into the
    // stash rather than onto a hero -- who carries it is the player's decision,
    // and a party of five all finding something would drown the report.
    const found = rollGearDrop(aq.type, zd.danger, keepEffect("forge"));
    if (found){
      if (stash().length < CONFIG.GEAR_STASH_MAX){
        stash().push(found);
        report.gear = { id: found.id, tier: found.tier, name: gearName(found) };
      } else {
        // Say so. A find that silently evaporates is worse than no find.
        report.gearLost = gearName(found);
      }
    }
  } else {
    // The floor is absolute, not merely a decay floor. §4 introduces it as a
    // decay floor, but a failed quest dropping a zone below a line the player
    // just bought with a Charter makes the purchase a lie -- and the whole point
    // of Consolidation is that what you have secured cannot be taken back. Rival
    // still gains on the failure, so failing is never free. See Open Decision #8.
    const before = zs.influence;
    zs.influence = clamp(zs.influenceFloor || 0, CONFIG.INFLUENCE_MAX,
      zs.influence - CONFIG.FAIL_INFLUENCE_PENALTY);
    report.influence = round1(zs.influence - before);
    zs.rival = clamp(0, CONFIG.RIVAL_MAX, zs.rival + CONFIG.RIVAL_GAIN_ON_FAIL);
  }

  heroes.forEach(h => {
    const fx = traitEffects(h, { zoneId: aq.zoneId, danger: zd.danger, failed: !success });
    // Roll injury BEFORE adding this quest's own fatigue. Adding first made the
    // roll read a fatigueMult the preview never showed: a hero sent out at 0
    // fatigue was quoted 1.00 and rolled at 1.25 on a Long quest. Every other
    // input is frozen at deploy time, so fatigue has to be too -- otherwise the
    // drawer understates the danger on every single quest.
    // Every stage ENTERED is an exposure -- the ones cleared, plus the one that
    // went wrong. Counting only `cleared` dropped the failed stage's exposure on
    // every partial run, and applying the failure multiplier across all of them
    // penalised stages that had in fact been cleared. The doubling belongs to
    // the stage that actually failed, and nowhere else.
    const evM = aq.eventInjuryMult === undefined ? 1 : aq.eventInjuryMult;
    const perOk   = injuryChance(h, zd.danger, aq.ratio, staff, false, aq.locked,
                                 aq.zoneId, aq.type, evM);
    const perFail = injuryChance(h, zd.danger, aq.ratio, staff, true,  aq.locked,
                                 aq.zoneId, aq.type, evM);
    let safe = Math.pow(1 - perOk, cleared);
    if (!success) safe *= (1 - perFail);
    const chance = 1 - safe;

    h.fatigue = clamp(0, CONFIG.FATIGUE_MAX,
      h.fatigue + CONFIG.FATIGUE_GAIN[aq.length] * fx.fatigueGainMult);

    const already = injuryDef(h.injury.severity);
    const setInjury = sev => {
      h.injury = { severity: sev.id,
                   healsAt: atMs + (sev.healHours / fx.healMult) * 3600000 };
    };

    if (already){
      // §7: deploying a wounded hero risks worsening the wound by one step.
      // A hero who went out hurt cannot take a *fresh* wound instead -- the
      // existing one simply gets worse, or it does not.
      if (rand() < CONFIG.INJURY_WORSEN_CHANCE){
        const order = CONFIG.INJURY_SEVERITIES;
        const idx = order.findIndex(s => s.id === already.id);
        const next = order[Math.min(idx + 1, order.length - 1)];
        // The Mark roll belongs INSIDE the "it actually got worse" branch. Left
        // outside, a hero already at Grievous rolled for a Mark on every single
        // deployment while nothing worsened -- a permanent 30% x 25% Mark farm.
        // Found because a simulation reported more Marks than wounds, which is
        // impossible.
        if (next.id !== already.id){
          setInjury(next);
          report.injuries.push({ name: h.name, severity: next.name, worsened: true,
                                 from: already.name });
          if (next.id === "grievous") maybeMark(h, aq.zoneId, atMs, report);
        }
      }
    } else if (rand() < chance){
      const sev = rollSeverity(aq.ratio);
      setInjury(sev);
      report.injuries.push({ name: h.name, severity: sev.name });
      if (sev.id === "grievous") maybeMark(h, aq.zoneId, atMs, report);
    }
    // §7: the work teaches. Paid AFTER the injury roll, so a hero who came home
    // maimed still earned it -- surviving a bad job is where the learning is.
    // Levels are applied here rather than left to advance()'s rest pass, so a
    // hero who levels on the way home is levelled in the report that says so.
    // Nothing is banked past the ceiling. applyLevels() stops at LEVEL_MAX and
    // leaves whatever is left sitting in h.xp, so without this a long-running
    // save grows an unbounded number that no screen will ever spend.
    const xp = h.level < CONFIG.LEVEL_MAX ? questXP(aq, zd, success, share) : 0;
    if (xp > 0){
      h.xp += xp;
      // Same figure for every hero who can still learn -- but a fully trained
      // one earns nothing, so the count is carried too. "+4 XP each" is a lie
      // on a party where one of them is at the ceiling.
      report.xp = xp;
      report.xpTo++;
      const before = h.level;
      if (applyLevels(h) > 0) report.levelled.push(h.name + " to " + h.level);
      if (h.level > before && awaitingSubclass(h)) report.branchReady = true;
    }
    h.status = "idle";
    h.deployedTo = null;
  });

  state.pendingReports.push(report);
}

/* ================================================== DECAY AND RIVALS =====
   Integrated in slices so the tier -- and therefore the rate -- is re-read as
   influence falls. Respects influenceFloor and an active Patrol.
   ========================================================================= */
/* `halved` is passed in rather than looked up, because the caller knows how much
   of the window a Patrol actually covered -- by the time decay runs, a Patrol
   that finished mid-window has already been dropped from activeQuests. */
function applyDecay(zoneState, hours, halvedArg){
  if (hours <= 0) return 0;
  const halved = halvedArg === undefined ? zoneHasPatrol(zoneState) : !!halvedArg;
  let remaining = hours, lost = 0, guard = 0;
  while (remaining > 1e-9 && guard++ < 5000){
    const step = Math.min(CONFIG.DECAY_SLICE_H, remaining);
    remaining -= step;
    let rate = CONFIG.TIERS[tierIndexFor(zoneState.influence)].decayPerHour;
    if (halved) rate *= CONFIG.PATROL_DECAY_MULT;
    rate *= eventEffect(zoneState, "decayMult", 1);   // Quiet halves it
    if (rate <= 0) continue;
    const floor = zoneState.influenceFloor || 0;
    const before = zoneState.influence;
    zoneState.influence = Math.max(floor, zoneState.influence - rate * step);
    lost += before - zoneState.influence;
    if (zoneState.influence <= floor) break;
  }
  return lost;
}

/* ====================================================== TIME ADVANCE ======
   DESIGN.md §12 order, used by both the live tick and the offline load. The
   ordering is deliberate: gains are applied BEFORE decay, or a long absence
   wipes rewards the player had already earned.
   ========================================================================= */
function advance(t){
  const elapsed = t - state.lastTick;
  if (elapsed <= 0){ state.lastTick = t; return 0; }

  const startTick = state.lastTick;
  let resolved = 0;

  // Step 1 flips heroes to idle and drops finished quests, but steps 3-5 run over
  // the WHOLE window. Read the pre-resolution facts now, or a hero whose quest
  // finished mid-window is treated as having been at the Keep for all of it --
  // which hands them full rest credit and un-pauses their wound for hours they
  // actually spent in the field. Same for a Patrol: the zone loses the halving it
  // earned before the Patrol ended.
  const wasDeployed = {}, cameHomeAt = {}, woundCarried = {};
  state.heroes.forEach(h => {
    if (h.status === "deployed") wasDeployed[h.id] = true;
    // Remember the exact wound being carried in. Only THAT wound may be paused
    // for field hours -- a wound taken (or worsened into) at completesAt starts
    // its clock after the field time and must not be charged for it.
    if (h.injury.severity) woundCarried[h.id] = h.injury.healsAt;
  });
  const patrolUntil = {};
  state.activeQuests.forEach(q => {
    if (q.type !== "patrol") return;
    const until = Math.min(q.completesAt, t);
    patrolUntil[q.zoneId] = Math.max(patrolUntil[q.zoneId] || 0, until);
  });
  // The tier the player LEFT it at. Reading it after quest resolution reported a
  // zone as falling from a tier it only touched while they were away and never
  // saw -- true of the window, but not the sentence they need.
  const tierAtDeparture = {};
  state.zones.forEach(z => { tierAtDeparture[z.id] = tierIndexFor(z.influence); });

  // 1 + 2. Resolve completed quests and apply their influence gains.
  const done = state.activeQuests.filter(q => q.completesAt <= t);
  if (done.length){
    done.sort((a, b) => a.completesAt - b.completesAt);
    done.forEach(aq => {
      resolveQuest(aq, aq.completesAt);
      aq.heroIds.forEach(id => {
        if (cameHomeAt[id] === undefined) cameHomeAt[id] = aq.completesAt;
      });
      resolved++;
    });
    state.activeQuests = state.activeQuests.filter(q => q.completesAt > t);
  }

  // 3 + 4. Decay, capped for offline absence, then rival gain from what was lost.
  // Split at the moment any Patrol ended so the halved and full-rate portions are
  // each charged for their own share of the window.
  const decayMs = Math.min(elapsed, CONFIG.OFFLINE_DECAY_CAP_H * 3600000);
  const decayStart = t - decayMs;
  const zoneStory = {};
  state.zones.forEach(z => {
    const rivalBefore = z.rival, tierBefore = tierAtDeparture[z.id];
    const wasLocked = isLocked(z);
    const patrolTo = patrolUntil[z.id] || 0;
    let lost = 0;

    // Walk the window in segments bounded by event expiry, rolling the event as
    // each one runs out. Decaying the WHOLE window under whichever event was
    // live at departure meant a player could watch for Quiet (decay halved),
    // close the tab, and take half decay for a 48-hour absence -- repeatably.
    // §9 rotates every 4-8 hours, so a long absence must pass through the
    // rotations it would have seen.
    let cursor = decayStart, guard = 0, anyPatrolled = false;
    while (cursor < t && guard++ < 400){
      if (!z.event || !CONFIG.ZONE_EVENTS[z.event.type] || z.event.expires <= cursor)
        rollEvent(z, cursor, z.event && z.event.type);
      const segEnd = Math.min(t, z.event.expires);
      const segMs = segEnd - cursor;
      if (segMs <= 0) break;
      const guarded = clamp(0, segMs, patrolTo - cursor);
      if (guarded > 0){ lost += applyDecay(z, guarded / 3600000, true); anyPatrolled = true; }
      if (segMs - guarded > 0) lost += applyDecay(z, (segMs - guarded) / 3600000, false);
      cursor = segEnd;
    }
    if (lost > 0)
      z.rival = clamp(0, CONFIG.RIVAL_MAX, z.rival + lost * CONFIG.RIVAL_DECAY_SHARE);
    zoneStory[z.id] = {
      lost: lost, rivalGained: z.rival - rivalBefore,
      tierBefore: tierBefore, tierAfter: tierIndexFor(z.influence),
      influenceAfter: z.influence,
      patrolled: anyPatrolled,
      lockedNow: isLocked(z) && !wasLocked
    };
  });

  // 5. Injury healing and fatigue recovery, each charged per hero for the portion
  // of the window they were actually in the field versus at the Keep.
  const healedNow = [], levelledNow = [];
  state.heroes.forEach(h => {
    const home = cameHomeAt[h.id];
    const fieldMs = wasDeployed[h.id]
      ? clamp(0, elapsed, home === undefined ? elapsed : home - startTick)
      : 0;
    const restMs = elapsed - fieldMs;

    // A wound's clock does not run in the field: pushing healsAt forward PAUSES
    // it rather than slowing it, so a hero kept permanently in rotation stays
    // permanently hurt. That is the whole reason benching pays (DESIGN.md §7).
    const inf = keepEffect("infirmary");
    const sameWound = h.injury.severity && woundCarried[h.id] === h.injury.healsAt;
    if (sameWound && fieldMs > 0 && !CONFIG.INJURY_HEALS_IN_FIELD)
      h.injury.healsAt += fieldMs;
    // The Infirmary makes the heal clock run FASTER than real time while resting,
    // rather than being baked in when the wound was taken -- so upgrading it helps
    // the heroes who are already hurt, which is when you actually want to build it.
    if (h.injury.severity && restMs > 0 && inf.healRate > 1)
      h.injury.healsAt -= restMs * (inf.healRate - 1);
    if (h.injury.severity && h.injury.healsAt <= t){
      h.injury = { severity:null, healsAt:0 };
      healedNow.push(h.name);
    }

    const restMult = traitEffects(h).restMult * inf.restRate;
    const recovered = CONFIG.FATIGUE_FIELD_PER_HOUR * (fieldMs / 3600000)
                    + CONFIG.FATIGUE_REST_PER_HOUR * restMult * (restMs / 3600000);
    if (recovered > 0) h.fatigue = clamp(0, CONFIG.FATIGUE_MAX, h.fatigue - recovered);

    // Training Yard: the bench is not idle time. Levels arrive in Phase 8; the
    // experience is really accruing now so that phase only adds the threshold.
    const xpRate = keepEffect("trainingYard").xpPerHour;
    if (xpRate > 0 && restMs > 0 && h.level < CONFIG.LEVEL_MAX)
      h.xp += xpRate * (restMs / 3600000);
    if (applyLevels(h) > 0) levelledNow.push(h.name + " to " + h.level);
  });

  // 6. Expire and reseed slates, rotate events, and answer for any raid ignored.
  const ignored = [];
  state.zones.forEach(z => {
    // An incursion that runs out unanswered is charged for, once.
    const lapsed = z.slate.filter(q => q.incursion && q.expiresAt <= t);
    lapsed.forEach(() => incursionIgnored(z, t, ignored));

    const before = z.slate.length;
    z.slate = z.slate.filter(q => q.expiresAt > t);

    if (!z.event || !CONFIG.ZONE_EVENTS[z.event.type] || z.event.expires <= t)
      rollEvent(z, t, z.event && z.event.type);

    if (z.nextReseed <= t || z.slate.length < CONFIG.SLATE_MIN || before !== z.slate.length)
      reseedSlate(z, t);

    // §9: at rival 60+ they come to the Keep. One at a time per zone.
    if (z.rival >= CONFIG.INCURSION_RIVAL_MIN && !incursionActive(z)){
      const q = makeIncursion(z, t);
      if (q) z.slate.push(q);
    }
  });
  if (ignored.length) state.pendingIgnored = (state.pendingIgnored || []).concat(ignored);

  // An absence is a story about the realm, not only about the parties that came
  // home. Decay, a rival gaining ground, a zone forgetting you -- none of that
  // appears in a quest log, and over 48 hours it is most of what happened.
  if (elapsed >= CONFIG.REPORT_MIN_ABSENCE_MS){
    const prev = state.pendingAbsence;
    const abs = prev || { elapsedMs: 0, zones: {}, healed: [], levelled: [], at: t };
    if (!Array.isArray(abs.levelled)) abs.levelled = [];
    abs.elapsedMs += elapsed;
    abs.at = t;
    state.zones.forEach(z => {
      const s = zoneStory[z.id], into = abs.zones[z.id] || (abs.zones[z.id] = {
        lost: 0, rivalGained: 0, tierBefore: s.tierBefore, patrolled: false, lockedNow: false
      });
      into.lost += s.lost;
      into.rivalGained += s.rivalGained;
      into.tierAfter = s.tierAfter;
      into.influenceAfter = s.influenceAfter;
      into.patrolled = into.patrolled || s.patrolled;
      into.lockedNow = into.lockedNow || s.lockedNow;
    });
    healedNow.forEach(n => { if (abs.healed.indexOf(n) < 0) abs.healed.push(n); });
    levelledNow.forEach(n => abs.levelled.push(n));
    state.pendingAbsence = abs;
  }

  checkVictory();
  state.lastTick = t;
  return resolved;
}

function zonesHeld(){
  return state.zones.filter(z => tierIndexFor(z.influence) >= CONFIG.WIN_MIN_TIER).length;
}
function checkVictory(){
  if (state.won) return;
  if (zonesHeld() >= CONFIG.WIN_ZONE_COUNT){
    state.won = true;
    state.wonAt = nowMs();
    // Who was standing when it happened. §10 makes the plate-spinning skill the
    // final exam, so the ending names the people who did the spinning.
    state.wonWith = state.heroes.map(h => h.name);
    state.pendingReports.push({
      at: nowMs(), victory: true, zoneName:"The Realm",
      questName:"Highcrown Sends Word", typeName:"Victory", success:true,
      heroNames: state.wonWith.slice(), influence:0, gold:0, material:0,
      charters:0, injuries:[], marks:[]
    });
  }
}

/* ============================================================== VIEWS ===== */
let currentView = "map";
let openZone = null;      // zone id when the zone panel is showing
let openHero = null;      // hero id when the hero detail is showing
let selectedQuest = null; // quest id with an open deploy drawer
let picked = new Set();   // hero ids checked in the drawer

const $  = sel => document.querySelector(sel);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const icon = (sym, size, color) =>
  '<svg width="' + size + '" height="' + size + '"' +
  (color ? ' style="color:' + color + '"' : '') + '><use href="#' + sym + '"/></svg>';

/* Every clickable that is not natively a button goes through here, so a mouse
   target and a keyboard target can never drift apart. Several cards shipped as
   bare `div.onclick` and were simply unreachable without a mouse; an assertion
   now scans the rendered DOM for any that skip this. */
function activatable(node, label, fn){
  node.setAttribute("role", "button");
  node.setAttribute("tabindex", "0");
  if (label) node.setAttribute("aria-label", label);
  node.onclick = fn;
  node.onkeydown = e => {
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar"){
      e.preventDefault();
      fn(e);
    }
  };
  return node;
}

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("on"), 2200);
}

function setView(v){
  currentView = v;
  // Leaving the map closes the zone, so the open quest and its half-made party
  // have to go with it. Only the zone panel's own back button used to clear
  // these, so leaving by the bottom nav and coming back re-opened the drawer
  // with the previous picks still lit on what looks like a fresh screen.
  if (v !== "map"){ openZone = null; selectedQuest = null; picked.clear(); }
  if (v !== "roster") openHero = null;
  ["map","roster","keep"].forEach(n => {
    $("#v-" + n).hidden = n !== v;
    $("#nav-" + n).setAttribute("aria-current", String(n === v));
  });
  render();
}

/* ---------------------------------------------------------- header ------- */
function renderHeader(){

  $("#hdr-day").textContent = days > 0 ? "Day " + (days + 1) : "Day 1";

  const idle = state.heroes.filter(h => h.status === "idle" && !h.injury.severity).length;
  const dep  = state.heroes.filter(h => h.status === "deployed").length;

       icon("sym-charter", 13, "var(--ink)") + '<b class="num">' + state.charters + '</b></span>';
  Object.keys(CONFIG.MATERIALS).forEach(m => {

         icon(md.sym, 13, md.color) + '<b class="num">' + v + '</b></span>';
  });

       '<span class="idle">idle <i>' + idle + '</i></span>' +
       '<span class="dep">out <i>' + dep + '</i></span>' +
       '<span class="inj">hurt <i>' + inj + '</i></span></span>';

}

/* ------------------------------------------------------------- map ------- */
function bannerScale(tIdx){
  return CONFIG.BANNER_MIN_SCALE +
    (CONFIG.BANNER_MAX_SCALE - CONFIG.BANNER_MIN_SCALE) * (tIdx / (TIER_COUNT - 1));
}
const TIER_COLOR = ["var(--t0)","var(--t1)","var(--t2)","var(--t3)","var(--t4)"];
/* Ink for each region's terrain. Muted well below the banner colours on
   purpose: the glyphs are the ground, and the banner has to stay the brightest
   thing in its own quarter or the map stops answering "how am I doing?". */
const TERRAIN_INK = { greenhollow:"#5f7a46", marrowfen:"#4b6b74",
                      thornmarch:"#7d7263",  ashenreach:"#8f5638" };

/* A closed curve through a list of points, quadratic through the midpoints:
   every authored point is a CONTROL point and the curve passes between them.
   That is what turns a plain coordinate list into a coastline -- authoring
   beziers by hand for a shape this size is where map art goes to die. */
function smoothClosedPath(pts){
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const m0 = mid(pts[pts.length - 1], pts[0]);
  let d = "M" + round1(m0[0]) + " " + round1(m0[1]);
  for (let i = 0; i < pts.length; i++){
    const c = pts[i], m = mid(c, pts[(i + 1) % pts.length]);
    d += "Q" + round1(c[0]) + " " + round1(c[1]) + " " + round1(m[0]) + " " + round1(m[1]);
  }
  return d + "Z";
}

function renderMap(){
  const v = $("#v-map");
  if (openZone){ renderZonePanel(v); return; }
  v.innerHTML = "";
  const coast = smoothClosedPath(MAP_ART.coastPts);

  let g = '<svg id="map-svg" viewBox="0 0 800 620" role="img" ' +
          'aria-label="Map of the realm. Tap a zone to open it.">';

  // --- the land -----------------------------------------------------------
  // Sea first, then the coast, then a second shoreline traced just outside it.
  // That offset line is the whole trick of a hand-drawn chart: one stroke is a
  // silhouette, two are a coastline.
  g += '<defs>';
  CONFIG.ZONES.forEach(z => {
    g += '<radialGradient id="rg-' + z.id + '" gradientUnits="userSpaceOnUse" cx="' + z.x +
         '" cy="' + z.y + '" r="' + MAP_ART.tintRadius + '">' +
         '<stop offset="0" stop-color="rgba(' + MAP_ART.tint[z.id] + ',.20)"/>' +
         '<stop offset=".55" stop-color="rgba(' + MAP_ART.tint[z.id] + ',.09)"/>' +
         '<stop offset="1" stop-color="rgba(' + MAP_ART.tint[z.id] + ',0)"/>' +
         '</radialGradient>';
  });
  g += '<clipPath id="landclip"><path d="' + coast + '"/></clipPath></defs>';

  g += '<rect x="0" y="0" width="800" height="620" fill="#080706"/>';
  g += '<path d="' + coast + '" fill="none" stroke="var(--line)" stroke-width="1.1" ' +
       'opacity=".55" transform="translate(400,310) scale(1.028) translate(-400,-310)"/>';
  g += '<path d="' + coast + '" fill="none" stroke="var(--line)" stroke-width=".9" ' +
       'opacity=".35" transform="translate(400,310) scale(1.055) translate(-400,-310)"/>';
  g += '<path d="' + coast + '" fill="#1a1610" stroke="#6a5936" stroke-width="1.8"/>';

  // Region colour, clipped to the land so the cast stops at the shore.
  CONFIG.ZONES.forEach(z => {
    g += '<rect x="0" y="0" width="800" height="620" fill="url(#rg-' + z.id +
         ')" clip-path="url(#landclip)"/>';
  });

  // marches: the four borders meeting at the Keep, the way a territorial map
  // draws them -- not lines between the zones, which drew a diamond nothing in
  // the game actually means (adjacency effects are deferred by DESIGN.md §14).
  [[400, 104], [716, 310], [400, 522], [84, 310]].forEach(([x, y]) => {
    g += '<line x1="400" y1="310" x2="' + x + '" y2="' + y + '" stroke="#6a5936" ' +
         'stroke-width="1.6" stroke-dasharray="2 10" stroke-linecap="round" opacity=".8"/>';
  });

  g += '<path d="' + MAP_ART.river + '" fill="none" stroke="#3c5560" stroke-width="2.6" ' +
       'stroke-linecap="round" opacity=".8"/>';
  MAP_ART.riverMouth.forEach(d => {
    g += '<path d="' + d + '" fill="none" stroke="#3c5560" stroke-width="1.7" ' +
         'stroke-linecap="round" opacity=".65"/>';
  });

  // roads, bowed rather than ruled: the Keep reaches every zone, and a straight
  // line between two points is the one thing no real road has ever been.
  CONFIG.ZONES.forEach(z => {
    const dx = z.x - 400, dy = z.y - 310, len = Math.hypot(dx, dy) || 1;
    const cx = (400 + z.x) / 2 - (dy / len) * 26;
    const cy = (310 + z.y) / 2 + (dx / len) * 26;
    g += '<path d="M400 310Q' + round1(cx) + ' ' + round1(cy) + ' ' + z.x + ' ' + z.y +
         '" fill="none" stroke="var(--line2)" stroke-width="1.7" stroke-dasharray="1 7" ' +
         'stroke-linecap="round" opacity=".8"/>';
  });

  // --- terrain ------------------------------------------------------------
  const glyph = (sym, x, y, s0, col, op) => {
    const s = s0 * MAP_ART.glyphScale;
    return '<g transform="translate(' + round1(x - s / 2) + ',' + round1(y - s / 2) +
      ')" style="color:' + col + '" opacity="' + op + '">' +
      '<svg width="' + round1(s) + '" height="' + round1(s) + '" viewBox="0 0 24 24">' +
      '<use href="#' + sym + '"/></svg></g>';
  };

  MAP_ART.sea.forEach(([x, y, s]) => { g += glyph("sym-t-water", x, y, s, "#33505c", ".85"); });
  CONFIG.ZONES.forEach(z => {
    const col = TERRAIN_INK[z.id];
    MAP_ART.glyphs[z.id].forEach(([sym, x, y, s]) => { g += glyph(sym, x, y, s, col, ".85"); });
  });
  MAP_ART.demesne.forEach(([sym, x, y, s]) => { g += glyph(sym, x, y, s, "#8b7a5e", ".8"); });

  // --- frame, title and compass -------------------------------------------
  g += '<rect x="7" y="7" width="786" height="606" fill="none" stroke="var(--line2)" ' +
       'stroke-width="1.6" opacity=".8"/>' +
       '<rect x="13" y="13" width="774" height="594" fill="none" stroke="var(--line)" ' +
       'stroke-width="1" opacity=".7"/>';
  [[13, 13], [787, 13], [13, 607], [787, 607]].forEach(([x, y]) => {
    g += '<circle cx="' + x + '" cy="' + y + '" r="3.4" fill="var(--gold-dim)" opacity=".75"/>';
  });
  // The cartouche sits in the northern bay, which is why that bay is there.
  g += '<g><path d="M292 38h216l11 16-11 16H292l-11-16 11-16z" fill="#0d0b09" ' +
       'stroke="var(--gold-dim)" stroke-width="1.1" opacity=".95"/>' +
       '<text x="400" y="59" text-anchor="middle" fill="var(--gold)" font-family="var(--sans)" ' +
       'font-size="12" letter-spacing="3.4">THE BORDER MARCHES</text></g>';
  // Compass on land, south of the Keep: the one genuinely empty acre on the
  // map, and where a chart has always put it.
  g += '<g transform="translate(377,447)" style="color:var(--gold-dim)" opacity=".75">' +
       '<svg width="46" height="46" viewBox="0 0 24 24"><use href="#sym-compass"/></svg></g>' +
       '<text x="400" y="440" text-anchor="middle" fill="var(--gold-dim)" ' +
       'font-family="var(--sans)" font-size="10.5" letter-spacing="1.6" opacity=".95">N</text>';

  // the Keep
  g += '<g><circle cx="400" cy="310" r="38" fill="#15120e" stroke="var(--gold-dim)" ' +
       'stroke-width="1.5"/><circle cx="400" cy="310" r="32" fill="none" ' +
       'stroke="var(--gold-dim)" stroke-width=".8" opacity=".6"/>' +
       '<g transform="translate(378,288)" style="color:var(--gold)">' +
       '<svg width="44" height="44" viewBox="0 0 24 24"><use href="#sym-keep"/></svg></g>' +
       '<text x="400" y="368" text-anchor="middle" fill="var(--muted)" ' +
       'font-family="var(--sans)" font-size="13" letter-spacing="1.5">THE KEEP</text></g>';

  // zones
  state.zones.forEach(zs => {
    const zd = zoneDef(zs.id);
    const ti = tierIndexFor(zs.influence);
    const locked = isLocked(zs);
    const sc = bannerScale(ti);
    const col = locked ? "var(--crimson)" : TIER_COLOR[ti];
    const op = locked ? 1 : (0.42 + 0.58 * (ti / (TIER_COUNT - 1)));
    const bw = 52 * sc, bh = 52 * sc;

    g += '<g class="zone-hit" tabindex="0" role="button" data-zone="' + zs.id + '" ' +
         'aria-label="' + zd.name + ', ' + (locked ? "held by " + zd.rivalName
           : CONFIG.TIERS[ti].name + ", influence " + Math.round(zs.influence)) + '">';
    // The disc is opaque, not translucent: the terrain behind it is decoration
    // and the banner is the reading. A tinted glass panel let cinder cones show
    // through the one glyph that has to be unmistakable at a glance.
    g += '<circle class="zring" cx="' + zd.x + '" cy="' + zd.y + '" r="46" ' +
         'fill="#15120e" stroke="' + col + '" stroke-width="1.5" stroke-opacity=".55"/>';
    g += '<circle cx="' + zd.x + '" cy="' + zd.y + '" r="40" fill="none" stroke="' + col +
         '" stroke-width=".8" stroke-opacity=".3"/>';
    g += '<g transform="translate(' + (zd.x - bw / 2) + ',' + (zd.y - bh / 2 - 4) + ')" ' +
         'style="color:' + col + '" opacity="' + op.toFixed(2) + '">' +
         '<svg width="' + bw + '" height="' + bh + '" viewBox="0 0 24 24">' +
         '<use href="#sym-banner"/></svg></g>';
    g += '<text x="' + zd.x + '" y="' + (zd.y + 62) + '" text-anchor="middle" ' +
         'fill="var(--ink)" font-family="var(--sans)" font-size="15">' + zd.name + '</text>';
    g += '<text x="' + zd.x + '" y="' + (zd.y + 79) + '" text-anchor="middle" fill="' + col +
         '" font-family="var(--sans)" font-size="11.5" letter-spacing="1.2">' +
         (locked ? zd.rivalName.toUpperCase() : CONFIG.TIERS[ti].name.toUpperCase()) + '</text>';

    const act = state.activeQuests.filter(q => q.zoneId === zs.id).length;
    if (act) g += '<circle cx="' + (zd.x + 34) + '" cy="' + (zd.y - 32) +
      '" r="10" fill="var(--gold)"/><text x="' + (zd.x + 34) + '" y="' + (zd.y - 28) +
      '" text-anchor="middle" font-size="12" font-family="var(--sans)" ' +
      'font-weight="700" fill="#1a1408">' + act + '</text>';
    g += '</g>';
  });
  g += '</svg>';
  v.innerHTML = g;

  // zone summary cards under the map
  state.zones.forEach(zs => {
    const zd = zoneDef(zs.id), ti = tierIndexFor(zs.influence), locked = isLocked(zs);
    const c = el("div", "card");
    c.style.cursor = "pointer";
    c.innerHTML =
      '<div class="zhead"><h2>' + zd.name + '</h2>' +
      '<span class="tier t' + ti + (locked ? " locked" : "") + '">' +
        (locked ? "Contested" : CONFIG.TIERS[ti].name) + '</span>' +
      '<span class="danger">Danger ' + dangerPips(zd.danger) + '</span></div>' +
      influenceBars(zs) +
      '<div class="tiny muted" style="margin-top:5px;display:flex;align-items:center;gap:7px">' +
        '<span class="ev e-' + ((zs.event && zs.event.type) || "quiet") + '">' +
          zoneEvent(zs).name + '</span>' +
        '<span>' + zs.slate.length + ' on the slate' +
        (state.activeQuests.filter(q => q.zoneId === zs.id).length
          ? ' · ' + state.activeQuests.filter(q => q.zoneId === zs.id).length + ' underway'
          : '') + '</span>' +
        (zs.influenceFloor > 0
          ? '<span class="good" style="margin-left:auto">' +
            icon("sym-charter", 11, "var(--verd)") + ' ' + Math.round(zs.influenceFloor) + '</span>'
          : '') +
        (zs.slate.some(q => q.incursion)
          ? '<span class="bad" style="margin-left:auto">' + icon("sym-warn", 11) + ' raid</span>'
          : '') +
      '</div>';
    activatable(c, zd.name + ", " + (locked ? "contested" : CONFIG.TIERS[ti].name) +
      ", influence " + Math.round(zs.influence), () => { openZone = zs.id; render(); });
    v.appendChild(c);
  });

  v.querySelectorAll(".zone-hit").forEach(n => {
    activatable(n, n.getAttribute("aria-label"),
      () => { openZone = n.dataset.zone; render(); });
  });
}

function dangerPips(d){
  let s = "";
  for (let i = 1; i <= 4; i++) s += '<span class="' + (i <= d ? "" : "off") + '">◆</span>';
  return '<span class="pips">' + s + '</span>';
}
function influenceBars(zs){
  const ti = tierIndexFor(zs.influence);
  const next = ti < TIER_COUNT - 1 ? CONFIG.TIERS[ti + 1].min : null;
  const floorPct = zs.influenceFloor > 0
    ? '<span class="flr" style="left:' + zs.influenceFloor + '%"></span>' : '';
  const decay = CONFIG.TIERS[ti].decayPerHour;
  return '' +
    '<div class="barrow"><span class="lab">Banner</span>' +
      '<span class="bar inf"><i style="width:' + zs.influence + '%"></i>' + floorPct + '</span>' +
      '<span class="val num">' + Math.round(zs.influence) +
        (next ? ' / ' + next : '') + '</span></div>' +
    '<div class="barrow"><span class="lab">Rival</span>' +
      '<span class="bar riv"><i style="width:' + zs.rival + '%"></i></span>' +
      '<span class="val num">' + Math.round(zs.rival) + '</span></div>' +
    '<div class="tiny dim">Decay ' + round1(decay * 24) + ' / day' +
      (decay === 0 ? ' · nothing to lose yet' : '') + '</div>';
}

/* -------------------------------------------------------- zone panel ----- */
function renderZonePanel(v){
  const zs = zoneOf(openZone), zd = zoneDef(openZone);
  const ti = tierIndexFor(zs.influence), locked = isLocked(zs);
  const md = CONFIG.MATERIALS[zd.material];
  v.innerHTML = "";

  const back = el("button", "btn sm", "← The Realm");
  back.style.marginBottom = "10px";
  back.onclick = () => { openZone = null; selectedQuest = null; picked.clear(); render(); };
  v.appendChild(back);

  const head = el("div", "card");
  head.innerHTML =
    '<div class="zhead"><h2>' + zd.name + '</h2>' +
    '<span class="tier t' + ti + (locked ? " locked" : "") + '">' +
      (locked ? "Contested" : CONFIG.TIERS[ti].name) + '</span></div>' +
    '<div class="tiny muted" style="margin-bottom:7px">' +
      'Danger ' + dangerPips(zd.danger) + ' · ' +
      '<span style="color:' + md.color + '">' + icon(md.sym, 12, md.color) + ' ' + md.name +
      '</span>' + (zd.travel > 0 ? ' · travel +' + Math.round(zd.travel * 100) + '%' : '') +
    '</div>' +
    influenceBars(zs) +
    (ti < CONFIG.MATERIAL_DROP_MIN_TIER
      ? '<div class="tiny warn" style="margin-top:6px">' + icon("sym-warn", 11) +
        ' No ' + md.name.toLowerCase() + ' until this zone is Noticed.</div>' : '') +
    (locked
      ? '<div class="tiny bad" style="margin-top:6px">' + icon("sym-warn", 11) +
        ' ' + zd.rivalName + ' hold the ground. Work here is harder, more dangerous ' +
        'and pays half — but it is never closed to you.</div>' : '');
  v.appendChild(head);

  // The live event, and the Charter that turns this zone's standing into a ratchet.
  const ev = zoneEvent(zs);
  const evId = (zs.event && zs.event.type) || "quiet";
  const con = canConsolidate(zs);
  const card = el("div", "card");
  let ch = '<div class="evrow"><span class="ev e-' + evId + '">' + ev.name + '</span>' +
    '<span class="tiny dim" style="margin-left:auto">turns in <b class="num" data-until="' +
    ((zs.event && zs.event.expires) || 0) + '">' +
    fmtDur(((zs.event && zs.event.expires) || 0) - nowMs()) + '</b></span></div>' +
    '<div class="tiny muted" style="margin:4px 0 8px">' + ev.blurb + '</div>';

  ch += '<div class="tiny" style="border-top:1px solid var(--line);padding-top:8px">' +
    (zs.influenceFloor > 0
      ? '<span class="good">' + icon("sym-charter", 11, "var(--verd)") +
        ' Consolidated at <b>' + Math.round(zs.influenceFloor) +
        '</b> — standing here can never fall below it.</span>'
      : '<span class="dim">Nothing here is held permanently yet.</span>') + '</div>';
  if (con.target > (zs.influenceFloor || 0)){
    ch += '<div class="tiny muted" style="margin:6px 0 7px">A Charter would lock the floor at <b>' +
      con.target + '</b> (' + CONFIG.TIERS[tierIndexFor(zs.influence)].name +
      '). Decay above it continues; below it, nothing can be taken back.</div>' +
      '<button class="btn sm ' + (con.ok ? "pri" : "") + '" id="consolidate"' +
      (con.ok ? "" : " disabled") + '>' +
      icon("sym-charter", 12, con.ok ? "#1a1408" : "var(--dim)") +
      ' Consolidate · ' + CONFIG.CONSOLIDATE_CHARTER_COST + '</button>' +
      (con.why === "charters"
        ? '<div class="tiny warn" style="margin-top:5px">No Charter. They come from Warfronts.</div>' : '');
  } else if (zs.influenceFloor > 0 && tierIndexFor(zs.influence) >= TIER_COUNT - 1){
    ch += '<div class="tiny dim" style="margin-top:6px">Nothing further to consolidate here.</div>';
  }
  card.innerHTML = ch;
  v.appendChild(card);
  const cbtn = card.querySelector("#consolidate");
  if (cbtn) cbtn.onclick = () => {
    if (consolidate(zs)){
      toast(zd.name + " consolidated at " + Math.round(zs.influenceFloor));
      render();
    }
  };

  // active quests here
  const act = state.activeQuests.filter(q => q.zoneId === zs.id);
  if (act.length){
    v.appendChild(el("h3", null, "In the field"));
    act.forEach(aq => {
      const names = aq.heroIds.map(id => (heroOf(id) || {}).name).filter(Boolean).join(" and ");
      const total = aq.completesAt - aq.startedAt;
      const doneP = clamp(0, 100, ((nowMs() - aq.startedAt) / total) * 100);
      const q = el("div", "quest active");
      q.innerHTML =
        '<div class="qt"><span class="qname">' + aq.name + '</span></div>' +
        '<div class="tiny muted" style="margin:4px 0 2px">' + names + '</div>' +
        '<div class="qmeta"><span>Success <b>' + pct(aq.chance) + '</b></span>' +
        '<span class="qexp">back in <b class="num" data-until="' + aq.completesAt + '">' +
          fmtDur(aq.completesAt - nowMs()) + '</b></span></div>' +
        '<div class="prog"><i style="width:' + doneP + '%" data-prog="' +
          aq.startedAt + ',' + aq.completesAt + '"></i></div>';
      v.appendChild(q);
    });
  }

  // the slate
  v.appendChild(el("h3", null, "The slate"));
  if (keepEffect("warRoom").preview){
    const nx = el("div", "tiny dim");
    nx.style.margin = "-4px 0 8px";
    nx.innerHTML = icon("sym-map", 11) + ' War Room: the board turns over in <b class="num" ' +
      'data-until="' + zs.nextReseed + '">' + fmtDur(zs.nextReseed - nowMs()) + '</b>.';
    v.appendChild(nx);
  }
  if (!zs.slate.length){
    v.appendChild(el("div", "stub", "Nothing on the board. The slate reseeds every " +
      Math.round(CONFIG.SLATE_RESEED_MS / 60000) + " minutes."));
  }
  zs.slate.slice().sort((a, b) => a.expiresAt - b.expiresAt).forEach(q => {
    const sel = selectedQuest === q.id;
    // `.quest.raid` had a rule since Phase 7 and nothing ever set the class, so
    // a raid on the board looked like ordinary work. Both markers are applied
    // here now, and an assertion checks the pair stays wired.
    const node = el("div", "quest" + (sel ? " sel" : "") +
      (q.incursion ? " raid" : "") + (q.type === "reclaim" ? " reclaim" : ""));
    const left = q.expiresAt - nowMs();
    // Intel comes from a successful Investigate, or permanently from the War Room.
    const intel = zs.intelUntil > nowMs() || keepEffect("warRoom").intel;
    const evReward = eventEffect(zs, "rewardMult", 1);   // live, not frozen
    if (q.incursion) node.classList.add("raid");
    node.innerHTML =
      '<div class="qt"><span class="qname">' + q.name + '</span>' +
        (q.incursion ? '<span class="qtype t-raid">Raid</span>' : '') +
        '<span class="qtype t-' + q.type + '">' + q.typeName + '</span></div>' +
      (q.incursion ? '<div class="tiny bad" style="margin:-2px 0 5px">' +
        icon("sym-warn", 11) + ' They have come to you. Let this lapse and it costs ' +
        (CONFIG.INCURSION_IGNORED_GOLD * zd.danger) + ' gold and ' +
        (CONFIG.INCURSION_IGNORED_MATERIAL * zd.danger) + ' ' +
        md.name.toLowerCase() + '.</div>' : '') +
      '<div class="qflav">' + q.flavor + '</div>' +
      (q.quarry ? '<div class="tiny muted" style="margin:-3px 0 6px">Quarry: <b>' +
        q.quarry + '</b> · a <b>' + q.counterRole + '</b> knows how to take it</div>' : '') +
      '<div class="qmeta">' +
        '<span>' + q.required + (q.required === 1 ? ' hero' : ' heroes') + '</span>' +
        '<span>tests <b>' + DERIVED[q.stat].name + '</b></span>' +
        (q.stages > 1 ? '<span>' + q.stages + ' stages</span>' : '') +
        '<span>' + fmtDurLong(q.durationMs) + '</span>' +
        (intel ? '<span class="dim">difficulty ' + round1(q.difficulty) + '</span>' : '') +
        '<span class="reward">' + icon("sym-gold", 12, "var(--gold)") + '<b>' +
          Math.round(q.gold * evReward * (locked ? CONFIG.RIVAL_LOCK_REWARD_MULT : 1)) +
          '</b></span>' +
        (ti >= CONFIG.MATERIAL_DROP_MIN_TIER
          ? '<span class="reward">' + icon(md.sym, 12, md.color) + '<b>' +
            Math.round(q.material * evReward * (locked ? CONFIG.RIVAL_LOCK_REWARD_MULT : 1)) +
            '</b></span>'
          : '') +
        '<span class="qexp' + (left < 15 * 60000 ? " soon" : "") + '">expires <b class="num" ' +
          'data-until="' + q.expiresAt + '">' + fmtDur(left) + '</b></span>' +
      '</div>';
    activatable(node, q.typeName + ": " + q.name + ", " + q.required +
      (q.required === 1 ? " hero" : " heroes") + ", tests " + DERIVED[q.stat].name, () => {
      // The drawer is appended as a SIBLING of this card, not a child, so events
      // inside it never bubble here. A guard against that was dead code resting
      // on an untrue assumption about the markup.
      selectedQuest = sel ? null : q.id;
      picked.clear();
      render();
    });
    node.setAttribute("aria-expanded", String(sel));
    v.appendChild(node);
    if (sel) v.appendChild(renderDrawer(q));
  });
}

/* ----------------------------------------------------- deploy drawer ----- */
function renderDrawer(q){
  const d = el("div", "drawer");
  // Prune before anything reads the set. The preview counted every picked id
  // while Send filtered by isAvailable(), so the two disagreed by construction:
  // a picked hero who became unavailable would leave the drawer quoting a
  // three-hero party and deploying two, with no warning and no understaffing
  // notice. Nothing in single-tab play can currently move a picked hero out
  // from under the player -- but "currently unreachable" is not a reason for
  // two code paths to answer the same question differently, and this is the one
  // readout the design calls load-bearing.
  [...picked].forEach(id => {
    const h = heroOf(id);
    if (!h || !isAvailable(h)) picked.delete(id);
  });
  const chosen = state.heroes.filter(h => picked.has(h.id));
  const pv = chosen.length ? previewQuest(q, chosen) : null;
  const ctx = { zoneId: q.zoneId, danger: zoneDef(q.zoneId).danger, failed: false };

  const statId = q.stat || "power";
  const statName = DERIVED[statId].name;
  let h = '<h3 style="margin-bottom:7px">Send who? · ' + q.required +
          ' asked for · tests ' + statName + '</h3>' +
    '<div class="tiny dim" style="margin:-3px 0 7px">' +
      CONFIG.QUEST_TYPES[q.type].blurb + '</div>';
  // Rank by the stat this quest actually tests, so the right specialist is the
  // one at the top of the list rather than whoever happens to hit hardest.
  const ordered = state.heroes.slice().sort((a, b) =>
    heroStat(b, statId, ctx) - heroStat(a, statId, ctx));
  ordered.forEach(hero => {
    const busy = !isAvailable(hero);
    const inj = injuryDef(hero.injury.severity);
    let note = hero.cls + " · " + hero.role;
    if (busy) note = "in the field";
    else if (inj){
      const sevs = CONFIG.INJURY_SEVERITIES;
      const canWorsen = sevs.findIndex(s => s.id === inj.id) < sevs.length - 1;
      note = inj.name.toLowerCase() + " wound · " +
        (canWorsen ? pct(CONFIG.INJURY_WORSEN_CHANCE) + " to worsen if sent"
                   : "cannot get worse") +
        " · heals in " + fmtDur(hero.injury.healsAt - nowMs()) + " resting";
    }
    // Power shown here is power IN THIS ZONE, traits included -- Fen-Wise has to
    // be visible as a number at the moment the party is being chosen, or the
    // trait may as well not exist.
    const here = round1(heroStat(hero, statId, ctx));
    const flat = round1(heroStat(hero, statId));
    const swing = here > flat ? ' <span class="good">▲</span>'
                : here < flat ? ' <span class="bad">▼</span>' : '';
    const counters = q.counterRole && hero.role === q.counterRole;
    const on = picked.has(hero.id);
    // Tap the hero, not a box beside them. The tick is kept as a second,
    // non-colour signal -- selection that is ONLY a border tint disappears for
    // anyone who cannot separate gold from brown.
    h += '<div class="hpick' + (busy ? " busy" : "") + (on ? " sel" : "") +
      '" data-h="' + hero.id + '">' +
      '<span class="tick">' + (on ? icon("sym-check", 11, "#1a1408") : "") + '</span>' +
      '<span class="nm"><b>' + hero.name + '</b><span>' + note + '</span>' +
        '<span class="chips">' +
          (counters ? '<span class="chip home">counters the quarry</span>' : '') +
          (hero.traits || []).map(id => '<span class="chip' +
            (id === "local" && hero.homeZone === q.zoneId ? " home" : "") + '">' +
            (TRAITS[id] ? TRAITS[id].name : id) + '</span>').join("") +
        '</span></span>' +
      '<span class="pw">' + icon("sym-sword", 11, "var(--muted)") + " " + here + swing +
        (hero.fatigue > 0 ? '<br><span class="dim">fatigue ' + Math.round(hero.fatigue) + '</span>' : '') +
      '</span></div>';
  });

  if (pv){
    const chanceCls = pv.chance >= 0.7 ? "good" : pv.chance >= 0.45 ? "warn" : "bad";
    const hurtCls   = pv.expectedHurt <= 0.10 ? "good"
                    : pv.expectedHurt <= 0.25 ? "warn" : "bad";
    h += '<div class="readout">' +
      '<div><span>Party ' + statName.toLowerCase() + '</span><b>' + round1(pv.power) + '</b></div>' +
      '<div><span>Difficulty</span><b>' + round1(pv.diff) + '</b></div>' +
      '<div><span>' + (pv.stages > 1 ? "Per stage" : "Success") + '</span>' +
        '<b class="' + chanceCls + '">' + pct(pv.chance) + '</b></div>' +
      '<div><span>Hurt risk</span><b class="' + hurtCls + '">' + pct(pv.expectedHurt) +
        (pv.worst > pv.expectedHurt + 0.02
          ? ' <span class="dim">→ ' + pct(pv.worst) + '</span>' : '') + '</b></div>' +
      '<div><span>Time</span><b>' + fmtDurLong(pv.duration) + '</b></div>' +
      '<div><span>Banner</span><b class="good">+' + round1(pv.influence) + '</b></div>' +
      '</div>';
    if (pv.stages > 1)
      h += '<div class="tiny muted" style="margin-bottom:7px">' +
        pv.stages + ' stages, each rolled separately — all through pays in full, ' +
        'turning back partway still pays for what was cleared. Clearing every stage: <b>' +
        pct(Math.pow(pv.chance, pv.stages)) + '</b>. Every stage entered is another ' +
        'chance to be hurt, which is why the risk above is what it is.</div>';
    if (pv.worst > pv.expectedHurt + 0.02)
      h += '<div class="tiny dim" style="margin:-3px 0 7px">Hurt risk is the ' +
        'probability-weighted figure; the second number is the worst way it can go.</div>';
    if (pv.counter !== 1)
      h += '<div class="tiny ' + (pv.counter > 1 ? "good" : "warn") + '" style="margin-bottom:7px">' +
        (pv.counter > 1
          ? 'A ' + q.counterRole + ' is with them — ' + pct(pv.counter - 1) + ' more effective against ' + q.quarry + '.'
          : 'No ' + q.counterRole + ' in the party — ' + pct(1 - pv.counter) +
            ' less effective against ' + q.quarry + '. Allowed, never advised.') + '</div>';
    // Split by whether the wound can actually get worse. Telling someone their
    // Grievous hero has a 30% chance of worsening is simply false -- there is no
    // step below it -- and it is the sentence that stops the wounded roster ever
    // being used for the Guile and Grace work it is still perfectly good at.
    const worsenable = pv.injuries.filter(i => i.worsens && i.worsenable).map(i => i.hero);
    const maxed     = pv.injuries.filter(i => i.worsens && !i.worsenable).map(i => i.hero);
    if (worsenable.length)
      h += '<div class="tiny bad" style="margin-bottom:7px">' + icon("sym-warn", 11) +
        ' ' + nameList(worsenable.map(x => x.name)) +
        (worsenable.length > 1
          ? ' are already hurt, and each carries a <b>'
          : ' is already hurt, and carries a <b>') +
        pct(CONFIG.INJURY_WORSEN_CHANCE) + '</b> chance the wound worsens instead of ' +
        'healing. <b>A wound does not heal in the field at all</b> — the clock ' +
        'only runs at the Keep.</div>';
    if (maxed.length)
      h += '<div class="tiny warn" style="margin-bottom:7px">' + icon("sym-warn", 11) +
        ' ' + nameList(maxed.map(x => x.name)) + (maxed.length > 1 ? " are" : " is") +
        ' as badly hurt as it goes — there is nothing worse to take out there, ' +
        'and nothing mends until they are back at the Keep.</div>';
    if (pv.staff.missing)
      h += '<div class="tiny bad" style="margin-bottom:7px">' + icon("sym-warn", 11) +
        ' Understaffed by ' + pv.staff.missing + ' — party power cut to ' +
        pct(pv.staff.powerMult) + '. Allowed, never advised.</div>';
    if (pv.staff.extra)
      h += '<div class="tiny good" style="margin-bottom:7px">Overstaffed by ' + pv.staff.extra +
        ' — injury risk ' + pct(pv.staff.injuryMult) + ', time ' +
        pct(pv.staff.durationMult) + ' of normal.</div>';
  } else {
    h += '<div class="tiny dim" style="margin:9px 0">Choose heroes to see the odds.</div>';
  }
  h += '<button class="btn pri" id="go"' + (chosen.length ? "" : " disabled") + '>' +
       'Send ' + (chosen.length || "") + '</button>';
  d.innerHTML = h;

  d.querySelectorAll(".hpick[data-h]").forEach(row => {
    const id = row.dataset.h;
    // A hero in the field is shown, greyed, and simply is not a control: no
    // handler at all, so the keyboard-reachability assertion has nothing to
    // complain about and Tab does not stop on something that cannot be used.
    if (row.classList.contains("busy")){
      row.setAttribute("aria-disabled", "true");
      // Say so explicitly. Leaving it unset let a row carry the "sel" class
      // while announcing no pressed state at all -- the screen reader and the
      // screen disagreeing about the same row.
      row.setAttribute("aria-pressed", "false");
      return;
    }
    const hero = heroOf(id) || { name:"" };
    activatable(row, (picked.has(id) ? "Stand down " : "Send ") + hero.name, () => {
      if (picked.has(id)) picked.delete(id); else picked.add(id);
      render();
    });
    row.setAttribute("aria-pressed", String(picked.has(id)));
  });
  d.querySelector("#go").onclick = () => {
    const heroes = state.heroes.filter(x => picked.has(x.id) && isAvailable(x));
    if (!heroes.length) return;
    deploy(q, heroes);
    selectedQuest = null; picked.clear();
    toast(heroes.length + " sent to " + zoneDef(q.zoneId).name);
    render();
  };
  return d;
}

/* ----------------------------------------------------------- roster ------ */
function heroStatusLine(h){
  const inj = injuryDef(h.injury.severity);
  if (h.status === "deployed"){
    const aq = state.activeQuests.find(q => q.heroIds.includes(h.id));
    if (!aq) return { cls:"warn", html:"in the field" };
    // The bar is what makes "back in 4h 12m" answerable at a glance: a number
    // alone says how long is left, not how much of the trip is already spent.
    // data-prog is driven by updateTimers(), the same pass that moves the text,
    // so the two can never disagree.
    const span = Math.max(1, aq.completesAt - aq.startedAt);
    const done = clamp(0, 100, ((nowMs() - aq.startedAt) / span) * 100);
    return { cls:"warn", html:
      'back in <span class="num" data-until="' + aq.completesAt + '">' +
      fmtDur(aq.completesAt - nowMs()) + '</span>' +
      '<span class="mini out"><i style="width:' + round1(done) + '%" data-prog="' +
      aq.startedAt + ',' + aq.completesAt + '"></i></span>' };
  }
  if (inj) return { cls:"bad", html: inj.name +
    '<br><span class="dim">heals in <span class="num" data-until="' + h.injury.healsAt +
    '">' + fmtDur(h.injury.healsAt - nowMs()) + '</span></span>' };
  return { cls:"good", html:"At the Keep" };
}

    rosterCap() + ' · tap anyone for their history</div>';

  // §9: named heroes appear as recruits only when their zone hits Honored.
  const offers = recruitOffers();
  if (offers.length){
    const rc = el("div", "card");
    let rh = '<h3 style="color:var(--t4)">Word has reached the Keep</h3>' +
      '<div class="tiny muted" style="margin-bottom:8px">Standing in a zone is how ' +
      'you meet the people in it. These will not wait forever.</div>';
    offers.forEach(def => {
      const can = canRecruit(def);
      rh += '<div class="hero recruit" data-r="' + def.name + '">' +
        '<span class="por">' + icon(def.portraitId, 30) + '</span>' +
        '<span class="body"><b>' + def.name + '</b>' +
        '<span class="role">' + def.cls + ' · ' + def.role + ' · from ' +
          (zoneDef(def.homeZone) || {}).name + '</span>' +
        '<span class="chips">' + def.traits.map(id =>
          '<span class="chip">' + (TRAITS[id] ? TRAITS[id].name : id) + '</span>').join("") +
        '</span></span>' +
        '<span class="st"><button class="btn sm ' + (can.ok ? "pri" : "") + '" data-take="' +
          def.name + '"' + (can.ok ? "" : " disabled") + '>Take on</button>' +
          (can.why === "room"
            ? '<br><span class="tiny warn">No room — raise the Great Hall</span>' : '') +
        '</span></div>';
    });
    rc.innerHTML = rh;
    v.appendChild(rc);
    rc.querySelectorAll("button[data-take]").forEach(btn => {
      btn.onclick = () => {
        const def = RECRUITS.filter(r => r.name === btn.dataset.take)[0];
        if (recruit(def)){ toast(def.name + " has taken the Keep's colours"); render(); }
      };

  state.heroes.forEach(h => {
    const inj = injuryDef(h.injury.severity);
    const st = heroStatusLine(h);

    card.setAttribute("role", "button");
    card.tabIndex = 0;
    card.innerHTML =
      '<span class="por">' + icon(h.portraitId || "sym-hero", 30) + '</span>' +
      '<span class="body"><b>' + h.name + '</b>' +
        '<span class="role">' + (subclassDef(h) ? subclassDef(h).name : h.cls) +
          ' · ' + h.role + ' · Level ' + h.level +
          (awaitingSubclass(h) ? ' <span class="branchdot">ready to branch</span>' : '') + '</span>' +
        '<span class="role">' + icon("sym-sword", 11) + ' Power ' + round1(effectivePower(h)) +
          (zonePowerVaries(h)
            ? '<span class="dim" title="varies by zone — see their page">*</span>' : '') +
          (inj ? ' <span class="bad">(-' + pct(inj.powerPenalty) + ')</span>' : '') +
          ' · Gui ' + baseGuile(h) + ' · Gra ' + baseGrace(h) +
          ' · End ' + round1(heroStat(h, "endurance")) + '</span>' +
        '<span class="chips">' +
          (h.traits || []).map(id => '<span class="chip">' +
            (TRAITS[id] ? TRAITS[id].name : id) + '</span>').join("") +
          (h.marks || []).map(m => '<span class="chip mark">' +
            (MARKS[m.id] ? MARKS[m.id].name : m.id) + '</span>').join("") +
        '</span>' +
        (h.fatigue > 0
          ? '<span class="mini fat"><i style="width:' + h.fatigue + '%"></i></span>' +
            '<span class="role">Fatigue ' + Math.round(h.fatigue) + '</span>'
          : '') +
        (h.level < CONFIG.LEVEL_MAX
          ? '<span class="xpbar"><i style="width:' +
              clamp(0, 100, h.xp / xpForLevel(h.level) * 100) + '%"></i></span>' +
            '<span class="role">' + Math.floor(h.xp) + ' / ' + xpForLevel(h.level) + ' XP</span>'

    v.appendChild(card);
  });
}

/* ------------------------------------------------------- hero detail ----- */
/* True when any of this hero's traits make their power zone-dependent, so the
   summary screens can stop quoting one number that is wrong in three places. */
function zonePowerVaries(h){
  const flat = effectivePower(h);
  return CONFIG.ZONES.some(z =>
    Math.abs(effectivePower(h, { zoneId:z.id, danger:z.danger, failed:false }) - flat) > 1e-9);
}

function renderHeroDetail(v){
  const h = heroOf(openHero);
  if (!h){ openHero = null; renderRoster(); return; }
  const inj = injuryDef(h.injury.severity);
  const st = heroStatusLine(h);
  const home = zoneDef(h.homeZone);
  const fx = traitEffects(h);
  v.innerHTML = "";

  const back = el("button", "btn sm", "← The Roster");
  back.style.marginBottom = "10px";
  back.onclick = () => { openHero = null; render(); };
  v.appendChild(back);

  // Scale to the hero's own best attribute, never below 10. Hardcoding 10 meant
  // a levelled hero (starting 9 plus up to +4 over twenty levels) pinned the bar
  // at full and stopped differentiating exactly where growth is the point.
  const maxAttr = Math.max(10, ...Object.keys(h.attrs).map(k => h.attrs[k]));
  const attrRow = (label, val) =>
    '<div class="attr"><span>' + label + '</span>' +
    '<span class="abar"><i style="width:' + clamp(0, 100, (val / maxAttr) * 100) + '%"></i></span>' +
    '<b>' + val + '</b></div>';

  const card = el("div", "card");
  card.innerHTML =
    '<div class="hdet">' +
      '<span class="porbig">' + icon(h.portraitId || "sym-hero", 60) + '</span>' +
      '<span><h2>' + h.name + '</h2>' +
        '<div class="tiny muted">' + h.cls + ' · ' + h.role + ' · Level ' + h.level + '</div>' +
        '<div class="chips">' +
          (home ? '<span class="chip home">' + home.name + '</span>' : '') +
          (h.traits || []).map(id => '<span class="chip">' +
            (TRAITS[id] ? TRAITS[id].name : id) + '</span>').join("") +
          (h.marks || []).map(m => '<span class="chip mark">' +
            (MARKS[m.id] ? MARKS[m.id].name : m.id) + '</span>').join("") +
        '</div>' +
        '<div class="tiny ' + st.cls + '" style="margin-top:6px">' + st.html + '</div>' +
      '</span>' +
    '</div>' +
    (h.hook ? '<div class="hook">' + h.hook + '</div>' : '') +
    '<h3>Attributes</h3><div class="attrs">' +
      attrRow("Might", h.attrs.might) + attrRow("Agility", h.attrs.agility) +
      attrRow("Wits", h.attrs.wits) + attrRow("Spirit", h.attrs.spirit) +
      attrRow("Presence", h.attrs.presence) +
    '</div>' +
    '<div class="derived" style="flex-wrap:wrap">' +
      Object.keys(DERIVED).map(k => {
        const d = DERIVED[k];
        const v = round1(heroStat(h, k));
        const hurt = d.physical && inj;
        return '<span class="muted">' + d.name + ' <b class="' + (hurt ? "bad" : "") + '">' +
               v + '</b></span>';
      }).join("") +
    '</div>' +
    '<div class="tiny dim">Power = Might + Agility · Guile = Wits + Agility · ' +
      'Grace = Presence + Spirit · Endurance = Might + Spirit · Muster = all five.' +
      (inj ? ' A wound bites into Power, Endurance and Muster; Guile and Grace are ' +
             'untouched, so the injured are still the right people for quiet work.' : '') +
    '</div>' +
    // A bare power figure overstates anyone whose traits penalise them away from
    // home -- Ash-Blooded's -10% never shows without a zone. Print all four.
    (zonePowerVaries(h)
      ? '<h3 style="margin-top:11px">Power by zone</h3><div class="attrs">' +
          CONFIG.ZONES.map(z => {
            const p = effectivePower(h, { zoneId:z.id, danger:z.danger, failed:false });
            const flat = effectivePower(h);
            const cls = p > flat + 1e-9 ? "good" : p < flat - 1e-9 ? "bad" : "muted";
            return '<div class="attr"><span style="width:78px">' + z.name + '</span>' +
                   '<b class="' + cls + '" style="width:32px">' + round1(p) + '</b></div>';
          }).join("") +
        '</div>' : '') +
    '<div class="barrow" style="margin-top:9px"><span class="lab">Fatigue</span>' +
      '<span class="bar"><i style="width:' + h.fatigue + '%;background:var(--t3)"></i></span>' +
      '<span class="val num">' + Math.round(h.fatigue) + ' / ' + CONFIG.FATIGUE_MAX + '</span></div>' +
    '<div class="tiny dim">Rests at ' +
      round1(CONFIG.FATIGUE_REST_PER_HOUR * fx.restMult) + ' an hour at the Keep' +
      (fx.fatigueIgnoredBelow !== null
        ? ' · fatigue below ' + fx.fatigueIgnoredBelow + ' costs him nothing' : '') + '</div>';
  v.appendChild(card);

  // The Tier 2 branch (§7). Permanent, so it is presented as a decision.
  if (awaitingSubclass(h)){
    const inField = h.status === "deployed";
    const bcard = el("div", "card branchcard");
    bcard.innerHTML = '<h3 style="color:var(--t4)">Ready to branch</h3>' +
      '<div class="tiny muted" style="margin-bottom:8px">' + h.name +
      ' has reached level ' + CONFIG.SUBCLASS_LEVEL +
      '. This choice is permanent.' +
      (inField ? ' <span class="warn">Not while they are in the field — the odds ' +
                 'of the quest they are on were set before they left.</span>' : '') +
      '</div>' +
      CONFIG.SUBCLASSES[h.cls].map(s =>
        '<div class="trait" data-sub="' + s.id + '">' +
        '<b>' + s.name + '</b><p>' + s.blurb + '</p>' +
        '<button class="btn sm ' + (inField ? "" : "pri") + '" style="margin-top:7px" ' +
        'data-pick="' + s.id + '"' + (inField ? " disabled" : "") + '>Take ' +
        s.name + '</button></div>').join("");
    v.appendChild(bcard);
    bcard.querySelectorAll("button[data-pick]").forEach(btn => {
      btn.onclick = () => {
        if (chooseSubclass(h, btn.dataset.pick)){
          toast(h.name + " is a " + subclassDef(h).name + " now");
          render();
        }
      };
    });
  }

  const tcard = el("div", "card");
  let th = '<h3>Traits</h3>';
  if (!(h.traits || []).length) th += '<div class="stub">No traits of note.</div>';
  (h.traits || []).forEach(id => {
    const t = TRAITS[id];
    if (!t) return;
    th += '<div class="trait"><b>' + t.name + '</b><p>' + t.desc(h) + '</p></div>';
  });
  if ((h.marks || []).length){
    th += '<h3 style="margin-top:11px">Marks</h3>';
    h.marks.forEach(m => {
      const d = MARKS[m.id];
      if (!d) return;
      const can = canLiftMark(h, m.id);
      const cost = sanctumLiftCost();
      const matId = (zoneDef(m.zoneId) || CONFIG.ZONES[0]).material;
      const md = CONFIG.MATERIALS[matId];
      let tail;
      if (keepLevel("sanctum") < 1)
        tail = 'Permanent, unless the Keep raises a Sanctum.';
      else if (can.ok || can.why === "gold" || can.why === "material")
        tail = 'The Sanctum can lift this for ' + icon("sym-gold", 11, "var(--gold)") + ' ' +
               cost.gold + ' and ' + icon(md.sym, 11, md.color) + ' ' + cost.material + ' ' +
               md.name + '.';
      else if (can.why === "deployed")
        tail = 'Nothing about them can be changed while they are in the field.';
      else tail = 'Permanent.';
      th += '<div class="trait mark"><b>' + d.name + '</b><p>' + d.desc(h, m) +
        '</p><p class="dim" style="margin-top:4px">Taken in ' +
        ((zoneDef(m.zoneId) || {}).name || "the field") + '. ' + tail + '</p>' +
        (keepLevel("sanctum") >= 1 && can.why !== "deployed"
          ? '<button class="btn sm" data-lift="' + m.id + '"' +
            (can.ok ? "" : " disabled") + '>Lift this Mark</button>' : '') +
        '</div>';
    });
  }
  const SLOT_LABEL = { weapon:"Weapon", armor:"Armour", trinket:"Trinket" };
  const out = h.status === "deployed";
  th += '<h3 style="margin-top:11px">Gear</h3><div class="gearslots">' +
    CONFIG.GEAR_SLOTS.map(slot => {
      const it = equipped(h, slot);
      return '<span class="gearslot' + (it ? " filled" : "") + '" data-slot="' + slot + '">' +
        '<i>' + SLOT_LABEL[slot] + '</i>' +
        (it ? '<b>' + gearName(it) + '</b>' : '<b class="dim">empty</b>') + '</span>';
    }).join("") + '</div>';
  const anyEquipped = CONFIG.GEAR_SLOTS.some(s => equipped(h, s));
  if (anyEquipped)
    th += '<div class="tiny dim" style="margin-top:6px">' +
      CONFIG.GEAR_SLOTS.filter(s => equipped(h, s)).map(s => {
        const it = equipped(h, s), d = gearDef(it.id);
        return '<b>' + gearName(it) + '</b> — ' + d.flavor;
      }).join('<br>') + '</div>';

  // What is on the shelf that this hero could take, grouped by slot.
  const fits = stash().map((it, i) => ({ it, i, def: gearDef(it.id) })).filter(x => x.def);
  if (out){
    th += '<div class="tiny warn" style="margin-top:8px">' + icon("sym-warn", 11) +
      ' Kit cannot be changed while they are in the field — the odds for that ' +
      'quest were fixed when it was posted.</div>';
  } else if (fits.length){
    th += '<h3 style="margin-top:11px">The Shelf</h3><div class="shelf">' +
      fits.map(x => '<button class="btn sm shelfitem" data-equip="' + x.i + '">' +
        gearName(x.it) + '<span>' + SLOT_LABEL[x.def.slot] + ' · tier ' + gearTier(x.it) +
        '</span></button>').join("") + '</div>';
  } else {
    th += '<div class="tiny dim" style="margin-top:8px">Nothing on the shelf. Gear ' +
      'comes back from Clear, Hunt and Delve work.</div>';
  }
  tcard.innerHTML = th;
  v.appendChild(tcard);

  tcard.querySelectorAll("[data-lift]").forEach(b => {
    b.onclick = () => {
      const name = (MARKS[b.dataset.lift] || {}).name || "the Mark";
      if (liftMark(h, b.dataset.lift)){ toast(name + " lifted."); render(); }
    };
  });
  if (!out){
    tcard.querySelectorAll("[data-equip]").forEach(b => {
      b.onclick = () => {
        if (equipGear(h, Number(b.dataset.equip))) render();
      };
    });
    tcard.querySelectorAll(".gearslot.filled").forEach(n => {
      activatable(n, "Unequip " + gearName(equipped(h, n.dataset.slot)), () => {
        if (unequipGear(h, n.dataset.slot)) render();
        else toast("The shelf is full.");
      });
    });
  }
}

/* ------------------------------------------------------------- keep ------ */
/* What a given level of a building actually does, in the player's language.
   Every field in the level tables is read here or in the accessors, so a tuning
   value cannot be changed without the description following it. */
function keepEffectText(id, level){
  const e = keepEffect(id, level);
  if (!e) return "";
  if (id === "greatHall")
    return "Roster cap <b>" + e.rosterCap + "</b>" +
      (e.influenceBonus > 0 ? " · <b>+" + Math.round(e.influenceBonus * 100) +
        "%</b> influence from every success" : " · no influence bonus yet");
  if (id === "trainingYard")
    return e.xpPerHour > 0
      ? "Resting heroes earn <b>" + e.xpPerHour + " XP</b> an hour"
      : "Resting heroes earn nothing";
  if (id === "infirmary")
    return "Wounds close <b>" + round1(e.healRate) + "×</b> as fast · fatigue recovers at <b>" +
      round1(CONFIG.FATIGUE_REST_PER_HOUR * e.restRate) + "</b> an hour";
  if (id === "warRoom")
    return (e.intel ? "True difficulty shown before you commit" : "No intelligence") +
      (e.expiryBonus > 0 ? " · slate entries last <b>+" +
        Math.round(e.expiryBonus * 100) + "%</b> longer" : "") +
      (e.preview ? " · the next turnover is visible" : "");
  if (id === "sanctum")
    return e.liftGold > 0
      ? "Lift a Mark for <b>" + e.liftGold + "</b> gold and <b>" + e.liftMaterial +
        "</b> of the material where it was taken" +
        (e.markChanceMult < 1 ? " · Marks take hold <b>" +
          Math.round((1 - e.markChanceMult) * 100) + "%</b> less often" : "")
      : "Marks cannot be lifted";
  if (id === "forge")
    return (e.maxTier > 1 ? "Finds up to <b>tier " + e.maxTier + "</b>" : "Only the plainest finds") +
      (e.dropBonus > 0 ? " · <b>+" + Math.round(e.dropBonus * 100) +
        "%</b> chance of a find" : " · no better chance of a find") +
      (e.upgrade ? " · gear can be reforged" : "") +
      (e.salvage ? " · gear can be broken down" : "");
  return "";
}

      '<div class="tiny muted">Four zones answered at once on day <b>' +

        '</b>, held by ' + nameList(state.wonWith || []) + '.</div>' +
      '<div class="tiny dim" style="margin-top:5px">Holding it is a separate question. ' +

  h += '<div class="card"><h3>The Long Aim</h3>' +
    '<div class="tiny muted">Hold ' + CONFIG.WIN_ZONE_COUNT + ' zones at ' +
      CONFIG.TIERS[CONFIG.WIN_MIN_TIER].name + ' or above at the same time.</div>' +
    '<div class="wincount">' +
      state.zones.map(z => '<i class="' +
        (tierIndexFor(z.influence) >= CONFIG.WIN_MIN_TIER ? "on" : "") + '"></i>').join("") +
    '</div>' +
    '<div class="tiny ' + (held >= CONFIG.WIN_ZONE_COUNT ? "good" : "dim") + '">' +
      held + ' of ' + CONFIG.WIN_ZONE_COUNT + ' held' +
      (state.won ? " · the realm remembers your banner" : "") + '</div></div>';

  h += '<div class="card"><h3>Standing, at a glance</h3>';
  state.zones.forEach(z => {
    const zd = zoneDef(z.id), ti = tierIndexFor(z.influence);
    const decay = CONFIG.TIERS[ti].decayPerHour * 24;
    h += '<div class="tiny" style="display:flex;gap:8px;align-items:center;padding:3px 0">' +
      '<span style="flex:1">' + zd.name + '</span>' +
      '<span class="tier t' + ti + '" style="font-size:9.5px">' + CONFIG.TIERS[ti].name + '</span>' +
      '<span class="num muted" style="width:96px;text-align:right">' +
        (decay > 0 ? "−" + round1(decay) + " / day" : "no upkeep") + '</span></div>';
  });
  const totalDecay = state.zones.reduce((n, z) =>
    n + CONFIG.TIERS[tierIndexFor(z.influence)].decayPerHour * 24, 0);
  h += '<div class="tiny" style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px;' +
    'display:flex"><span style="flex:1">Total upkeep</span><b class="num ' +
    (totalDecay > 0 ? "warn" : "dim") + '">' + round1(totalDecay) + ' influence / day</b></div></div>';

  // The Forge's own shelf. It lives on the Keep screen rather than the roster
  // because salvage and reforging are things done to the Keep's holdings, not
  // to a person -- equipping is the part that belongs to a hero.
  const forge = keepEffect("forge");
  if (stash().length || keepLevel("forge") > 0){
    h += '<h3 style="margin-top:12px">The Shelf</h3>';
    h += '<div class="card"><div class="tiny muted" style="margin-bottom:8px">' +
      stash().length + ' of ' + CONFIG.GEAR_STASH_MAX + ' held' +
      (keepLevel("forge") === 0
        ? ' · <span class="warn">a Forge would let this be reworked or broken down</span>'
        : '') + '</div>';
    if (!stash().length){
      h += '<div class="stub">Nothing here. Gear comes back from Clear, Hunt and Delve work.</div>';
    } else {
      h += stash().map((it, i) => {
        const d = gearDef(it.id);
        if (!d) return "";
        const up = canUpgradeGear(it);
        const t = gearTier(it);
        return '<div class="gearrow"><span class="gi"><b>' + gearName(it) + '</b>' +
          '<span class="tiny dim">' + d.slot + ' · tier ' + t + '</span></span>' +
          '<span class="ga">' +
            (forge.upgrade && t < CONFIG.GEAR_TIER_MAX
              ? '<button class="btn sm" data-reforge="' + i + '"' + (up.ok ? "" : " disabled") +
                '>Reforge ' + (up.cost ? icon("sym-gold", 10, "var(--gold)") + up.cost.gold : "") +
                '</button>' : '') +
            (forge.salvage
              ? '<button class="btn sm" data-salv="' + i + '">Break down</button>' : '') +
          '</span></div>';
      }).join("");
    }
    h += '</div>';
  }

  h += '<h3 style="margin-top:12px">Buildings</h3>';
  Object.keys(CONFIG.BUILDINGS).forEach(id => {
    const b = CONFIG.BUILDINGS[id];
    const lv = keepLevel(id);
    const a = keepCanAfford(id);
    h += '<div class="card build" data-b="' + id + '">' +
      '<div class="zhead"><h2 style="font-size:14.5px">' + b.name + '</h2>' +
        '<span class="lvl">' + (lv === 0 ? "Not built" : "Level " + lv) +
        (lv >= b.max ? " · complete" : "") + '</span></div>' +
      '<div class="tiny muted" style="margin-bottom:6px">' + b.blurb + '</div>' +
      '<div class="pips lvlpips">' +
        Array.from({ length: b.max }, (_, i) =>
          '<i class="' + (i < lv ? "on" : "") + '"></i>').join("") + '</div>' +
      '<div class="tiny" style="margin:6px 0 2px">' + keepEffectText(id, lv) + '</div>';

    if (a.maxed){
